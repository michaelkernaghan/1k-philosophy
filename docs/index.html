<header>
<h1>1,000 Philosophical Concepts</h1>
<p class="sub">Indexed, ordered and summarized. Within each branch, concepts run from most to less central.</p>

<script>
const DATA = [{"n": 1, "b": "01", "t": "Being", "s": "The most general question of what it is for anything to exist at all; Parmenides, Aristotle and Heidegger each made it central, asking what \"is\" means across all that is."}, {"n": 2, "b": "01", "t": "Substance", "s": "The underlying bearer of properties that persists through change; for Aristotle the primary reality, for Descartes and Spinoza what depends on nothing else, for Locke an unknowable substratum."}, {"n": 3, "b": "01", "t": "Essence", "s": "What a thing is in itself, those features without which it would not be the thing it is, as opposed to its merely accidental traits."}, {"n": 4, "b": "01", "t": "Existence", "s": "Whether and how anything is actual; Kant argued it is not a real predicate, and Quine held that to be is to be the value of a bound variable."}, {"n": 5, "b": "01", "t": "Universals", "s": "Properties or kinds, such as redness, that many particular things seem to share; the debate is whether they exist beyond their instances."}, {"n": 6, "b": "01", "t": "Particulars", "s": "Individual, unrepeatable things located in space and time, contrasted with the universals they instantiate."}, {"n": 7, "b": "01", "t": "Nominalism", "s": "The view that only particulars exist and that general terms name no shared entities, only similar things or the words we apply to them."}, {"n": 8, "b": "01", "t": "Realism about Universals", "s": "The view that universals exist, either apart from their instances (Plato) or only in them (Aristotle, Armstrong)."}, {"n": 9, "b": "01", "t": "Platonic Forms", "s": "Plato's eternal, perfect, non-physical patterns, such as the Good and the Beautiful, of which sensible things are imperfect copies."}, {"n": 10, "b": "01", "t": "Matter", "s": "The stuff or potential from which things are made; in Aristotle it is what takes form, in modern thought what physics describes."}, {"n": 11, "b": "01", "t": "Hylomorphism", "s": "Aristotle's view that every natural thing is a compound of matter and form, with the form making the matter the kind of thing it is."}, {"n": 12, "b": "01", "t": "Causation", "s": "The relation by which one event or state brings about another; analyses include regularity, counterfactual dependence, and productive power."}, {"n": 13, "b": "01", "t": "Four Causes", "s": "Aristotle's material, formal, efficient and final causes, four distinct ways of answering \"why is this thing as it is?\""}, {"n": 14, "b": "01", "t": "Teleology", "s": "Explanation by purpose or end; Aristotle saw ends in nature, while modern science generally excludes final causes outside agency."}, {"n": 15, "b": "01", "t": "Potentiality and Actuality", "s": "Aristotle's pair for what a thing can become versus what it currently is, used to explain change without making something come from nothing."}, {"n": 16, "b": "01", "t": "Change", "s": "The problem of how a thing can become different yet remain itself; Parmenides denied it and Heraclitus made it fundamental."}, {"n": 17, "b": "01", "t": "Becoming", "s": "Reality understood as ceaseless flux rather than fixed being, associated with Heraclitus, Hegel and Whitehead."}, {"n": 18, "b": "01", "t": "Identity", "s": "The relation each thing bears only to itself; philosophers ask what makes a thing one and the same over time and across descriptions."}, {"n": 19, "b": "01", "t": "Identity of Indiscernibles", "s": "Leibniz's principle that no two distinct things share all their properties; its converse, the indiscernibility of identicals, is uncontroversial."}, {"n": 20, "b": "01", "t": "Leibniz's Law", "s": "If a and b are identical, whatever is true of a is true of b; it is the standard test for ruling out claimed identities."}, {"n": 21, "b": "01", "t": "Persistence", "s": "How an object exists across time, either by being wholly present at each moment (endurance) or by having temporal parts (perdurance)."}, {"n": 22, "b": "01", "t": "Endurantism", "s": "The view that an ordinary object is wholly present at every moment of its existence and has no temporal parts."}, {"n": 23, "b": "01", "t": "Perdurantism", "s": "The view that objects are four-dimensional wholes extended in time, with each moment a temporal part, as developed by Lewis and Sider."}, {"n": 24, "b": "01", "t": "Time", "s": "The dimension of before and after; Augustine and McTaggart asked whether it is real, and physics and metaphysics dispute its direction and flow."}, {"n": 25, "b": "01", "t": "A-Theory of Time", "s": "The view that the passage of time and the distinction of past, present and future are objective features of reality."}, {"n": 26, "b": "01", "t": "Presentism", "s": "The A-theory that only present things exist, so the past is gone and the future is not yet."}, {"n": 27, "b": "01", "t": "B-Theory of Time", "s": "The view that events are ordered only by earlier-than and later-than, and that the flow of time is an illusion of perspective."}, {"n": 28, "b": "01", "t": "Eternalism", "s": "The view that past, present and future events all exist equally, as in the block universe suggested by relativity."}, {"n": 29, "b": "01", "t": "Growing Block Universe", "s": "The view that the past and present exist but the future does not, so reality grows as time passes."}, {"n": 30, "b": "01", "t": "McTaggart's Paradox", "s": "The argument that time is unreal because the A-series is contradictory and the B-series alone cannot give change."}, {"n": 31, "b": "01", "t": "Space", "s": "The arena of spatial relations; the question is whether it is a thing, a container, or just the relations among bodies."}, {"n": 32, "b": "01", "t": "Substantivalism", "s": "The view that space or spacetime is a real entity existing independently of the objects in it, as Newton held."}, {"n": 33, "b": "01", "t": "Relationalism", "s": "The view that space and time are nothing over and above relations among objects and events, as Leibniz argued."}, {"n": 34, "b": "01", "t": "Possibility and Necessity", "s": "The modal notions of what could be and what must be, which give metaphysics its distinction between the contingent and the unavoidable."}, {"n": 35, "b": "01", "t": "Possible Worlds", "s": "Complete ways things might have been, used since Leibniz and Kripke to analyse necessity, possibility and counterfactuals."}, {"n": 36, "b": "01", "t": "Modal Realism", "s": "David Lewis's thesis that possible worlds are as real as our own, concrete and causally isolated from one another."}, {"n": 37, "b": "01", "t": "Actualism", "s": "The view that only actual things exist, so talk of merely possible entities must be reduced to something actual."}, {"n": 38, "b": "01", "t": "Contingency", "s": "The status of what is true but might have been false; Leibniz and Aquinas used it to argue for a necessary ground."}, {"n": 39, "b": "01", "t": "Necessary Being", "s": "A being that cannot fail to exist, invoked in cosmological arguments as the explanation of contingent things."}, {"n": 40, "b": "01", "t": "Principle of Sufficient Reason", "s": "Leibniz's principle that everything has a reason why it is so rather than otherwise."}, {"n": 41, "b": "01", "t": "Essentialism", "s": "The view that some properties are essential to an object, so it could not exist without them."}, {"n": 42, "b": "01", "t": "Haecceity", "s": "The \"thisness\" of an individual, the non-qualitative property that makes it this very thing and no other, a notion due to Duns Scotus."}, {"n": 43, "b": "01", "t": "Individuation", "s": "The question of what makes one thing a single, distinct individual, whether matter, form, location or bare particularity."}, {"n": 44, "b": "01", "t": "Quiddity", "s": "The \"whatness\" of a thing, its essence as answering the question what it is, a term of scholastic philosophy."}, {"n": 45, "b": "01", "t": "Monism", "s": "The view that reality is ultimately one kind of thing, or even one thing, as in Parmenides, Spinoza and Advaita."}, {"n": 46, "b": "01", "t": "Pluralism", "s": "The view that reality comprises many fundamentally distinct entities or kinds, with no single underlying one."}, {"n": 47, "b": "01", "t": "Idealism", "s": "The view that reality is fundamentally mental or dependent on mind, whether Berkeley's ideas, Kant's transcendental form, or Hegel's Spirit."}, {"n": 48, "b": "01", "t": "Materialism", "s": "The view that everything that exists is matter or depends on matter, a thesis traceable to Democritus and Lucretius."}, {"n": 49, "b": "01", "t": "Naturalism", "s": "The view that reality is exhausted by the natural world studied by science, with no supernatural order beyond it."}, {"n": 50, "b": "01", "t": "Emergence", "s": "The idea that complex systems have properties that are not predictable from, or reducible to, those of their parts."}, {"n": 51, "b": "01", "t": "Supervenience", "s": "A dependence relation on which there can be no difference in one domain, such as the mental or moral, without a difference in another."}, {"n": 52, "b": "01", "t": "Reduction", "s": "Explaining one domain, a theory or kind of entity, wholly in terms of another more basic domain."}, {"n": 53, "b": "01", "t": "Grounding", "s": "A relation of metaphysical explanation by which one fact holds in virtue of another, such as the fact that a set exists in virtue of its members."}, {"n": 54, "b": "01", "t": "Fundamentality", "s": "The question of which entities or facts are basic and which are derivative, structuring all of metaphysics."}, {"n": 55, "b": "01", "t": "Mereology", "s": "The formal theory of parts and wholes, asking when objects compose a further object and how parthood behaves."}, {"n": 56, "b": "01", "t": "Composition", "s": "Van Inwagen's Special Composition Question: under what conditions do several things add up to a single object?"}, {"n": 57, "b": "01", "t": "Vagueness", "s": "The fact that many predicates lack sharp boundaries; the issue is whether this is a defect of language, knowledge or reality."}, {"n": 58, "b": "01", "t": "Ship of Theseus", "s": "A puzzle about identity over time: if every plank of a ship is replaced, and the old planks reassembled, which ship is the original?"}, {"n": 59, "b": "01", "t": "Properties", "s": "The qualities and relations things have; the debate is whether they are universals, sets, tropes or something else."}, {"n": 60, "b": "01", "t": "Tropes", "s": "Particularized properties, such as this particular redness of this apple, proposed as the basic building blocks of reality."}, {"n": 61, "b": "01", "t": "Bundle Theory", "s": "The view, taken from Hume, that an object is nothing but a collection of properties with no substratum beyond them."}, {"n": 62, "b": "01", "t": "Natural Kinds", "s": "Categories that carve nature at its joints, such as gold or tiger, as opposed to arbitrary groupings."}, {"n": 63, "b": "01", "t": "Dispositions", "s": "Properties like fragility or solubility, tendencies to manifest in certain conditions, which some hold to be irreducibly basic."}, {"n": 64, "b": "01", "t": "Laws of Nature", "s": "The regularities or necessities governing events; Humeans see them as patterns, while others see real necessitation."}, {"n": 65, "b": "01", "t": "Humean Supervenience", "s": "Lewis's doctrine that all facts supervene on the spatiotemporal arrangement of local qualities, with no necessary connections."}, {"n": 66, "b": "01", "t": "Counterfactuals", "s": "Conditionals about what would have happened had things been otherwise, analysed through possible worlds by Stalnaker and Lewis."}, {"n": 67, "b": "01", "t": "Truthmakers", "s": "The things in the world in virtue of which true statements are true; the question is whether every truth needs one."}, {"n": 68, "b": "01", "t": "Abstract Objects", "s": "Entities like numbers, sets and propositions that are not located in space and time and have no causal power."}, {"n": 69, "b": "01", "t": "Platonism", "s": "The view that abstract objects, especially mathematical ones, exist independently of minds and language."}, {"n": 70, "b": "01", "t": "Fictionalism", "s": "The view that statements about some domain, such as numbers or morals, are useful fictions rather than literal truths."}, {"n": 71, "b": "01", "t": "Events", "s": "Occurrences like a collision or a birth; the debate is whether they are basic particulars or properties of objects at times."}, {"n": 72, "b": "01", "t": "Facts", "s": "What makes true statements true, or true propositions themselves; their status is contested between Russell, Wittgenstein and Strawson."}, {"n": 73, "b": "01", "t": "States of Affairs", "s": "Complexes of an object having a property or objects standing in a relation, taken by Armstrong as the world's basic constituents."}, {"n": 74, "b": "01", "t": "Nothingness", "s": "The idea of absence or non-being; Parmenides banned it, Sartre made it constitutive of consciousness, and Leibniz asked why there is something rather than nothing."}, {"n": 75, "b": "01", "t": "Why Is There Something Rather Than Nothing", "s": "Leibniz's ultimate question of existence, asking why there is a world at all and whether the question has any answer."}, {"n": 76, "b": "01", "t": "Metaontology", "s": "The study of what ontological questions mean, and whether they have objective answers or only answers relative to a framework."}, {"n": 77, "b": "01", "t": "Ontological Commitment", "s": "Quine's idea that a theory is committed to whatever must exist for it to be true, read off from its quantifiers."}, {"n": 78, "b": "01", "t": "Ontological Relativity", "s": "Quine's thesis that what a theory refers to can be fixed only relative to a background language and a mapping to another."}, {"n": 79, "b": "01", "t": "Categories", "s": "The most general kinds of being; Aristotle listed ten, including substance, quantity, quality and relation, and Kant gave twelve concepts of understanding."}, {"n": 80, "b": "01", "t": "Transcendentals", "s": "In scholastic thought, properties of being as such, usually unity, truth and goodness, convertible with being."}, {"n": 81, "b": "01", "t": "Analogy of Being", "s": "The scholastic doctrine that \"being\" applies to God and creatures neither univocally nor equivocally but by analogy."}, {"n": 82, "b": "01", "t": "Esse and Essentia", "s": "Aquinas's distinction between a thing's act of existing and its essence, which in God alone are identical."}, {"n": 83, "b": "01", "t": "Process Philosophy", "s": "The view, from Whitehead, that events and becoming rather than enduring substances are the basic realities."}, {"n": 84, "b": "01", "t": "Monad", "s": "Leibniz's simple, windowless, soul-like substances of which all reality is composed, each mirroring the universe."}, {"n": 85, "b": "01", "t": "Pre-established Harmony", "s": "Leibniz's doctrine that substances do not interact but were created by God to unfold in perfect agreement."}, {"n": 86, "b": "01", "t": "Occasionalism", "s": "The view that God is the only true cause, and created things merely provide occasions for his action."}, {"n": 87, "b": "01", "t": "Neutral Monism", "s": "The view that mind and matter are both made of one neutral stuff, as held by Russell and Mach."}, {"n": 88, "b": "01", "t": "Conatus", "s": "Spinoza's term for the striving of every thing to persevere in its own being, the root of his psychology and ethics."}, {"n": 89, "b": "01", "t": "Accident", "s": "A property a thing has but could lack without ceasing to be what it is, in contrast to its essence."}, {"n": 90, "b": "01", "t": "Mode", "s": "In Spinoza, a particular way a substance is affected; in scholastic thought, a determination of a thing that is neither substance nor accident."}, {"n": 91, "b": "01", "t": "Appearance and Reality", "s": "The distinction between how things seem and how they are, running from Parmenides and Plato through Bradley."}, {"n": 92, "b": "01", "t": "Immanence and Transcendence", "s": "Whether the divine or ultimate lies within the world or beyond it, a division organising pantheism, theism and much modern thought."}, {"n": 93, "b": "01", "t": "Coherentism about Reality", "s": "The idealist view, as in Bradley, that reality is a single coherent whole and that separate things are abstractions from it."}, {"n": 94, "b": "01", "t": "Internal and External Relations", "s": "Whether relations are grounded in the natures of the things related, as monists hold, or can be external to them, as Russell held."}, {"n": 95, "b": "01", "t": "Existence Precedes Essence", "s": "Sartre's claim that a human being first exists and then defines itself by choice, with no fixed nature given in advance."}, {"n": 96, "b": "02", "t": "Knowledge", "s": "Traditionally justified true belief; the field asks what knowing requires and how it differs from mere opinion or luck."}, {"n": 97, "b": "02", "t": "Justified True Belief", "s": "The classical analysis of knowledge from Plato's Theaetetus, attacked by Gettier as insufficient."}, {"n": 98, "b": "02", "t": "Gettier Problem", "s": "Edmund Gettier's 1963 counterexamples showing that justified true belief can arise by luck without being knowledge."}, {"n": 99, "b": "02", "t": "Truth", "s": "The property of statements or beliefs that say how things are; correspondence, coherence and pragmatist accounts compete."}, {"n": 100, "b": "02", "t": "Correspondence Theory of Truth", "s": "Truth consists in agreement with the facts; a belief is true when the world is as it says."}, {"n": 101, "b": "02", "t": "Coherence Theory of Truth", "s": "Truth consists in coherence within a comprehensive system of beliefs, favoured by idealists such as Bradley."}, {"n": 102, "b": "02", "t": "Pragmatic Theory of Truth", "s": "Truth is what works or is warranted in the long run of inquiry, as in Peirce, James and Dewey."}, {"n": 103, "b": "02", "t": "Deflationism about Truth", "s": "The view that calling something true adds nothing beyond asserting it, so truth is not a substantive property."}, {"n": 104, "b": "02", "t": "Belief", "s": "The attitude of taking something to be the case; epistemology asks when it is rational and whether it is voluntary."}, {"n": 105, "b": "02", "t": "Justification", "s": "The standing a belief has when it is properly supported; internalists tie it to what the believer can access, externalists to reliable connection."}, {"n": 106, "b": "02", "t": "Foundationalism", "s": "The view that knowledge rests on basic beliefs that need no further support, with all other justified belief built upon them."}, {"n": 107, "b": "02", "t": "Coherentism", "s": "The view that beliefs are justified by fitting together in a mutually supporting web, with no privileged foundation."}, {"n": 108, "b": "02", "t": "Infinitism", "s": "The view that justification rests on an endless chain of reasons, so that no belief is basic."}, {"n": 109, "b": "02", "t": "Regress Problem", "s": "The worry that every justification needs a further justification, leading to infinite regress, circularity or arbitrary stopping."}, {"n": 110, "b": "02", "t": "Internalism and Externalism", "s": "The dispute over whether justification depends only on factors accessible to the believer or can depend on facts outside awareness."}, {"n": 111, "b": "02", "t": "Reliabilism", "s": "The view that a belief is justified or known if produced by a process that reliably yields true beliefs."}, {"n": 112, "b": "02", "t": "Virtue Epistemology", "s": "The view that knowledge is belief that is true because of the believer's intellectual virtues or competences, as developed by Sosa and Zagzebski."}, {"n": 113, "b": "02", "t": "Skepticism", "s": "The doubt that we have knowledge or justified belief in some domain, a challenge answered rather than ignored by most epistemology."}, {"n": 114, "b": "02", "t": "Pyrrhonian Skepticism", "s": "The ancient practice of suspending judgment in the face of equally balanced arguments in order to reach tranquillity."}, {"n": 115, "b": "02", "t": "Academic Skepticism", "s": "The Hellenistic Academy's view that nothing can be known with certainty, though some beliefs are more probable than others."}, {"n": 116, "b": "02", "t": "Cartesian Doubt", "s": "Descartes' method of withholding assent from whatever can be doubted to find an indubitable foundation, ending in the cogito."}, {"n": 117, "b": "02", "t": "Cogito", "s": "Descartes' \"I think, therefore I am,\" the claim that the very act of doubting guarantees the thinker's existence."}, {"n": 118, "b": "02", "t": "Evil Demon Argument", "s": "Descartes' hypothesis of a deceiver who makes all experience misleading, used to test how much can be known."}, {"n": 119, "b": "02", "t": "Brain in a Vat", "s": "Putnam's modern version of the demon scenario, in which a disembodied brain is fed simulated experience."}, {"n": 120, "b": "02", "t": "Closure Principle", "s": "If one knows p and knows that p entails q, one knows q; skeptical arguments exploit it and some answers deny it."}, {"n": 121, "b": "02", "t": "Contextualism", "s": "The view that the standards for \"knows\" shift with the context of the speaker, so the same claim may be true in one setting and false in another."}, {"n": 122, "b": "02", "t": "Fallibilism", "s": "The view that one can know something even though one's evidence does not rule out error."}, {"n": 123, "b": "02", "t": "Certainty", "s": "A state of complete assurance, which Descartes sought and many later philosophers held to be unattainable for empirical beliefs."}, {"n": 124, "b": "02", "t": "A Priori and A Posteriori", "s": "Knowledge independent of experience versus knowledge that rests on it, a distinction made central by Kant."}, {"n": 125, "b": "02", "t": "Analytic and Synthetic", "s": "Kant's distinction between judgments true by meaning alone and judgments that add information, challenged by Quine."}, {"n": 126, "b": "02", "t": "Synthetic A Priori", "s": "Kant's category of judgments that extend knowledge yet are known independently of experience, such as the claims of mathematics and geometry."}, {"n": 127, "b": "02", "t": "Rationalism", "s": "The view that reason, not sense experience, is the chief source of knowledge, held by Descartes, Spinoza and Leibniz."}, {"n": 128, "b": "02", "t": "Empiricism", "s": "The view that all knowledge derives from experience, held by Locke, Berkeley and Hume."}, {"n": 129, "b": "02", "t": "Innate Ideas", "s": "Concepts or knowledge present in the mind from birth, affirmed by rationalists and denied by Locke."}, {"n": 130, "b": "02", "t": "Tabula Rasa", "s": "Locke's image of the mind as a blank slate on which experience writes."}, {"n": 131, "b": "02", "t": "Sense Data", "s": "The immediate objects of perception, supposed by some philosophers to be what we are directly aware of, rather than physical things."}, {"n": 132, "b": "02", "t": "Perception", "s": "How the mind comes to be aware of the world through the senses, with direct and indirect theories contesting what is perceived."}, {"n": 133, "b": "02", "t": "Direct Realism", "s": "The view that we perceive external objects directly, with nothing mental standing between us and them."}, {"n": 134, "b": "02", "t": "Representative Realism", "s": "The view that we perceive the world through mental representations that stand in for external objects, as in Locke."}, {"n": 135, "b": "02", "t": "Phenomenalism", "s": "The view that physical objects are constructions out of actual and possible sense experiences, advanced by Mill and Ayer."}, {"n": 136, "b": "02", "t": "Problem of Induction", "s": "Hume's challenge that no non-circular argument justifies inferring the unobserved from the observed."}, {"n": 137, "b": "02", "t": "Induction", "s": "Reasoning from observed cases to general conclusions, the engine of empirical science and the target of Hume's doubt."}, {"n": 138, "b": "02", "t": "Abduction", "s": "Inference to the best explanation, introduced by Peirce as reasoning from effects to the hypothesis that would best account for them."}, {"n": 139, "b": "02", "t": "Bayesian Epistemology", "s": "The view that rational belief comes in degrees obeying the probability calculus and is updated by conditionalisation on evidence."}, {"n": 140, "b": "02", "t": "Evidentialism", "s": "The view that one should believe a proposition only to the degree one's evidence supports it, as Clifford and Conee and Feldman maintain."}, {"n": 141, "b": "02", "t": "Pragmatic Encroachment", "s": "The thesis that practical stakes affect whether a belief counts as knowledge."}, {"n": 142, "b": "02", "t": "Testimony", "s": "Knowledge gained by being told; the question is whether trust in others is basic or must be justified by independent checks."}, {"n": 143, "b": "02", "t": "Memory", "s": "The retention of past information; epistemologists ask how it justifies belief and what it means to remember rather than reconstruct."}, {"n": 144, "b": "02", "t": "Epistemic Peer Disagreement", "s": "The problem of what to believe when an equally informed and capable thinker disagrees with you."}, {"n": 145, "b": "02", "t": "Social Epistemology", "s": "The study of knowledge as a social phenomenon, including testimony, expertise, institutions and the spread of belief."}, {"n": 146, "b": "02", "t": "Epistemic Injustice", "s": "Miranda Fricker's term for wrongs done to people as knowers, through testimonial or hermeneutical exclusion."}, {"n": 147, "b": "02", "t": "Standpoint Epistemology", "s": "The view that social position shapes what one can know, and that marginalised standpoints can yield privileged insight into power."}, {"n": 148, "b": "02", "t": "Feminist Epistemology", "s": "A family of views that examine how gender shapes the production and evaluation of knowledge."}, {"n": 149, "b": "02", "t": "Naturalized Epistemology", "s": "Quine's proposal to treat knowledge as a subject for empirical science, replacing normative theory with psychology."}, {"n": 150, "b": "02", "t": "Epistemic Luck", "s": "The way knowledge can be undermined when a belief's truth is due to chance rather than to the believer's competence."}, {"n": 151, "b": "02", "t": "Epistemic Norms", "s": "The standards, such as truth, evidence and coherence, that govern what one ought to believe."}, {"n": 152, "b": "02", "t": "Epistemic Virtue", "s": "Traits like open-mindedness, intellectual courage and carefulness that make a person a good inquirer."}, {"n": 153, "b": "02", "t": "Doxastic Voluntarism", "s": "The question of whether we can choose what to believe, which bears on whether belief can be obligatory."}, {"n": 154, "b": "02", "t": "Pascal's Wager", "s": "Pascal's argument that belief in God is the rational bet given infinite possible reward, which raises the issue of believing on practical grounds."}, {"n": 155, "b": "02", "t": "The Will to Believe", "s": "James's defence of holding a belief without sufficient evidence in genuine, live and momentous options."}, {"n": 156, "b": "02", "t": "Noumenon and Phenomenon", "s": "Kant's contrast between things as they appear and things as they are in themselves, the latter being unknowable."}, {"n": 157, "b": "02", "t": "Thing-in-Itself", "s": "Kant's term for reality as it is independent of our forms of perception, which we can think but never know."}, {"n": 158, "b": "02", "t": "Transcendental Idealism", "s": "Kant's doctrine that space, time and the categories are contributions of the mind, so we know only appearances."}, {"n": 159, "b": "02", "t": "Transcendental Argument", "s": "An argument that identifies necessary conditions of experience or thought, used by Kant and later against skepticism."}, {"n": 160, "b": "02", "t": "The Given", "s": "The supposed immediate, non-conceptual element of experience that grounds knowledge, rejected by Sellars as a myth."}, {"n": 161, "b": "02", "t": "Myth of the Given", "s": "Sellars's attack on the idea that experience provides non-inferential knowledge independent of any conceptual framework."}, {"n": 162, "b": "02", "t": "Two Dogmas of Empiricism", "s": "Quine's critique of the analytic-synthetic distinction and of reductionism, supporting a holistic view of confirmation."}, {"n": 163, "b": "02", "t": "Confirmation Holism", "s": "The Duhem-Quine thesis that hypotheses face the tribunal of experience only together with auxiliary assumptions."}, {"n": 164, "b": "02", "t": "Underdetermination", "s": "The thesis that evidence can fit more than one theory, so data alone cannot decide which is true."}, {"n": 165, "b": "02", "t": "Hinge Epistemology", "s": "Wittgenstein's idea in On Certainty that some propositions are exempt from doubt because they form the framework of inquiry."}, {"n": 166, "b": "02", "t": "Moorean Response", "s": "G. E. Moore's reply to skepticism that he knows he has hands, so that skeptical conclusions are less certain than ordinary knowledge."}, {"n": 167, "b": "02", "t": "Knowledge How and Knowledge That", "s": "Ryle's distinction between practical skill and propositional knowledge, with the dispute over whether the former reduces to the latter."}, {"n": 168, "b": "02", "t": "Self-Knowledge", "s": "Knowledge of one's own mental states, widely thought to be special in being direct and non-observational."}, {"n": 169, "b": "02", "t": "Privileged Access", "s": "The view that one has an authoritative, immediate access to one's own mental states that others lack."}, {"n": 170, "b": "02", "t": "Introspection", "s": "Looking inward at one's own mental states, whose reliability has been challenged by psychology."}, {"n": 171, "b": "02", "t": "Intuition", "s": "A seeming that something is true without explicit inference, treated as evidence in philosophical method."}, {"n": 172, "b": "02", "t": "Thought Experiment", "s": "A scenario devised to test a theory by what we would judge about it, as in Gettier cases and trolley problems."}, {"n": 173, "b": "02", "t": "Experimental Philosophy", "s": "The use of surveys and empirical methods to study the intuitions behind philosophical positions."}, {"n": 174, "b": "02", "t": "Conceptual Analysis", "s": "The attempt to clarify a concept by stating necessary and sufficient conditions for its application."}, {"n": 175, "b": "02", "t": "Reflective Equilibrium", "s": "Rawls's method of adjusting principles and particular judgments until they cohere."}, {"n": 176, "b": "02", "t": "Verificationism", "s": "The view of the logical positivists that a statement is meaningful only if it can be verified empirically or is true by definition."}, {"n": 177, "b": "02", "t": "Falsificationism", "s": "Popper's criterion that scientific claims must be capable of being refuted by observation."}, {"n": 178, "b": "02", "t": "Epistemic Relativism", "s": "The view that what counts as knowledge or justified belief varies with a culture, framework or community."}, {"n": 179, "b": "02", "t": "Paradigm Shift", "s": "Kuhn's term for a revolutionary change in the basic framework of a science, raising questions of incommensurability and progress."}, {"n": 180, "b": "02", "t": "Knowledge First", "s": "Williamson's thesis that knowledge is a basic, unanalysable mental state, not a compound of belief plus other factors."}, {"n": 181, "b": "02", "t": "Safety and Sensitivity", "s": "Modal conditions on knowledge: that one would not easily have believed falsely, or would not have believed had p been false."}, {"n": 182, "b": "02", "t": "Defeaters", "s": "Further evidence that undermines the justification a belief previously had."}, {"n": 183, "b": "02", "t": "Basic Beliefs", "s": "Beliefs that are justified without being inferred from other beliefs, like perceptual or memory beliefs, in foundationalist theory."}, {"n": 184, "b": "02", "t": "Reformed Epistemology", "s": "Plantinga's view that belief in God can be properly basic and justified without arguments."}, {"n": 185, "b": "02", "t": "Wisdom", "s": "Practical and theoretical excellence in understanding and judgment, treated by many traditions as the aim of inquiry beyond knowledge."}, {"n": 186, "b": "02", "t": "Understanding", "s": "A grasp of how things hang together, widely held to be more than mere knowledge of facts."}, {"n": 187, "b": "02", "t": "Hermeneutics", "s": "The theory of interpretation, developed by Schleiermacher, Dilthey and Gadamer, treating understanding as always situated and historical."}, {"n": 188, "b": "02", "t": "Nous", "s": "The Greek term for intellect or intuitive reason, which Plato and Aristotle took to grasp first principles directly and which Plotinus placed second in the hierarchy of being."}, {"n": 189, "b": "03", "t": "Logic", "s": "The study of correct inference, concerned with what follows from what and what makes an argument valid."}, {"n": 190, "b": "03", "t": "Validity", "s": "A property of arguments whose conclusion cannot be false if the premises are true."}, {"n": 191, "b": "03", "t": "Soundness", "s": "A valid argument with true premises, which therefore guarantees a true conclusion."}, {"n": 192, "b": "03", "t": "Deduction", "s": "Reasoning in which the conclusion follows necessarily from the premises, as opposed to induction or abduction."}, {"n": 193, "b": "03", "t": "Syllogism", "s": "Aristotle's form of deduction with two premises and a conclusion, such as \"all men are mortal; Socrates is a man; so Socrates is mortal\"."}, {"n": 194, "b": "03", "t": "Law of Non-Contradiction", "s": "The principle that a proposition and its negation cannot both be true in the same respect, which Aristotle called the firmest of principles."}, {"n": 195, "b": "03", "t": "Law of Excluded Middle", "s": "The principle that every proposition is either true or false, rejected in intuitionistic logic."}, {"n": 196, "b": "03", "t": "Law of Identity", "s": "The principle that each thing is identical with itself, the third traditional law of thought."}, {"n": 197, "b": "03", "t": "Propositional Logic", "s": "The logic of sentences combined by connectives such as \"and\", \"or\", \"not\" and \"if\", independent of their internal structure."}, {"n": 198, "b": "03", "t": "Predicate Logic", "s": "First-order logic, which adds quantifiers and predicates and can express general claims about objects."}, {"n": 199, "b": "03", "t": "Quantifiers", "s": "Expressions such as \"all\" and \"some\" that state how many things satisfy a condition, formalised by Frege."}, {"n": 200, "b": "03", "t": "Material Implication", "s": "The truth-functional \"if... then\" of classical logic, true whenever the antecedent is false, which gives rise to its paradoxes."}, {"n": 201, "b": "03", "t": "Paradoxes of Material Implication", "s": "The oddities that a false statement implies anything and a true one is implied by anything, which motivate relevance logic."}, {"n": 202, "b": "03", "t": "Modal Logic", "s": "The logic of necessity and possibility, given its modern form by C. I. Lewis and Kripke's possible-worlds semantics."}, {"n": 203, "b": "03", "t": "Possible-Worlds Semantics", "s": "Kripke's account of modal truth, on which necessity is truth in all accessible worlds."}, {"n": 204, "b": "03", "t": "Intuitionistic Logic", "s": "Brouwer's constructive logic, which rejects excluded middle and requires that existence claims be backed by a construction."}, {"n": 205, "b": "03", "t": "Constructivism", "s": "The view that mathematical objects exist only if they can be constructed, with truth tied to proof."}, {"n": 206, "b": "03", "t": "Relevance Logic", "s": "A family of logics requiring the premises of a valid argument to be relevant to its conclusion."}, {"n": 207, "b": "03", "t": "Paraconsistent Logic", "s": "Logics that tolerate contradictions without collapsing into triviality, so that not everything follows from a contradiction."}, {"n": 208, "b": "03", "t": "Dialetheism", "s": "Graham Priest's view that some contradictions are true, motivated by the semantic paradoxes."}, {"n": 209, "b": "03", "t": "Many-Valued Logic", "s": "Logics, beginning with Łukasiewicz, that allow truth values beyond true and false."}, {"n": 210, "b": "03", "t": "Fuzzy Logic", "s": "A many-valued approach in which truth comes in degrees, applied to vagueness and to engineering."}, {"n": 211, "b": "03", "t": "Free Logic", "s": "Logic that allows terms that do not refer, avoiding commitments to the existence of what names denote."}, {"n": 212, "b": "03", "t": "Second-Order Logic", "s": "Logic that quantifies over properties and relations as well as individuals, more expressive but lacking a complete proof system."}, {"n": 213, "b": "03", "t": "Completeness Theorem", "s": "Gödel's 1929 result that every valid sentence of first-order logic can be proved."}, {"n": 214, "b": "03", "t": "Incompleteness Theorems", "s": "Gödel's 1931 results that any consistent, sufficiently strong formal system contains true statements it cannot prove and cannot prove its own consistency."}, {"n": 215, "b": "03", "t": "Decidability", "s": "Whether there is an algorithm that settles for every input whether a statement is a theorem; Church and Turing showed first-order logic is undecidable."}, {"n": 216, "b": "03", "t": "Halting Problem", "s": "Turing's proof that no general algorithm can decide whether an arbitrary program halts."}, {"n": 217, "b": "03", "t": "Church-Turing Thesis", "s": "The claim that whatever is effectively computable is computable by a Turing machine."}, {"n": 218, "b": "03", "t": "Computability", "s": "The study of which functions can be calculated by mechanical procedures, central to logic and the philosophy of mind."}, {"n": 219, "b": "03", "t": "Turing Machine", "s": "Turing's abstract model of computation, a tape and a head following simple rules, which defines what is computable."}, {"n": 220, "b": "03", "t": "Proof Theory", "s": "The study of formal proofs and what they establish, associated with Hilbert and Gentzen."}, {"n": 221, "b": "03", "t": "Model Theory", "s": "The study of the relation between formal languages and the structures that satisfy them."}, {"n": 222, "b": "03", "t": "Tarski's Semantic Conception of Truth", "s": "Tarski's definition of truth for formal languages, with the schema that \"snow is white\" is true if and only if snow is white."}, {"n": 223, "b": "03", "t": "Liar Paradox", "s": "The sentence \"this sentence is false\", which is true only if false, and which drives research into truth and self-reference."}, {"n": 224, "b": "03", "t": "Russell's Paradox", "s": "Russell's 1901 discovery that the set of all sets not members of themselves leads to contradiction, undermining naive set theory."}, {"n": 225, "b": "03", "t": "Sorites Paradox", "s": "The paradox of the heap: if removing one grain never turns a heap into a non-heap, then a single grain is a heap."}, {"n": 226, "b": "03", "t": "Epistemicism", "s": "The view that vague predicates have sharp boundaries that we cannot know, defended by Williamson."}, {"n": 227, "b": "03", "t": "Supervaluationism", "s": "An approach to vagueness on which a sentence is true if true on every acceptable way of sharpening its terms."}, {"n": 228, "b": "03", "t": "Paradoxes of Zeno", "s": "Arguments, including Achilles and the Tortoise, that motion and plurality are impossible, which prompted work on infinity and limits."}, {"n": 229, "b": "03", "t": "Infinity", "s": "The notion of the unbounded; philosophers distinguish potential from actual infinity, and Cantor made the latter mathematically respectable."}, {"n": 230, "b": "03", "t": "Actual and Potential Infinity", "s": "Aristotle's distinction between a process that can go on forever and a completed infinite totality."}, {"n": 231, "b": "03", "t": "Set Theory", "s": "The mathematical theory of collections, which Cantor founded and which serves as a foundation for much of mathematics."}, {"n": 232, "b": "03", "t": "Cantor's Theorem", "s": "The proof that no set can be matched one-to-one with its power set, which yields different sizes of infinity."}, {"n": 233, "b": "03", "t": "Continuum Hypothesis", "s": "Cantor's conjecture that there is no infinity between the integers and the reals, shown independent of standard set theory."}, {"n": 234, "b": "03", "t": "Axiom of Choice", "s": "The principle that one can pick an element from each of a collection of non-empty sets, controversial for its non-constructive consequences."}, {"n": 235, "b": "03", "t": "Logicism", "s": "The view of Frege and Russell that mathematics is reducible to logic."}, {"n": 236, "b": "03", "t": "Formalism", "s": "Hilbert's view that mathematics is the manipulation of symbols according to rules, with its meaning found in consistency."}, {"n": 237, "b": "03", "t": "Hilbert's Program", "s": "Hilbert's project of founding mathematics on finitary consistency proofs, undermined by Gödel's second theorem."}, {"n": 238, "b": "03", "t": "Intuitionism", "s": "Brouwer's philosophy of mathematics as mental construction, with truth requiring proof rather than correspondence."}, {"n": 239, "b": "03", "t": "Mathematical Platonism", "s": "The view that mathematical objects are real, abstract and mind-independent, and that we discover rather than invent mathematics."}, {"n": 240, "b": "03", "t": "Structuralism in Mathematics", "s": "The view that mathematics studies structures and positions within them rather than objects with intrinsic natures."}, {"n": 241, "b": "03", "t": "Benacerraf's Dilemma", "s": "The tension between a plausible semantics for mathematics, which requires abstract objects, and a plausible epistemology, which requires causal contact."}, {"n": 242, "b": "03", "t": "Indispensability Argument", "s": "Quine and Putnam's argument that we should believe in mathematical objects because science cannot do without them."}, {"n": 243, "b": "03", "t": "Number", "s": "The nature of numbers, treated by Frege as logical objects, by Dedekind as structures, and by Kant as given in intuition."}, {"n": 244, "b": "03", "t": "Frege's Puzzle", "s": "The problem of how \"a = b\" can be informative though a and b name the same thing, which led Frege to the distinction of sense and reference."}, {"n": 245, "b": "03", "t": "Peano Axioms", "s": "A short set of axioms for the natural numbers, including induction, that characterise arithmetic."}, {"n": 246, "b": "03", "t": "Mathematical Induction", "s": "A proof technique showing that a property holds for all natural numbers if it holds for zero and passes from each number to the next."}, {"n": 247, "b": "03", "t": "Axioms", "s": "Basic statements taken as starting points of a theory, whether as self-evident truths or as stipulations."}, {"n": 248, "b": "03", "t": "Geometry and Non-Euclidean Geometry", "s": "The discovery of consistent geometries denying the parallel postulate, which forced a rethinking of whether space is Euclidean."}, {"n": 249, "b": "03", "t": "Probability", "s": "The study of chance and degrees of belief, whose interpretations include frequency, propensity and subjective credence."}, {"n": 250, "b": "03", "t": "Subjective Probability", "s": "The view that probabilities are degrees of belief constrained only by coherence, defended by Ramsey and de Finetti."}, {"n": 251, "b": "03", "t": "Dutch Book Argument", "s": "The argument that credences violating probability axioms make an agent open to a sure loss in betting."}, {"n": 252, "b": "03", "t": "Decision Theory", "s": "The theory of rational choice under uncertainty, centred on maximising expected utility."}, {"n": 253, "b": "03", "t": "Newcomb's Problem", "s": "A decision puzzle that pits expected-utility reasoning against dominance reasoning when a predictor knows your choice."}, {"n": 254, "b": "03", "t": "Game Theory", "s": "The mathematical study of strategic interaction, which philosophers apply to ethics, convention and social contracts."}, {"n": 255, "b": "03", "t": "Prisoner's Dilemma", "s": "A game in which individually rational choices produce a collectively worse outcome, used to model cooperation and the state of nature."}, {"n": 256, "b": "03", "t": "Social Choice Theory", "s": "The study of how to aggregate individual preferences into collective decisions, with Arrow's theorem showing limits on fair procedures."}, {"n": 257, "b": "03", "t": "Arrow's Impossibility Theorem", "s": "The result that no ranked voting system with several options can satisfy a set of basic fairness conditions."}, {"n": 258, "b": "03", "t": "Fallacy", "s": "A common error in reasoning, such as the ad hominem, the straw man or begging the question."}, {"n": 259, "b": "03", "t": "Begging the Question", "s": "The fallacy of assuming in the premises what the argument claims to prove."}, {"n": 260, "b": "03", "t": "Ad Hominem", "s": "The fallacy of attacking a person rather than the argument that person offers."}, {"n": 261, "b": "03", "t": "Reductio ad Absurdum", "s": "A form of argument that refutes a claim by deriving a contradiction or absurdity from it."}, {"n": 262, "b": "03", "t": "Dialectic", "s": "A method of argument by question, answer and contradiction; Socrates, Hegel and Marx each gave it a distinct role."}, {"n": 263, "b": "03", "t": "Hegelian Dialectic", "s": "Hegel's pattern of development in which a thesis generates its opposite and both are overcome in a higher synthesis."}, {"n": 264, "b": "03", "t": "Conditionals", "s": "Sentences of the form \"if A then B\", whose logic and truth conditions are disputed among material, strict and probabilistic accounts."}, {"n": 265, "b": "03", "t": "Counterfactual Logic", "s": "The logic of \"if it had been the case that A, it would have been B\", analysed with similarity among possible worlds."}, {"n": 266, "b": "03", "t": "Deontic Logic", "s": "The logic of obligation and permission, which formalises what ought to be the case."}, {"n": 267, "b": "03", "t": "Epistemic Logic", "s": "The logic of knowledge and belief, which formalises principles such as the closure of knowledge."}, {"n": 268, "b": "03", "t": "Temporal Logic", "s": "The logic of reasoning about time, developed by Arthur Prior with operators for past and future."}, {"n": 269, "b": "03", "t": "Logical Consequence", "s": "The relation between premises and what follows from them, understood by Tarski in terms of truth preservation across interpretations."}, {"n": 270, "b": "03", "t": "Logical Form", "s": "The underlying structure of a sentence revealed by formalisation, central to Russell's and Frege's approaches."}, {"n": 271, "b": "03", "t": "Logical Pluralism", "s": "The view that more than one logic can be correct, depending on the purposes or notion of consequence at stake."}, {"n": 272, "b": "03", "t": "Logical Positivism", "s": "The Vienna Circle's programme of using logic and empirical verification to dissolve metaphysical questions."}, {"n": 273, "b": "03", "t": "Principia Mathematica", "s": "Whitehead and Russell's attempt to derive mathematics from logic using a theory of types."}, {"n": 274, "b": "03", "t": "Theory of Types", "s": "Russell's hierarchy of entities designed to block paradoxes by forbidding self-referential sets."}, {"n": 275, "b": "03", "t": "Category Theory", "s": "A branch of mathematics that studies structures and the mappings between them, proposed by some as an alternative foundation to set theory."}, {"n": 276, "b": "04", "t": "Meaning", "s": "What words and sentences convey; theories tie it to reference, ideas, use, truth conditions or verification."}, {"n": 277, "b": "04", "t": "Sense and Reference", "s": "Frege's distinction between the object a term picks out and the mode of presentation by which it does so."}, {"n": 278, "b": "04", "t": "Reference", "s": "The relation by which a word or phrase picks out an object, central to theories of names and descriptions."}, {"n": 279, "b": "04", "t": "Proper Names", "s": "Terms like \"Aristotle\" that pick out individuals; descriptivists and causal theorists disagree about how they refer."}, {"n": 280, "b": "04", "t": "Descriptivism", "s": "The view of Frege and Russell that a name refers by means of a description or cluster of descriptions the speaker associates with it."}, {"n": 281, "b": "04", "t": "Causal Theory of Reference", "s": "Kripke's view that a name refers by a chain of communication leading back to an initial baptism, not by descriptions."}, {"n": 282, "b": "04", "t": "Rigid Designation", "s": "Kripke's term for an expression that refers to the same object in every possible world where it exists."}, {"n": 283, "b": "04", "t": "Theory of Descriptions", "s": "Russell's analysis of phrases like \"the present king of France\" as quantified claims rather than names, resolving puzzles about empty terms."}, {"n": 284, "b": "04", "t": "Naming and Necessity", "s": "Kripke's 1972 lectures arguing that names are rigid, that identity statements can be necessary a posteriori, and that essences exist."}, {"n": 285, "b": "04", "t": "Necessary A Posteriori", "s": "Truths like \"water is H2O\" that are necessary yet knowable only through experience."}, {"n": 286, "b": "04", "t": "Contingent A Priori", "s": "Truths such as \"the standard metre is one metre long\", knowable without experience yet not necessary, as Kripke argued."}, {"n": 287, "b": "04", "t": "Two-Dimensionalism", "s": "A framework that assigns expressions both a primary intension, tied to how we pick things out, and a secondary one, tied to what they pick out in worlds."}, {"n": 288, "b": "04", "t": "Direct Reference Theory", "s": "The view that the meaning of a name or indexical is just its referent, defended by Kaplan and Salmon."}, {"n": 289, "b": "04", "t": "Indexicals", "s": "Words like \"I\", \"here\" and \"now\" whose reference depends on context, analysed by Kaplan as having a stable character."}, {"n": 290, "b": "04", "t": "Character and Content", "s": "Kaplan's distinction between the rule that fixes reference in context and the proposition expressed in a particular context."}, {"n": 291, "b": "04", "t": "Propositions", "s": "The objects of belief and the bearers of truth, thought of as what sentences express across languages."}, {"n": 292, "b": "04", "t": "Truth-Conditional Semantics", "s": "The view, from Davidson and Tarski, that to give a sentence's meaning is to state the conditions under which it is true."}, {"n": 293, "b": "04", "t": "Compositionality", "s": "The principle that the meaning of a complex expression is determined by the meanings of its parts and how they are combined."}, {"n": 294, "b": "04", "t": "Context Principle", "s": "Frege's maxim that words have meaning only in the context of a sentence."}, {"n": 295, "b": "04", "t": "Ideational Theory of Meaning", "s": "Locke's view that words signify the ideas in the speaker's mind."}, {"n": 296, "b": "04", "t": "Use Theory of Meaning", "s": "Wittgenstein's thesis that the meaning of a word is its use in the language."}, {"n": 297, "b": "04", "t": "Language Games", "s": "Wittgenstein's term for the activities in which words are embedded, stressing that meaning is rooted in shared practice."}, {"n": 298, "b": "04", "t": "Private Language Argument", "s": "Wittgenstein's argument that a language whose words refer to a speaker's inner sensations alone, and that no one else can understand, is impossible."}, {"n": 299, "b": "04", "t": "Rule-Following", "s": "Wittgenstein's puzzle about what makes a use of a word correct, which Kripke read as a skeptical paradox about meaning."}, {"n": 300, "b": "04", "t": "Kripkenstein", "s": "Kripke's reading of Wittgenstein's rule-following considerations, claiming that no fact about me fixes what I mean by \"plus\"."}, {"n": 301, "b": "04", "t": "Family Resemblance", "s": "Wittgenstein's idea that concepts like \"game\" are unified by overlapping similarities, not by a common essence."}, {"n": 302, "b": "04", "t": "Picture Theory of Meaning", "s": "The Tractatus view that a proposition is a picture of a possible state of affairs, sharing its logical form with reality."}, {"n": 303, "b": "04", "t": "Said and Shown", "s": "The Tractarian distinction between what can be stated and what can only be shown by the form of language."}, {"n": 304, "b": "04", "t": "Ordinary Language Philosophy", "s": "The Oxford approach of Austin and Ryle that philosophical problems arise from, and can be dissolved by attention to, everyday usage."}, {"n": 305, "b": "04", "t": "Speech Acts", "s": "Austin's and Searle's idea that to say something is to do something, such as promising, warning or asserting."}, {"n": 306, "b": "04", "t": "Performative Utterance", "s": "A statement like \"I promise\" that performs an action by being uttered, rather than describing it."}, {"n": 307, "b": "04", "t": "Illocutionary Force", "s": "The kind of act, such as asking, ordering or asserting, performed in saying something."}, {"n": 308, "b": "04", "t": "Implicature", "s": "Grice's term for what a speaker suggests without saying, governed by shared conversational maxims."}, {"n": 309, "b": "04", "t": "Cooperative Principle", "s": "Grice's idea that conversation is governed by norms of quantity, quality, relation and manner."}, {"n": 310, "b": "04", "t": "Pragmatics", "s": "The study of how context contributes to meaning beyond the literal content of sentences."}, {"n": 311, "b": "04", "t": "Presupposition", "s": "What a statement takes for granted, such as the existence of a king in \"the king is bald\", and whose failure leaves it neither true nor false, on Strawson's view."}, {"n": 312, "b": "04", "t": "Semantic Externalism", "s": "The thesis, from Putnam and Burge, that meaning and content depend partly on the environment and not just on the head."}, {"n": 313, "b": "04", "t": "Twin Earth", "s": "Putnam's thought experiment in which an identical-seeming liquid with a different chemistry shows that \"meaning ain't in the head\"."}, {"n": 314, "b": "04", "t": "Radical Translation", "s": "Quine's thought experiment about interpreting a wholly unknown language, used to argue that meaning is indeterminate."}, {"n": 315, "b": "04", "t": "Indeterminacy of Translation", "s": "Quine's thesis that many incompatible translation manuals fit all the behavioural evidence equally well."}, {"n": 316, "b": "04", "t": "Gavagai", "s": "Quine's example of a native word used when a rabbit is seen, which cannot be pinned to \"rabbit\" rather than \"undetached rabbit part\"."}, {"n": 317, "b": "04", "t": "Principle of Charity", "s": "Davidson's and Quine's maxim that interpretation should maximise the truth and rationality of the speaker's beliefs."}, {"n": 318, "b": "04", "t": "Radical Interpretation", "s": "Davidson's extension of Quine's idea, in which a theory of truth for a speaker's language is built from evidence of what they hold true."}, {"n": 319, "b": "04", "t": "Natural Language and Formal Language", "s": "The contrast between languages that grew up spontaneously and artificial languages with explicit syntax and semantics, as in the ideal language tradition."}, {"n": 320, "b": "04", "t": "Linguistic Turn", "s": "The twentieth-century shift in philosophy toward analysing language as the means of solving or dissolving philosophical problems."}, {"n": 321, "b": "04", "t": "Sapir-Whorf Hypothesis", "s": "The thesis that the language one speaks shapes or limits one's thought, in strong and weak versions."}, {"n": 322, "b": "04", "t": "Universal Grammar", "s": "Chomsky's proposal of an innate faculty that underlies the grammars of all human languages."}, {"n": 323, "b": "04", "t": "Poverty of the Stimulus", "s": "Chomsky's argument that children learn language from too little evidence to do so without innate structure."}, {"n": 324, "b": "04", "t": "Innateness of Language", "s": "The thesis that humans are born with specifically linguistic knowledge, central to the rationalist side of cognitive science."}, {"n": 325, "b": "04", "t": "Syntax and Semantics", "s": "The distinction between the formal rules that govern sentence structure and the meanings those structures carry."}, {"n": 326, "b": "04", "t": "Metaphor", "s": "Figurative speech in which one thing is described in terms of another, raising the question of whether it has a distinctive meaning."}, {"n": 327, "b": "04", "t": "Ambiguity", "s": "The presence of more than one meaning in an expression, which logical analysis seeks to disentangle."}, {"n": 328, "b": "04", "t": "Analytic Philosophy", "s": "The tradition, from Frege, Russell and Moore, that prizes clarity, logical analysis and close argument."}, {"n": 329, "b": "04", "t": "Emotivism", "s": "The view of Ayer and Stevenson that moral statements express attitudes and do not state facts."}, {"n": 330, "b": "04", "t": "Expressivism", "s": "The wider view that certain statements, notably moral ones, express mental states other than belief."}, {"n": 331, "b": "04", "t": "Prescriptivism", "s": "R. M. Hare's view that moral judgments are universalisable commands telling us what to do."}, {"n": 332, "b": "04", "t": "Speech and Writing", "s": "Derrida's critique of the tradition's privileging of speech as present meaning over writing as a derivative sign."}, {"n": 333, "b": "04", "t": "Différance", "s": "Derrida's coinage for the play of difference and deferral that makes meaning possible and never fully stable."}, {"n": 334, "b": "04", "t": "Deconstruction", "s": "Derrida's mode of reading that exposes the tensions and hierarchies on which texts depend, so that their meaning is unstable."}, {"n": 335, "b": "04", "t": "Structuralism", "s": "The approach, from Saussure and Lévi-Strauss, of explaining phenomena by their position in systems of relations."}, {"n": 336, "b": "04", "t": "Signifier and Signified", "s": "Saussure's two sides of the linguistic sign: the sound-image and the concept it evokes, linked arbitrarily."}, {"n": 337, "b": "04", "t": "Semiotics", "s": "The general study of signs and their meaning, developed by Peirce and Saussure."}, {"n": 338, "b": "04", "t": "Peirce's Triad of Signs", "s": "Peirce's classification of signs as icons, indices and symbols by their relation to what they stand for."}, {"n": 339, "b": "04", "t": "Discourse", "s": "Structured ways of speaking that shape what can be said and known, a central concept for Foucault."}, {"n": 340, "b": "04", "t": "Hermeneutic Circle", "s": "The idea that interpreting a whole requires understanding its parts, and understanding the parts requires some grasp of the whole."}, {"n": 341, "b": "05", "t": "Mind-Body Problem", "s": "The question of how mental states relate to the physical body and brain, central to philosophy since Descartes."}, {"n": 342, "b": "05", "t": "Substance Dualism", "s": "Descartes' view that mind and body are two distinct kinds of substance, one thinking and unextended, the other extended and unthinking."}, {"n": 343, "b": "05", "t": "Property Dualism", "s": "The view that there is one kind of substance, but mental properties are not reducible to physical ones."}, {"n": 344, "b": "05", "t": "Interaction Problem", "s": "The difficulty of explaining how an immaterial mind could causally affect a material body, pressed by Princess Elisabeth against Descartes."}, {"n": 345, "b": "05", "t": "Epiphenomenalism", "s": "The view that mental states are caused by physical processes but have no causal effect on them."}, {"n": 346, "b": "05", "t": "Physicalism", "s": "The view that everything, including mental states, is physical or depends on the physical."}, {"n": 347, "b": "05", "t": "Identity Theory", "s": "The view of Place and Smart that mental states are identical with brain states."}, {"n": 348, "b": "05", "t": "Multiple Realizability", "s": "The idea, due to Putnam, that the same mental state can be realised in different physical systems, an objection to type identity."}, {"n": 349, "b": "05", "t": "Functionalism", "s": "The view that mental states are defined by their causal roles in relation to inputs, outputs and other states, not by their material makeup."}, {"n": 350, "b": "05", "t": "Behaviourism", "s": "The view that mental states are dispositions to behave, and that psychology should concern only observable behaviour."}, {"n": 351, "b": "05", "t": "Eliminative Materialism", "s": "The view of the Churchlands that folk psychology is a false theory and that beliefs and desires will be replaced by neuroscience."}, {"n": 352, "b": "05", "t": "Folk Psychology", "s": "Our everyday framework of explaining behaviour by beliefs and desires, whose scientific standing is disputed."}, {"n": 353, "b": "05", "t": "Anomalous Monism", "s": "Davidson's view that each mental event is a physical event but that there are no strict psychophysical laws."}, {"n": 354, "b": "05", "t": "Consciousness", "s": "The having of subjective experience, the central puzzle of the philosophy of mind."}, {"n": 355, "b": "05", "t": "Hard Problem of Consciousness", "s": "Chalmers's question of why physical processes give rise to subjective experience at all."}, {"n": 356, "b": "05", "t": "Qualia", "s": "The intrinsic, subjectively experienced qualities of mental states, such as the redness of red."}, {"n": 357, "b": "05", "t": "What Is It Like to Be a Bat", "s": "Nagel's argument that consciousness has an irreducibly subjective character that objective science cannot capture."}, {"n": 358, "b": "05", "t": "Knowledge Argument", "s": "Jackson's story of Mary, a colour scientist who learns something new on seeing red for the first time, thought to refute physicalism."}, {"n": 359, "b": "05", "t": "Explanatory Gap", "s": "Levine's term for the gap between physical explanations of the brain and an explanation of why there is experience."}, {"n": 360, "b": "05", "t": "Philosophical Zombie", "s": "Chalmers's imagined being physically identical to us but lacking consciousness, used to argue against physicalism."}, {"n": 361, "b": "05", "t": "Inverted Spectrum", "s": "The thought experiment of a person whose colour experiences are systematically swapped with ours without any behavioural difference."}, {"n": 362, "b": "05", "t": "Panpsychism", "s": "The view that mind or experience is a fundamental feature of all matter."}, {"n": 363, "b": "05", "t": "Mysterianism", "s": "McGinn's view that the mind-body problem is real but beyond the cognitive reach of human beings."}, {"n": 364, "b": "05", "t": "Higher-Order Theories", "s": "Theories on which a mental state is conscious when one has a higher-order thought or perception of it."}, {"n": 365, "b": "05", "t": "Global Workspace Theory", "s": "Baars's view that consciousness is the broadcasting of information to many cognitive systems at once."}, {"n": 366, "b": "05", "t": "Integrated Information Theory", "s": "Tononi's view that consciousness corresponds to a system's integrated information, measured by phi."}, {"n": 367, "b": "05", "t": "Access and Phenomenal Consciousness", "s": "Block's distinction between information available for reasoning and action, and the raw experience itself."}, {"n": 368, "b": "05", "t": "Intentionality", "s": "The \"aboutness\" of mental states, their directedness at objects or states of affairs, which Brentano called the mark of the mental."}, {"n": 369, "b": "05", "t": "Brentano's Thesis", "s": "Brentano's claim that intentionality distinguishes the mental from the physical."}, {"n": 370, "b": "05", "t": "Mental Representation", "s": "The idea that thought involves internal states that stand for things beyond themselves."}, {"n": 371, "b": "05", "t": "Language of Thought", "s": "Fodor's hypothesis that thinking takes place in an inner symbolic system with syntax and compositional semantics."}, {"n": 372, "b": "05", "t": "Computational Theory of Mind", "s": "The view that mental processes are computations over mental representations."}, {"n": 373, "b": "05", "t": "Chinese Room", "s": "Searle's thought experiment showing that symbol manipulation alone does not suffice for understanding."}, {"n": 374, "b": "05", "t": "Strong and Weak AI", "s": "Searle's distinction between the claim that a suitably programmed computer has a mind and the claim that it merely models one."}, {"n": 375, "b": "05", "t": "Turing Test", "s": "Turing's proposal that a machine that is indistinguishable from a human in conversation should count as thinking."}, {"n": 376, "b": "05", "t": "Artificial Intelligence", "s": "The project of building machines that perform tasks requiring intelligence, which poses questions of understanding and moral status."}, {"n": 377, "b": "05", "t": "Connectionism", "s": "The approach that models cognition with networks of simple interconnected units rather than explicit symbolic rules."}, {"n": 378, "b": "05", "t": "Frame Problem", "s": "The difficulty of specifying which things change and which stay the same when an agent acts, a challenge for artificial intelligence."}, {"n": 379, "b": "05", "t": "Extended Mind", "s": "Clark and Chalmers's thesis that cognitive processes can extend into tools and the environment, such as a notebook serving as memory."}, {"n": 380, "b": "05", "t": "Embodied Cognition", "s": "The view that cognition depends on the body and its interactions with the world, not just on the brain."}, {"n": 381, "b": "05", "t": "Enactivism", "s": "The view that minds arise from the active engagement of organisms with their environments."}, {"n": 382, "b": "05", "t": "4E Cognition", "s": "The umbrella view that cognition is embodied, embedded, enacted and extended."}, {"n": 383, "b": "05", "t": "Predictive Processing", "s": "The theory that the brain continually generates predictions about its inputs and learns by reducing prediction error."}, {"n": 384, "b": "05", "t": "Mental Causation", "s": "The problem of how mental states can cause behaviour if the physical realm is causally closed."}, {"n": 385, "b": "05", "t": "Causal Closure of the Physical", "s": "The principle that every physical event with a cause has a sufficient physical cause."}, {"n": 386, "b": "05", "t": "Exclusion Argument", "s": "Kim's argument that mental causation is threatened by sufficient physical causes, leaving no work for the mental."}, {"n": 387, "b": "05", "t": "Mental Content", "s": "What a thought is about or says; narrow content is fixed by the head, broad content also by the environment."}, {"n": 388, "b": "05", "t": "Propositional Attitudes", "s": "Mental states, such as belief and desire, that take a proposition as their object."}, {"n": 389, "b": "05", "t": "Belief-Desire Psychology", "s": "The model on which actions are explained by what an agent wants and believes."}, {"n": 390, "b": "05", "t": "Emotions", "s": "Affective states such as fear and anger; accounts treat them as feelings, judgments, or embodied appraisals."}, {"n": 391, "b": "05", "t": "Moods", "s": "Diffuse affective states without a specific object, such as anxiety or elation, studied in phenomenology."}, {"n": 392, "b": "05", "t": "Imagination", "s": "The capacity to represent what is not present, important to thought, fiction and modal knowledge."}, {"n": 393, "b": "05", "t": "Perception and Illusion", "s": "The study of how we see the world and how experience can mislead, raising questions about the nature of appearance."}, {"n": 394, "b": "05", "t": "Disjunctivism", "s": "The view that veridical perception and hallucination are fundamentally different kinds of state, not a common experience."}, {"n": 395, "b": "05", "t": "Representationalism", "s": "The view that the phenomenal character of experience is exhausted by what it represents."}, {"n": 396, "b": "05", "t": "Attention", "s": "The selective focus of mind on certain items, studied for its role in consciousness and perception."}, {"n": 397, "b": "05", "t": "Unity of Consciousness", "s": "The fact that experiences are experienced together as belonging to a single subject."}, {"n": 398, "b": "05", "t": "Binding Problem", "s": "The puzzle of how features processed in different brain areas are combined into a single unified experience."}, {"n": 399, "b": "05", "t": "Split Brain", "s": "Cases, after severing of the corpus callosum, that suggest a single person may have divided consciousness."}, {"n": 400, "b": "05", "t": "Self", "s": "The subject of experience; theories range from an enduring soul to a bundle of perceptions to a narrative construction."}, {"n": 401, "b": "05", "t": "Bundle Theory of the Self", "s": "Hume's claim that the self is nothing but a bundle of perceptions in perpetual flux."}, {"n": 402, "b": "05", "t": "No-Self", "s": "The Buddhist and Humean view that there is no unchanging self underlying experience."}, {"n": 403, "b": "05", "t": "Narrative Self", "s": "The idea that selfhood is constituted by the stories we tell about our lives."}, {"n": 404, "b": "05", "t": "Minimal Self", "s": "The pre-reflective sense of being the subject of experience, defended by phenomenologists and Gallagher and Zahavi."}, {"n": 405, "b": "05", "t": "Other Minds", "s": "The problem of how we can know that others have minds, given that we perceive only their behaviour."}, {"n": 406, "b": "05", "t": "Theory of Mind", "s": "The capacity to attribute mental states to others, studied through theory-theory and simulation accounts."}, {"n": 407, "b": "05", "t": "Simulation Theory", "s": "The view that we understand others by simulating their mental states in ourselves."}, {"n": 408, "b": "05", "t": "Animal Minds", "s": "Questions of whether and how animals think and feel, with consequences for ethics."}, {"n": 409, "b": "06", "t": "The Good", "s": "What is worth pursuing or valuing; Plato placed the Form of the Good at the summit of reality and ethics asks what makes things good."}, {"n": 410, "b": "06", "t": "Virtue", "s": "A stable trait of character that enables excellent action, central to Aristotle's ethics."}, {"n": 411, "b": "06", "t": "Virtue Ethics", "s": "The approach that makes character, not rules or consequences, the basis of morality."}, {"n": 412, "b": "06", "t": "Eudaimonia", "s": "Aristotle's term for human flourishing, the final end of life, achieved through virtuous activity."}, {"n": 413, "b": "06", "t": "Doctrine of the Mean", "s": "Aristotle's view that each virtue lies between an excess and a deficiency, such as courage between rashness and cowardice."}, {"n": 414, "b": "06", "t": "Practical Wisdom", "s": "Aristotle's phronesis, the capacity to see what to do in particular situations, which unifies the virtues."}, {"n": 415, "b": "06", "t": "Cardinal Virtues", "s": "Wisdom, courage, temperance and justice, the four hinge virtues of the classical tradition."}, {"n": 416, "b": "06", "t": "Habituation", "s": "Aristotle's idea that virtues are acquired by practice, becoming second nature."}, {"n": 417, "b": "06", "t": "Akrasia", "s": "Weakness of will, acting against one's better judgment, which Socrates denied was possible."}, {"n": 418, "b": "06", "t": "Socratic Intellectualism", "s": "Socrates' view that virtue is knowledge and that no one does wrong knowingly."}, {"n": 419, "b": "06", "t": "Unity of the Virtues", "s": "The thesis that the virtues are inseparable, so that one cannot truly have one without the others."}, {"n": 420, "b": "06", "t": "Consequentialism", "s": "The view that the rightness of an act depends only on its outcomes."}, {"n": 421, "b": "06", "t": "Utilitarianism", "s": "The view of Bentham and Mill that the right act maximises overall happiness or welfare."}, {"n": 422, "b": "06", "t": "Principle of Utility", "s": "Bentham's principle that actions are right in proportion as they tend to promote happiness and wrong as they tend to produce its reverse."}, {"n": 423, "b": "06", "t": "Hedonism", "s": "The view that pleasure is the only intrinsic good and pain the only intrinsic evil."}, {"n": 424, "b": "06", "t": "Higher and Lower Pleasures", "s": "Mill's distinction holding that intellectual pleasures are intrinsically more valuable than bodily ones."}, {"n": 425, "b": "06", "t": "Act and Rule Utilitarianism", "s": "The contrast between judging each act by its consequences and judging acts by rules whose general adoption would be best."}, {"n": 426, "b": "06", "t": "Preference Utilitarianism", "s": "The view that what matters is the satisfaction of preferences, developed by Hare and Singer."}, {"n": 427, "b": "06", "t": "Welfare and Well-Being", "s": "Theories of what makes a life go well, whether pleasure, desire satisfaction or objective goods."}, {"n": 428, "b": "06", "t": "Experience Machine", "s": "Nozick's thought experiment designed to show that we value more than pleasurable experiences."}, {"n": 429, "b": "06", "t": "Repugnant Conclusion", "s": "Parfit's result that total utilitarianism implies a vast population with lives barely worth living would be better than a smaller flourishing one."}, {"n": 430, "b": "06", "t": "Deontology", "s": "The view that some acts are right or wrong in themselves, regardless of their consequences."}, {"n": 431, "b": "06", "t": "Categorical Imperative", "s": "Kant's supreme principle of morality, commanding that we act only on maxims we could will as universal laws."}, {"n": 432, "b": "06", "t": "Hypothetical Imperative", "s": "A command of reason that tells us what to do given a goal we already have, in contrast to a categorical one."}, {"n": 433, "b": "06", "t": "Universal Law Formula", "s": "The first version of Kant's imperative, which tests maxims by whether they can be universalised without contradiction."}, {"n": 434, "b": "06", "t": "Humanity Formula", "s": "Kant's imperative to treat humanity, in oneself and others, always as an end and never merely as a means."}, {"n": 435, "b": "06", "t": "Good Will", "s": "Kant's claim that the only thing good without qualification is a will that acts from duty."}, {"n": 436, "b": "06", "t": "Duty", "s": "What morality requires of us; Kant held that actions have moral worth only when done from respect for duty."}, {"n": 437, "b": "06", "t": "Autonomy", "s": "Self-governance; for Kant, the will's giving itself the moral law."}, {"n": 438, "b": "06", "t": "Dignity", "s": "The unconditional worth of persons, which Kant opposed to price."}, {"n": 439, "b": "06", "t": "Moral Law", "s": "The principle of morality that binds all rational beings, for Kant given by reason."}, {"n": 440, "b": "06", "t": "Prima Facie Duties", "s": "W. D. Ross's idea of several duties, each binding unless outweighed by another in a given situation."}, {"n": 441, "b": "06", "t": "Rights Theory", "s": "The view that moral standing is expressed in individual rights, which limit what may be done to persons."}, {"n": 442, "b": "06", "t": "Natural Rights", "s": "Rights held to belong to people as such, independent of any government, as in Locke."}, {"n": 443, "b": "06", "t": "Human Rights", "s": "Fundamental claims all persons hold by virtue of their humanity, enshrined in modern declarations."}, {"n": 444, "b": "06", "t": "Contractualism", "s": "Scanlon's view that an act is wrong if it is forbidden by principles no one could reasonably reject."}, {"n": 445, "b": "06", "t": "Social Contract Ethics", "s": "The view that morality consists in rules agreed upon by rational persons for mutual benefit."}, {"n": 446, "b": "06", "t": "Ethics of Care", "s": "The view of Gilligan and Noddings that morality centres on relationships and attentiveness to particular others."}, {"n": 447, "b": "06", "t": "Moral Particularism", "s": "The view that morality has no general principles and that moral reasons depend on the case."}, {"n": 448, "b": "06", "t": "Moral Realism", "s": "The view that there are objective moral facts independent of what anyone thinks."}, {"n": 449, "b": "06", "t": "Anti-Realism in Ethics", "s": "The family of views denying that there are mind-independent moral facts."}, {"n": 450, "b": "06", "t": "Error Theory", "s": "Mackie's view that moral claims aim at objective truth but are all false because no such facts exist."}, {"n": 451, "b": "06", "t": "Moral Relativism", "s": "The view that moral truth or justification is relative to a culture or individual."}, {"n": 452, "b": "06", "t": "Cultural Relativism", "s": "The thesis that moral standards vary with culture and have no independent authority."}, {"n": 453, "b": "06", "t": "Moral Nihilism", "s": "The view that nothing is morally right or wrong, or that moral claims have no truth."}, {"n": 454, "b": "06", "t": "Naturalism in Ethics", "s": "The view that moral properties are natural properties that science can study."}, {"n": 455, "b": "06", "t": "Non-Naturalism", "s": "Moore's view that goodness is a simple, indefinable, non-natural property."}, {"n": 456, "b": "06", "t": "Naturalistic Fallacy", "s": "Moore's charge that it is an error to define \"good\" in terms of any natural property."}, {"n": 457, "b": "06", "t": "Is-Ought Problem", "s": "Hume's observation that one cannot derive an ought from an is without a further evaluative premise."}, {"n": 458, "b": "06", "t": "Open Question Argument", "s": "Moore's argument that \"is it good?\" stays open whatever natural property we name, so good is not identical to it."}, {"n": 459, "b": "06", "t": "Moral Sentimentalism", "s": "The view of Hume and Smith that morality is grounded in sentiments such as sympathy."}, {"n": 460, "b": "06", "t": "Sympathy", "s": "In Hume and Smith, the capacity to feel with others, which underlies moral approval."}, {"n": 461, "b": "06", "t": "Impartial Spectator", "s": "Adam Smith's imagined fair observer, whose approval is the standard of conduct."}, {"n": 462, "b": "06", "t": "Moral Intuitionism", "s": "The view that we know basic moral truths directly, without inference."}, {"n": 463, "b": "06", "t": "Constructivism in Ethics", "s": "The view that moral truths are determined by the outcome of an idealised procedure of reasoning."}, {"n": 464, "b": "06", "t": "Divine Command Theory", "s": "The view that morality consists in the commands of God."}, {"n": 465, "b": "06", "t": "Euthyphro Dilemma", "s": "Plato's question whether the pious is loved by the gods because it is pious, or pious because it is loved."}, {"n": 466, "b": "06", "t": "Natural Law", "s": "The view, from Aquinas, that moral principles are grounded in human nature and discoverable
