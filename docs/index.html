 by reason."}, {"n": 467, "b": "06", "t": "Doctrine of Double Effect", "s": "The principle that a harm may be permissible as a foreseen side effect though impermissible as an intended means."}, {"n": 468, "b": "06", "t": "Doing and Allowing", "s": "The distinction between causing harm and failing to prevent it, which many hold to differ morally."}, {"n": 469, "b": "06", "t": "Trolley Problem", "s": "Foot's and Thomson's dilemmas about diverting a runaway trolley, probing the limits of consequentialism and deontology."}, {"n": 470, "b": "06", "t": "Supererogation", "s": "Acts that are good but beyond the call of duty."}, {"n": 471, "b": "06", "t": "Moral Luck", "s": "Williams's and Nagel's puzzle that we are judged by factors beyond our control."}, {"n": 472, "b": "06", "t": "Moral Responsibility", "s": "The conditions under which a person is rightly praised or blamed for an act."}, {"n": 473, "b": "06", "t": "Moral Psychology", "s": "The study of the mental capacities underlying morality, such as motivation, emotion and character."}, {"n": 474, "b": "06", "t": "Moral Motivation", "s": "The question of what moves us to act morally, with internalists tying judgment to motivation."}, {"n": 475, "b": "06", "t": "Moral Status", "s": "Whether a being matters morally for its own sake, whether infants, animals or artificial beings."}, {"n": 476, "b": "06", "t": "Moral Circle", "s": "The boundary of beings given moral consideration, which Singer argues has been widened over history."}, {"n": 477, "b": "06", "t": "Animal Ethics", "s": "The study of our obligations to animals, including Singer's critique of speciesism and Regan's rights view."}, {"n": 478, "b": "06", "t": "Speciesism", "s": "The charge that favouring one's own species without a morally relevant ground is a prejudice like racism."}, {"n": 479, "b": "06", "t": "Environmental Ethics", "s": "The study of our obligations to nature, including deep ecology and the land ethic."}, {"n": 480, "b": "06", "t": "Deep Ecology", "s": "Naess's view that nature has intrinsic value and that human interests do not override it."}, {"n": 481, "b": "06", "t": "Land Ethic", "s": "Leopold's proposal that we treat the land community as a moral object."}, {"n": 482, "b": "06", "t": "Future Generations", "s": "The question of what we owe to people not yet born, and how to weigh their interests."}, {"n": 483, "b": "06", "t": "Population Ethics", "s": "The study of the value of different possible populations, with puzzles like the repugnant conclusion."}, {"n": 484, "b": "06", "t": "Effective Altruism", "s": "The movement and view that we should use evidence and reason to do as much good as possible."}, {"n": 485, "b": "06", "t": "Duty of Beneficence", "s": "Singer's argument that affluent people must give to relieve suffering when they can do so at little cost."}, {"n": 486, "b": "06", "t": "Drowning Child", "s": "Singer's analogy that failing to aid distant strangers is like refusing to save a child at small cost."}, {"n": 487, "b": "06", "t": "Bioethics", "s": "The ethics of medicine and biology, including consent, life and death, and enhancement."}, {"n": 488, "b": "06", "t": "Autonomy in Medicine", "s": "The principle that competent patients have the right to decide about their own treatment."}, {"n": 489, "b": "06", "t": "Informed Consent", "s": "A person's voluntary agreement to a procedure on the basis of adequate understanding."}, {"n": 490, "b": "06", "t": "Euthanasia", "s": "Deliberately ending life to relieve suffering, which raises issues of autonomy and the sanctity of life."}, {"n": 491, "b": "06", "t": "Just War Theory", "s": "The tradition of criteria governing when war is justified and how it may be fought."}, {"n": 492, "b": "06", "t": "Punishment", "s": "The infliction of a penalty for wrongdoing, justified by retribution, deterrence or reform."}, {"n": 493, "b": "06", "t": "Retributivism", "s": "The view that wrongdoers deserve punishment in proportion to their wrongdoing."}, {"n": 494, "b": "06", "t": "Deterrence", "s": "The justification of punishment by its effect in discouraging future offences."}, {"n": 495, "b": "06", "t": "Machine Ethics", "s": "The study of how artificial agents should act and what moral limits apply to their design."}, {"n": 496, "b": "06", "t": "Golden Rule", "s": "The principle, found across traditions, to treat others as one would wish to be treated."}, {"n": 497, "b": "06", "t": "Altruism", "s": "Acting for the benefit of others, and the debate whether it exists or reduces to self-interest."}, {"n": 498, "b": "06", "t": "Psychological Egoism", "s": "The claim that all human action is ultimately motivated by self-interest."}, {"n": 499, "b": "06", "t": "Ethical Egoism", "s": "The normative view that each person ought to pursue their own interest."}, {"n": 500, "b": "06", "t": "Master and Slave Morality", "s": "Nietzsche's contrast between a morality of strength and one born of resentment among the weak."}, {"n": 501, "b": "06", "t": "Genealogy of Morals", "s": "Nietzsche's historical critique tracing moral concepts to the interests and psychology that produced them."}, {"n": 502, "b": "06", "t": "Ressentiment", "s": "Nietzsche's term for the festering resentment of the powerless, which he saw as the root of slave morality."}, {"n": 503, "b": "06", "t": "Will to Power", "s": "Nietzsche's idea that the basic drive of living things is to expand and exert their strength."}, {"n": 504, "b": "06", "t": "Reasons for Action", "s": "The considerations that count in favour of acting, central to debates about internalism and externalism."}, {"n": 505, "b": "06", "t": "Internalism about Reasons", "s": "Williams's thesis that a reason must connect to the agent's existing motivations."}, {"n": 506, "b": "06", "t": "Rationality and Morality", "s": "The question of whether it is always rational to act morally, posed by Plato and Sidgwick."}, {"n": 507, "b": "06", "t": "Dualism of Practical Reason", "s": "Sidgwick's worry that reason supports both egoism and impartial benevolence, with no way to reconcile them."}, {"n": 508, "b": "06", "t": "Value Pluralism", "s": "Berlin's view that human values are many and sometimes irreconcilable, with no single scale for weighing them."}, {"n": 509, "b": "06", "t": "Intrinsic and Instrumental Value", "s": "The distinction between what is valuable for its own sake and what is valuable as a means."}, {"n": 510, "b": "06", "t": "Fitting Attitude Analysis", "s": "The view that to be valuable is to merit a favourable attitude."}, {"n": 511, "b": "06", "t": "Thick and Thin Concepts", "s": "The contrast between richly descriptive evaluative terms like \"cruel\" and thin ones like \"good\"."}, {"n": 512, "b": "06", "t": "Dirty Hands", "s": "The problem that political and moral life can require doing wrong in order to do right."}, {"n": 513, "b": "06", "t": "Demandingness Objection", "s": "The complaint that consequentialism asks too much of agents."}, {"n": 514, "b": "06", "t": "Integrity", "s": "Williams's idea that morality must leave room for the projects and commitments that make a life one's own."}, {"n": 515, "b": "07", "t": "Justice", "s": "Giving each their due; the central concept of political philosophy, variously understood as order (Plato), fairness (Rawls) or entitlement (Nozick)."}, {"n": 516, "b": "07", "t": "Social Contract", "s": "The idea that political authority rests on an agreement among free persons, developed by Hobbes, Locke, Rousseau and Rawls."}, {"n": 517, "b": "07", "t": "State of Nature", "s": "The imagined condition before government, which Hobbes saw as a war of all against all and Locke as governed by natural law."}, {"n": 518, "b": "07", "t": "Leviathan", "s": "Hobbes's image of the sovereign state, created by contract so that people may escape the violence of the state of nature."}, {"n": 519, "b": "07", "t": "General Will", "s": "Rousseau's notion of the will of the people directed at the common good, to which each citizen submits and so remains free."}, {"n": 520, "b": "07", "t": "Sovereignty", "s": "Supreme authority within a territory; theorists ask who holds it and what limits it."}, {"n": 521, "b": "07", "t": "Political Obligation", "s": "Whether and why citizens must obey the law of their state."}, {"n": 522, "b": "07", "t": "Consent of the Governed", "s": "The principle that legitimate government rests on the agreement of those it rules."}, {"n": 523, "b": "07", "t": "Legitimacy", "s": "The right of a political authority to rule, as distinct from its mere power."}, {"n": 524, "b": "07", "t": "Authority", "s": "The right to command and to be obeyed, which anarchists such as Wolff deny that any state can have."}, {"n": 525, "b": "07", "t": "Anarchism", "s": "The view that the state is unnecessary and illegitimate and that society can be organised without coercive government."}, {"n": 526, "b": "07", "t": "Liberalism", "s": "The political tradition that prizes individual liberty, equality of rights and limited government."}, {"n": 527, "b": "07", "t": "Classical Liberalism", "s": "The doctrine, from Locke and Smith, of limited government, free markets and individual rights."}, {"n": 528, "b": "07", "t": "Negative and Positive Liberty", "s": "Berlin's contrast between freedom from interference and freedom as self-mastery or the capacity to act."}, {"n": 529, "b": "07", "t": "Harm Principle", "s": "Mill's rule that power may be exercised over a person against their will only to prevent harm to others."}, {"n": 530, "b": "07", "t": "Republicanism", "s": "The tradition that defines freedom as non-domination and stresses civic virtue and self-rule."}, {"n": 531, "b": "07", "t": "Freedom as Non-Domination", "s": "Pettit's view that liberty is the absence of being subject to another's arbitrary will, even if they do not interfere."}, {"n": 532, "b": "07", "t": "Conservatism", "s": "The tradition, from Burke, that values inherited institutions and distrusts rapid, abstract reform."}, {"n": 533, "b": "07", "t": "Communitarianism", "s": "The view of Sandel, MacIntyre and Taylor that the self is formed by communities and that liberalism neglects this."}, {"n": 534, "b": "07", "t": "Libertarianism", "s": "The view that individual liberty and property rights should be maximally protected and the state minimal."}, {"n": 535, "b": "07", "t": "Minimal State", "s": "Nozick's thesis that only a state limited to protection against force, theft and fraud can be justified."}, {"n": 536, "b": "07", "t": "Entitlement Theory", "s": "Nozick's view that a distribution is just if it arose through just acquisition and transfer, whatever its pattern."}, {"n": 537, "b": "07", "t": "Justice as Fairness", "s": "Rawls's theory that the principles of justice are those that free and equal persons would choose in a fair initial situation."}, {"n": 538, "b": "07", "t": "Original Position", "s": "Rawls's hypothetical situation in which people choose principles of justice without knowing their own place in society."}, {"n": 539, "b": "07", "t": "Veil of Ignorance", "s": "The device of the original position that hides one's class, talents and conception of the good so that choice is impartial."}, {"n": 540, "b": "07", "t": "Difference Principle", "s": "Rawls's principle that inequalities are just only if they benefit the least advantaged."}, {"n": 541, "b": "07", "t": "Overlapping Consensus", "s": "Rawls's idea of a political conception of justice endorsed by citizens who hold differing comprehensive doctrines."}, {"n": 542, "b": "07", "t": "Public Reason", "s": "The idea that political decisions should be justified by reasons all reasonable citizens can accept."}, {"n": 543, "b": "07", "t": "Egalitarianism", "s": "The view that equality should be a central aim of social arrangements."}, {"n": 544, "b": "07", "t": "Luck Egalitarianism", "s": "The view that inequalities are unjust when they stem from luck and not from people's choices."}, {"n": 545, "b": "07", "t": "Capabilities Approach", "s": "Sen's and Nussbaum's view that justice concerns what people are actually able to do and be."}, {"n": 546, "b": "07", "t": "Distributive Justice", "s": "The question of how benefits and burdens of social life should be allocated."}, {"n": 547, "b": "07", "t": "Desert", "s": "The idea that people deserve rewards or penalties in virtue of what they have done."}, {"n": 548, "b": "07", "t": "Meritocracy", "s": "A system in which positions and rewards go to those with talent and effort, subject to critique for hidden inequalities."}, {"n": 549, "b": "07", "t": "Socialism", "s": "The family of views that favours collective or social ownership and control of the means of production."}, {"n": 550, "b": "07", "t": "Marxism", "s": "The theory of Marx and Engels that history is driven by class conflict and that capitalism will be succeeded by communism."}, {"n": 551, "b": "07", "t": "Historical Materialism", "s": "Marx's thesis that the economic base shapes the legal, political and ideological superstructure."}, {"n": 552, "b": "07", "t": "Class Struggle", "s": "Marx's thesis that history is the history of conflict between classes defined by their relation to production."}, {"n": 553, "b": "07", "t": "Alienation", "s": "Marx's analysis of how workers under capitalism are estranged from their labour, its product, others and themselves."}, {"n": 554, "b": "07", "t": "Surplus Value", "s": "Marx's term for the unpaid labour appropriated by the capitalist, the source of profit."}, {"n": 555, "b": "07", "t": "Commodity Fetishism", "s": "Marx's idea that social relations among people appear as relations among things."}, {"n": 556, "b": "07", "t": "Ideology", "s": "A system of ideas that obscures and legitimises existing social power, a concept central to Marxist critique."}, {"n": 557, "b": "07", "t": "Hegemony", "s": "Gramsci's term for domination secured through cultural leadership and consent rather than force alone."}, {"n": 558, "b": "07", "t": "Critical Theory", "s": "The Frankfurt School's project of diagnosing and challenging domination through interdisciplinary social critique."}, {"n": 559, "b": "07", "t": "Communicative Action", "s": "Habermas's theory that social coordination rests on reaching mutual understanding through reasoned discourse."}, {"n": 560, "b": "07", "t": "Public Sphere", "s": "Habermas's term for the space where citizens discuss matters of common concern and form public opinion."}, {"n": 561, "b": "07", "t": "Deliberative Democracy", "s": "The view that democratic legitimacy comes from public reasoning among free and equal citizens."}, {"n": 562, "b": "07", "t": "Democracy", "s": "Rule by the people; theorists debate its justification, its forms and its limits, from Athens to the present."}, {"n": 563, "b": "07", "t": "Tyranny of the Majority", "s": "Tocqueville's and Mill's worry that democratic majorities can oppress minorities."}, {"n": 564, "b": "07", "t": "Separation of Powers", "s": "Montesquieu's principle that dividing legislative, executive and judicial authority guards against tyranny."}, {"n": 565, "b": "07", "t": "Rule of Law", "s": "The ideal that all are subject to law that is public, general and impartially applied."}, {"n": 566, "b": "07", "t": "Constitutionalism", "s": "The view that government should be limited by a fundamental law."}, {"n": 567, "b": "07", "t": "Cosmopolitanism", "s": "The view that all human beings belong to a single moral community and that national borders carry limited moral weight."}, {"n": 568, "b": "07", "t": "Global Justice", "s": "The study of what justice requires across borders, concerning poverty, trade and migration."}, {"n": 569, "b": "07", "t": "Nationalism", "s": "The view that the nation is the proper basis of political community, with loyalty and self-determination as key values."}, {"n": 570, "b": "07", "t": "Multiculturalism", "s": "The view that cultural diversity should be recognised and accommodated by public institutions."}, {"n": 571, "b": "07", "t": "Recognition", "s": "Hegel's, Taylor's and Honneth's idea that identity depends on being acknowledged by others and that misrecognition is a harm."}, {"n": 572, "b": "07", "t": "Feminism", "s": "The movement and theory concerned with the equality of women and the critique of gender hierarchy."}, {"n": 573, "b": "07", "t": "Patriarchy", "s": "A social order in which men dominate, subject to analysis in feminist theory."}, {"n": 574, "b": "07", "t": "Intersectionality", "s": "Crenshaw's term for how overlapping systems of oppression, such as race and gender, compound each other."}, {"n": 575, "b": "07", "t": "Gender as Performance", "s": "Butler's thesis that gender is constituted by repeated acts and not a natural fact."}, {"n": 576, "b": "07", "t": "Critical Race Theory", "s": "The analysis of how law and institutions embed racial hierarchy."}, {"n": 577, "b": "07", "t": "Colonialism and Postcolonial Theory", "s": "The critique of imperial domination and its legacies, developed by Fanon, Said and Spivak."}, {"n": 578, "b": "07", "t": "Orientalism", "s": "Said's analysis of how Western representations of the East served the cause of domination."}, {"n": 579, "b": "07", "t": "Biopower", "s": "Foucault's term for forms of power that manage the life of populations."}, {"n": 580, "b": "07", "t": "Panopticon", "s": "Bentham's design for a prison with constant surveillance, which Foucault used as a model of modern disciplinary power."}, {"n": 581, "b": "07", "t": "Power/Knowledge", "s": "Foucault's claim that knowledge and power are intertwined, so that regimes of truth are also regimes of control."}, {"n": 582, "b": "07", "t": "Social Construction", "s": "The thesis that categories such as gender and race are products of social practice, not natural facts."}, {"n": 583, "b": "07", "t": "Civil Disobedience", "s": "Open, non-violent breach of law on grounds of conscience, as defended by Thoreau, Gandhi and King."}, {"n": 584, "b": "07", "t": "Revolution", "s": "A fundamental and rapid overthrow of a political order, whose justification is a perennial subject for political theory."}, {"n": 585, "b": "07", "t": "Legal Positivism", "s": "The view that the existence of law depends on social facts and not on its moral merit."}, {"n": 586, "b": "07", "t": "Natural Law Theory of Law", "s": "The view that an unjust law is not truly law, or that law is bound up with morality."}, {"n": 587, "b": "07", "t": "Hart's Rule of Recognition", "s": "Hart's idea of the social rule that identifies which norms count as valid law in a legal system."}, {"n": 588, "b": "07", "t": "Law as Integrity", "s": "Dworkin's view that judges should interpret law as a coherent expression of moral principle."}, {"n": 589, "b": "07", "t": "Property", "s": "The right to use and exclude others from things; Locke grounded it in labour, others in convention or social need."}, {"n": 590, "b": "07", "t": "Labour Theory of Property", "s": "Locke's view that mixing one's labour with unowned things gives one a right to them."}, {"n": 591, "b": "07", "t": "Tragedy of the Commons", "s": "Hardin's account of how shared resources are depleted when individuals pursue self-interest."}, {"n": 592, "b": "07", "t": "Paternalism", "s": "Interfering with a person's liberty for their own good, a standing problem for liberal theory."}, {"n": 593, "b": "07", "t": "Privacy", "s": "The claim to control access to oneself and information about oneself, challenged by modern technology."}, {"n": 594, "b": "07", "t": "Freedom of Speech", "s": "The right to express opinions, whose limits are debated, as in Mill's defence of free discussion."}, {"n": 595, "b": "07", "t": "Toleration", "s": "The practice of putting up with what one dislikes or disapproves of, defended by Locke and Mill."}, {"n": 596, "b": "07", "t": "Secularism", "s": "The principle of separating religious authority from the state."}, {"n": 597, "b": "07", "t": "Iron Cage", "s": "Weber's metaphor for the way rationalised bureaucratic life constrains and disenchants modern individuals."}, {"n": 598, "b": "07", "t": "Disenchantment", "s": "Weber's term for the loss of magic and ultimate meaning in modernity as rational calculation spreads."}, {"n": 599, "b": "07", "t": "Anomie", "s": "Durkheim's term for a condition in which social norms break down and individuals lose moral guidance."}, {"n": 600, "b": "07", "t": "Collective Representations", "s": "Durkheim's idea that shared beliefs and symbols are social facts that shape individual thought."}, {"n": 601, "b": "07", "t": "Political Realism", "s": "The tradition, from Thucydides and Machiavelli, that stresses power and interest in the conduct of states."}, {"n": 602, "b": "07", "t": "Virtù and Fortuna", "s": "Machiavelli's contrast between the skill of the prince and the force of chance in political success."}, {"n": 603, "b": "07", "t": "End of History", "s": "Fukuyama's thesis, drawing on Hegel and Kojève, that liberal democracy represents the final form of government."}, {"n": 604, "b": "07", "t": "Totalitarianism", "s": "Arendt's term for a novel form of rule that uses terror and ideology to dominate every part of life."}, {"n": 605, "b": "07", "t": "Banality of Evil", "s": "Arendt's phrase for wrongdoing committed by ordinary people who do not think about what they are doing."}, {"n": 606, "b": "07", "t": "Vita Activa", "s": "Arendt's division of the active life into labour, work and action, with action as the highest."}, {"n": 607, "b": "08", "t": "Beauty", "s": "The quality of things that please when perceived or contemplated; philosophers disagree whether it is objective or subjective."}, {"n": 608, "b": "08", "t": "Aesthetics", "s": "The philosophical study of beauty, art and aesthetic experience, named by Baumgarten in the eighteenth century."}, {"n": 609, "b": "08", "t": "Aesthetic Experience", "s": "A distinctive kind of attention to an object for its own sake, marked by pleasure and absorption."}, {"n": 610, "b": "08", "t": "Taste", "s": "The capacity to judge beauty; Hume sought a standard of taste in the verdicts of ideal critics."}, {"n": 611, "b": "08", "t": "Standard of Taste", "s": "Hume's proposal that aesthetic value is revealed by the joint judgment of qualified critics."}, {"n": 612, "b": "08", "t": "Judgment of Taste", "s": "Kant's claim that a judgment of beauty is subjective yet claims universal assent."}, {"n": 613, "b": "08", "t": "Disinterestedness", "s": "The idea that aesthetic pleasure is free of desire for the object's use or possession, as in Kant and Schopenhauer."}, {"n": 614, "b": "08", "t": "Purposiveness without Purpose", "s": "Kant's phrase for the formal fit of a beautiful object, which seems designed though it serves no end."}, {"n": 615, "b": "08", "t": "Sublime", "s": "The experience of overwhelming greatness or power, such as a storm or mountain, which Burke and Kant contrasted with beauty."}, {"n": 616, "b": "08", "t": "Genius", "s": "Kant's term for the innate talent through which nature gives the rule to art."}, {"n": 617, "b": "08", "t": "Mimesis", "s": "Imitation or representation; Plato distrusted it and Aristotle saw it as the basis of art."}, {"n": 618, "b": "08", "t": "Catharsis", "s": "Aristotle's term for the purging or clarifying of emotions such as pity and fear through tragedy."}, {"n": 619, "b": "08", "t": "Tragedy", "s": "A dramatic form depicting suffering and downfall, whose appeal Aristotle, Hegel and Nietzsche each explained."}, {"n": 620, "b": "08", "t": "Apollonian and Dionysian", "s": "Nietzsche's contrast between art of order and form and art of ecstasy and dissolution."}, {"n": 621, "b": "08", "t": "Expression Theory", "s": "The view of Tolstoy and Collingwood that art is the expression of emotion."}, {"n": 622, "b": "08", "t": "Formalism in Art", "s": "The view that the value of an artwork lies in its form and not in its content or subject."}, {"n": 623, "b": "08", "t": "Significant Form", "s": "Clive Bell's thesis that what makes something art is its arrangement of lines and colours."}, {"n": 624, "b": "08", "t": "Institutional Theory of Art", "s": "Dickie's and Danto's view that something is art when the artworld confers that status on it."}, {"n": 625, "b": "08", "t": "Artworld", "s": "Danto's term for the theory and institutions that make it possible to see something as art."}, {"n": 626, "b": "08", "t": "Definition of Art", "s": "The question of whether art can be defined, with Weitz denying that it has necessary and sufficient conditions."}, {"n": 627, "b": "08", "t": "Ready-Made", "s": "Duchamp's practice of presenting ordinary objects as art, which forced the question of what makes art."}, {"n": 628, "b": "08", "t": "Authenticity and Forgery", "s": "The question of whether the origin of a work matters to its aesthetic value, when a perfect copy looks identical."}, {"n": 629, "b": "08", "t": "Intentional Fallacy", "s": "Wimsatt and Beardsley's claim that an author's intention is neither available nor desirable as a standard for judging a work."}, {"n": 630, "b": "08", "t": "Death of the Author", "s": "Barthes's thesis that a text's meaning is made by readers and not fixed by its writer."}, {"n": 631, "b": "08", "t": "Interpretation", "s": "The attempt to make sense of artworks and texts, with disputes over the role of authorial intention."}, {"n": 632, "b": "08", "t": "Fiction", "s": "Representations of imagined events; philosophers ask how we can respond emotionally to what we know to be unreal."}, {"n": 633, "b": "08", "t": "Paradox of Fiction", "s": "The puzzle of why we feel real emotions for characters we know do not exist."}, {"n": 634, "b": "08", "t": "Paradox of Tragedy", "s": "The puzzle of why we take pleasure in works that depict painful events."}, {"n": 635, "b": "08", "t": "Make-Believe", "s": "Walton's account of fiction as props in games of imagination."}, {"n": 636, "b": "08", "t": "Music", "s": "The art of sound; philosophers ask how it expresses emotion and what its meaning consists in."}, {"n": 637, "b": "08", "t": "Aesthetics of Nature", "s": "The study of the appreciation of natural environments, in contrast with art."}, {"n": 638, "b": "08", "t": "Environmental Aesthetics", "s": "The study of how we perceive and value built and natural surroundings."}, {"n": 639, "b": "08", "t": "Everyday Aesthetics", "s": "The study of aesthetic qualities in ordinary life beyond the arts."}, {"n": 640, "b": "08", "t": "Kitsch", "s": "Sentimental, formulaic art that flatters its audience, which critics such as Greenberg and Kundera disdained."}, {"n": 641, "b": "08", "t": "Aura", "s": "Benjamin's term for the unique presence of an original artwork, which mechanical reproduction erodes."}, {"n": 642, "b": "08", "t": "Culture Industry", "s": "Adorno and Horkheimer's critique of mass-produced culture as a means of social control."}, {"n": 643, "b": "08", "t": "Aesthetic Education", "s": "Schiller's view that experience of beauty can cultivate freedom and moral character."}, {"n": 644, "b": "08", "t": "Aesthetic Value", "s": "The goodness of a thing as an object of aesthetic regard, and the question of whether it can be separated from moral and cognitive value."}, {"n": 645, "b": "08", "t": "Moralism and Autonomism", "s": "The debate over whether an artwork's moral qualities affect its aesthetic merit."}, {"n": 646, "b": "08", "t": "Gaze", "s": "The way in which viewing is structured by power, as in the male gaze of feminist film theory."}, {"n": 647, "b": "08", "t": "Postmodernism in Art", "s": "The rejection of grand narratives and the blurring of high and low, with play and pastiche."}, {"n": 648, "b": "08", "t": "Simulacra", "s": "Baudrillard's term for copies without originals, in a culture saturated with signs and images."}, {"n": 649, "b": "08", "t": "Hyperreality", "s": "Baudrillard's idea that models and images come to replace reality in advanced media culture."}, {"n": 650, "b": "08", "t": "Sensus Communis", "s": "The shared sense on which Kant based the demand that others agree with one's judgment of taste."}, {"n": 651, "b": "08", "t": "Wabi-Sabi", "s": "The Japanese aesthetic that finds beauty in impermanence and imperfection."}, {"n": 652, "b": "08", "t": "Mono no Aware", "s": "The Japanese sensitivity to the transience of things, a gentle sadness at their passing."}, {"n": 653, "b": "08", "t": "Yūgen", "s": "The Japanese aesthetic of subtle, profound mystery suggested but not stated."}, {"n": 654, "b": "08", "t": "Rasa", "s": "The Indian theory of aesthetic flavour, the emotional essence evoked in an audience by drama and poetry."}, {"n": 655, "b": "09", "t": "Scientific Method", "s": "The set of practices by which science forms and tests theories; philosophers doubt whether any single method exists."}, {"n": 656, "b": "09", "t": "Demarcation Problem", "s": "The question of what separates science from pseudoscience and metaphysics."}, {"n": 657, "b": "09", "t": "Falsifiability", "s": "Popper's criterion that a theory is scientific only if observation could in principle refute it."}, {"n": 658, "b": "09", "t": "Conjectures and Refutations", "s": "Popper's picture of science as bold hypotheses tested by attempts to disprove them."}, {"n": 659, "b": "09", "t": "Hypothetico-Deductive Method", "s": "The method of deriving testable predictions from a hypothesis and checking them."}, {"n": 660, "b": "09", "t": "Confirmation", "s": "The relation by which evidence supports a hypothesis, analysed in logical, probabilistic and holistic terms."}, {"n": 661, "b": "09", "t": "Raven Paradox", "s": "Hempel's puzzle that a white shoe seems to confirm \"all ravens are black\"."}, {"n": 662, "b": "09", "t": "Grue Paradox", "s": "Goodman's new riddle of induction, showing that evidence fits unnatural predicates as well as natural ones."}, {"n": 663, "b": "09", "t": "Inference to the Best Explanation", "s": "The principle that we should accept the hypothesis that best explains the evidence."}, {"n": 664, "b": "09", "t": "Scientific Explanation", "s": "The question of what it is to explain a phenomenon, whether by laws, causes or unification."}, {"n": 665, "b": "09", "t": "Covering Law Model", "s": "Hempel and Oppenheim's view that explanation is the deduction of a phenomenon from laws and conditions."}, {"n": 666, "b": "09", "t": "Causal Explanation", "s": "The view that to explain an event is to cite its causes, which many take to be the heart of explanation."}, {"n": 667, "b": "09", "t": "Scientific Realism", "s": "The view that mature scientific theories are approximately true and that their unobservable entities exist."}, {"n": 668, "b": "09", "t": "Instrumentalism", "s": "The view that scientific theories are tools for prediction and not literal descriptions of reality."}, {"n": 669, "b": "09", "t": "Constructive Empiricism", "s": "Van Fraassen's view that science aims at empirical adequacy, not truth about unobservables."}, {"n": 670, "b": "09", "t": "No-Miracles Argument", "s": "Putnam's argument that realism is the only view that does not make the success of science a miracle."}, {"n": 671, "b": "09", "t": "Pessimistic Meta-Induction", "s": "The argument that since past successful theories turned out false, current ones probably will too."}, {"n": 672, "b": "09", "t": "Underdetermination of Theory", "s": "The thesis that evidence cannot single out one theory among empirically equivalent rivals."}, {"n": 673, "b": "09", "t": "Observable and Unobservable", "s": "The distinction between what can be directly detected and what cannot, central to realism debates."}, {"n": 674, "b": "09", "t": "Theory-Ladenness of Observation", "s": "The thesis that observation is shaped by prior theory, which weakens any neutral foundation."}, {"n": 675, "b": "09", "t": "Paradigm", "s": "Kuhn's term for the framework of assumptions, methods and exemplars that guides a scientific community."}, {"n": 676, "b": "09", "t": "Normal Science", "s": "Kuhn's term for puzzle-solving work within an accepted paradigm."}, {"n": 677, "b": "09", "t": "Scientific Revolution", "s": "Kuhn's account of episodes in which an old paradigm is replaced by an incompatible one."}, {"n": 678, "b": "09", "t": "Incommensurability", "s": "Kuhn's and Feyerabend's thesis that rival paradigms lack a neutral standard of comparison."}, {"n": 679, "b": "09", "t": "Research Programmes", "s": "Lakatos's view of science as competing series of theories sharing a hard core and protective belt."}, {"n": 680, "b": "09", "t": "Epistemological Anarchism", "s": "Feyerabend's claim that no fixed method governs scientific progress, so \"anything goes\"."}, {"n": 681, "b": "09", "t": "Sociology of Scientific Knowledge", "s": "The approach that explains scientific beliefs by social factors, as in the Strong Programme."}, {"n": 682, "b": "09", "t": "Scientific Progress", "s": "The question of whether and how science advances, by truth, problem-solving or empirical success."}, {"n": 683, "b": "09", "t": "Verisimilitude", "s": "Popper's notion of closeness to the truth, an attempt to say how theories can be better without being true."}, {"n": 684, "b": "09", "t": "Laws of Nature in Science", "s": "The role of general regularities in explanation and prediction, and the question of what makes them laws."}, {"n": 685, "b": "09", "t": "Ceteris Paribus Laws", "s": "Laws that hold only when other things are equal, common in the special sciences."}, {"n": 686, "b": "09", "t": "Reductionism in Science", "s": "The view that higher-level theories can be explained by more fundamental ones."}, {"n": 687, "b": "09", "t": "Unity of Science", "s": "The positivist ideal of a single science with all the special sciences reduced to physics."}, {"n": 688, "b": "09", "t": "Disunity of Science", "s": "The view that the sciences are a patchwork of methods and theories without a deep unity."}, {"n": 689, "b": "09", "t": "Models", "s": "Idealised representations used in science, whose relation to reality raises questions about truth and understanding."}, {"n": 690, "b": "09", "t": "Idealization", "s": "The deliberate simplification of a model, such as frictionless planes, that science uses to gain understanding."}, {"n": 691, "b": "09", "t": "Thought Experiments in Science", "s": "Imagined scenarios, as in Galileo and Einstein, used to reason about nature without experiment."}, {"n": 692, "b": "09", "t": "Statistical Inference", "s": "Methods for drawing conclusions from data, with frequentist and Bayesian schools in dispute."}, {"n": 693, "b": "09", "t": "Philosophy of Physics", "s": "The study of the conceptual foundations of physical theories, including space, time and quantum mechanics."}, {"n": 694, "b": "09", "t": "Measurement Problem", "s": "The puzzle in quantum mechanics of why a system in superposition yields a definite result on measurement."}, {"n": 695, "b": "09", "t": "Interpretations of Quantum Mechanics", "s": "Rival accounts of what quantum theory says about reality, including Copenhagen, many-worlds and pilot-wave."}, {"n": 696, "b": "09", "t": "Many-Worlds Interpretation", "s": "Everett's view that every quantum outcome occurs in a branching universe."}, {"n": 697, "b": "09", "t": "Copenhagen Interpretation", "s": "Bohr and Heisenberg's view that quantum theory describes the results of measurement and not an underlying reality."}, {"n": 698, "b": "09", "t": "Wave-Particle Duality", "s": "The finding that quantum entities show both wave and particle behaviour depending on how they are observed."}, {"n": 699, "b": "09", "t": "Non-Locality", "s": "The feature of quantum entanglement in which distant systems show correlations that no local account can explain."}, {"n": 700, "b": "09", "t": "Philosophy of Biology", "s": "The study of conceptual issues in evolution, genetics and ecology."}, {"n": 701, "b": "09", "t": "Natural Selection", "s": "Darwin's mechanism of evolutionary change through differential survival and reproduction."}, {"n": 702, "b": "09", "t": "Adaptationism", "s": "The view that traits are mainly to be explained as adaptations shaped by selection."}, {"n": 703, "b": "09", "t": "Species Problem", "s": "The difficulty of defining what a species is and whether species are natural kinds or individuals."}, {"n": 704, "b": "09", "t": "Function", "s": "The idea that parts of organisms have functions, analysed by selected effects or by causal role."}, {"n": 705, "b": "09", "t": "Levels of Selection", "s": "The debate over whether selection acts on genes, organisms, groups or all of these."}, {"n": 706, "b": "09", "t": "Reductionism in Biology", "s": "The view that biological phenomena can be explained by molecular and chemical processes."}, {"n": 707, "b": "09", "t": "Vitalism", "s": "The discredited view that living things contain a non-physical vital force."}, {"n": 708, "b": "09", "t": "Philosophy of Psychology", "s": "The study of the concepts and methods of the sciences of mind and behaviour."}, {"n": 709, "b": "09", "t": "Philosophy of Social Science", "s": "The study of whether the social sciences differ from the natural sciences in their methods and aims."}, {"n": 710, "b": "09", "t": "Methodological Individualism", "s": "The thesis that social phenomena should be explained by the actions of individuals."}, {"n": 711, "b": "09", "t": "Holism in Social Science", "s": "The view that social wholes have properties not reducible to individuals."}, {"n": 712, "b": "09", "t": "Verstehen", "s": "The interpretive understanding of human action from within, which Dilthey and Weber contrasted with natural explanation."}, {"n": 713, "b": "09", "t": "Positivism", "s": "The view that genuine knowledge derives from observation and logic, associated with Comte and the Vienna Circle."}, {"n": 714, "b": "09", "t": "Values in Science", "s": "The question of whether social and ethical values legitimately influence scientific reasoning."}, {"n": 715, "b": "09", "t": "Ockham's Razor", "s": "The principle that one should not multiply entities beyond necessity, used as a guide to theory choice."}, {"n": 716, "b": "09", "t": "Simplicity", "s": "A virtue of theories whose epistemic standing is debated: whether simpler theories are likelier to be true."}, {"n": 717, "b": "09", "t": "Anthropic Principle", "s": "The idea that observations of the universe must be compatible with the existence of observers."}, {"n": 718, "b": "09", "t": "Fine-Tuning", "s": "The observation that physical constants appear tuned for life, which is used in arguments for design or for multiple universes."}, {"n": 719, "b": "09", "t": "Multiverse", "s": "The hypothesis that our universe is one of many, proposed to explain fine-tuning."}, {"n": 720, "b": "09", "t": "Arrow of Time", "s": "The asymmetry between past and future, usually traced to the increase of entropy."}, {"n": 721, "b": "09", "t": "Entropy", "s": "A measure of disorder whose tendency to increase underlies the direction of time."}, {"n": 722, "b": "09", "t": "Laplace's Demon", "s": "The imagined intellect that could predict the future from complete knowledge of the present, an icon of determinism."}, {"n": 723, "b": "10", "t": "God", "s": "The supreme being of theism, conceived as all-powerful, all-knowing and perfectly good, whose existence and nature are the core questions of philosophical theology."}, {"n": 724, "b": "10", "t": "Theism", "s": "The belief in a personal God who created and sustains the world."}, {"n": 725, "b": "10", "t": "Atheism", "s": "The position that there is no God, or the lack of belief in one."}, {"n": 726, "b": "10", "t": "Agnosticism", "s": "The view that the existence of God is unknown or unknowable, a term coined by T. H. Huxley."}, {"n": 727, "b": "10", "t": "Pantheism", "s": "The view that God and the universe are identical, as in Spinoza."}, {"n": 728, "b": "10", "t": "Panentheism", "s": "The view that the world is in God, though God is also more than the world."}, {"n": 729, "b": "10", "t": "Deism", "s": "The view that God created the world but does not intervene in it, popular in the Enlightenment."}, {"n": 730, "b": "10", "t": "Ontological Argument", "s": "Anselm's argument that God, being that than which nothing greater can be conceived, must exist in reality as well as in thought."}, {"n": 731, "b": "10", "t": "Cosmological Argument", "s": "The argument from the existence of the world, or its contingency or beginning, to a first cause or necessary being."}, {"n": 732, "b": "10", "t": "Kalam Argument", "s": "The argument that the universe began to exist and so must have a cause, developed by medieval Islamic thinkers."}, {"n": 733, "b": "10", "t": "Teleological Argument", "s": "The argument from the order or design of the world to an intelligent designer, as in Paley's watch."}, {"n": 734, "b": "10", "t": "Moral Argument", "s": "The argument that objective morality, or the possibility of moral life, requires God."}, {"n": 735, "b": "10", "t": "Five Ways", "s": "Aquinas's five arguments for God's existence from motion, causation, contingency, degrees of perfection and design."}, {"n": 736, "b": "10", "t": "Problem of Evil", "s": "The challenge that the existence of evil and suffering is incompatible with an all-powerful, all-good God."}, {"n": 737, "b": "10", "t": "Theodicy", "s": "An attempt to justify God's goodness in the face of evil, as in Leibniz's claim that this is the best of all possible worlds."}, {"n": 738, "b": "10", "t": "Free Will Defence", "s": "The reply that God allowed evil in order to grant free will, which is a great good, as developed by Augustine and Plantinga."}, {"n": 739, "b": "10", "t": "Natural and Moral Evil", "s": "The distinction between suffering caused by nature and suffering caused by human wrongdoing."}, {"n": 740, "b": "10", "t": "Divine Attributes", "s": "Properties traditionally ascribed to God, including omnipotence, omniscience and omnibenevolence."}, {"n": 741, "b": "10", "t": "Omnipotence", "s": "The attribute of unlimited power, and the puzzles about whether God can do the logically impossible."}, {"n": 742, "b": "10", "t": "Omniscience", "s": "Complete knowledge, which raises questions about how it fits with human freedom."}, {"n": 743, "b": "10", "t": "Divine Foreknowledge and Free Will", "s": "The puzzle of whether God's knowledge of the future leaves us free, which Boethius and others addressed."}, {"n": 744, "b": "10", "t": "Divine Simplicity", "s": "The doctrine that God has no parts and is identical with his attributes."}, {"n": 745, "b": "10", "t": "Eternity", "s": "God's relation to time, either everlasting duration or timeless existence outside time."}, {"n": 746, "b": "10", "t": "Divine Hiddenness", "s": "Schellenberg's argument that a loving God would make his existence evident, so that reasonable non-belief counts against God."}, {"n": 747, "b": "10", "t": "Faith and Reason", "s": "The relation between religious belief and rational inquiry, held by turns to be harmonious or opposed."}, {"n": 748, "b": "10", "t": "Fideism", "s": "The view that faith does not depend on reason and may be opposed to it, as in Kierkegaard."}, {"n": 749, "b": "10", "t": "Leap of Faith", "s": "Kierkegaard's idea that religious commitment requires a passionate leap beyond what reason can justify."}, {"n": 750, "b": "10", "t": "Teleological Suspension of the Ethical", "s": "Kierkegaard's reading of Abraham's willingness to sacrifice Isaac, in which faith overrides ethical duty."}, {"n": 751, "b": "10", "t": "Religious Experience", "s": "Direct encounters with the divine, studied by James as evidence for religion."}, {"n": 752, "b": "10", "t": "Mysticism", "s": "Experience of union with ultimate reality, found across traditions and raising questions of ineffability."}, {"n": 753, "b": "10", "t": "Miracles", "s": "Events that violate natural law, which Hume argued can never be believed on the basis of testimony."}, {"n": 754, "b": "10", "t": "Religious Pluralism", "s": "The view of Hick that the great religions are different responses to one ultimate reality."}, {"n": 755, "b": "10", "t": "Exclusivism and Inclusivism", "s": "Views on whether only one religion is true or whether others share in truth to some degree."}, {"n": 756, "b": "10", "t": "Afterlife", "s": "The continued existence of persons after death, a hope in many religions and a puzzle for personal identity."}, {"n": 757, "b": "10", "t": "Immortality of the Soul", "s": "Plato's thesis that the soul is imperishable and survives the death of the body."}, {"n": 758, "b": "10", "t": "Resurrection", "s": "The Christian belief that the dead will be raised bodily, which raises puzzles of identity."}, {"n": 759, "b": "10", "t": "Religious Language", "s": "The problem of how words can describe a transcendent God, answered by analogy, symbol or via negativa."}, {"n": 760, "b": "10", "t": "Negative Theology", "s": "The approach of describing God only by what God is not, to avoid limiting the divine."}, {"n": 761, "b": "10", "t": "Via Negativa", "s": "The path of approaching God by negation, a method of Pseudo-Dionysius and Maimonides."}, {"n": 762, "b": "10", "t": "Secularization", "s": "The decline of the social and cultural authority of religion in modern societies."}, {"n": 763, "b": "10", "t": "Death of God", "s": "Nietzsche's proclamation that belief in God has become untenable, and that the foundations of Western morality are shaken."}, {"n": 764, "b": "10", "t": "Projection Theory of Religion", "s": "Feuerbach's view that God is a projection of human qualities onto an imagined being."}, {"n": 765, "b": "10", "t": "Opium of the People", "s": "Marx's description of religion as a consoling illusion that masks social suffering."}, {"n": 766, "b": "10", "t": "Reformed Epistemology and Religion", "s": "Plantinga's defence of belief in God as rational without argument."}, {"n": 767, "b": "10", "t": "Apophatic Mysticism", "s": "The tradition of unknowing in which the divine is approached by silence and negation."}, {"n": 768, "b": "10", "t": "Predestination", "s": "The doctrine that God has determined in advance who will be saved, central to Augustine and Calvin."}, {"n": 769, "b": "10", "t": "Grace", "s": "In Christian thought, the unmerited gift of divine favour, a central matter in debates about salvation and works."}, {"n": 770, "b": "10", "t": "Original Sin", "s": "The Christian doctrine that humanity inherits a sinful condition from Adam's fall."}, {"n": 771, "b": "10", "t": "Natural Theology", "s": "The attempt to establish truths about God by reason alone, without appeal to revelation."}, {"n": 772, "b": "10", "t": "Revelation", "s": "Disclosure of divine truth to humanity, in contrast with knowledge by reason alone."}, {"n": 773, "b": "10", "t": "Religious Tolerance", "s": "The principle that different faiths may coexist peacefully, defended by Locke, Voltaire and Mendelssohn."}, {"n": 774, "b": "10", "t": "Philosophy of Religion", "s": "The study of the concepts and arguments of religious belief, covering God, evil, faith and the afterlife."}, {"n": 775, "b": "10", "t": "Scholasticism", "s": "The medieval method and tradition of Aquinas, Anselm and Scotus that used logical analysis and disputation to reconcile Christian doctrine with Aristotelian philosophy."}, {"n": 776, "b": "11", "t": "Existentialism", "s": "The movement, from Kierkegaard through Sartre, that begins from individual existence, freedom and choice in a world without given meaning."}, {"n": 777, "b": "11", "t": "Authenticity", "s": "Living in accord with one's own choices and being, in contrast to conforming to the crowd, a theme in Heidegger and Sartre."}, {"n": 778, "b": "11", "t": "Bad Faith", "s": "Sartre's term for self-deception in which one denies one's freedom by pretending to be a fixed thing."}, {"n": 779, "b": "11", "t": "Absurd", "s": "Camus's term for the clash between our demand for meaning and the silence of the universe."}, {"n": 780, "b": "11", "t": "Revolt", "s": "Camus's response to the absurd: to live in defiance, without hope or despair."}, {"n": 781, "b": "11", "t": "Myth of Sisyphus", "s": "Camus's essay that treats Sisyphus condemned to roll a rock as the image of absurd life, which one must imagine happy."}, {"n": 782, "b": "11", "t": "Anguish", "s": "In Kierkegaard and Sartre, the dizzying awareness of one's freedom and responsibility."}, {"n": 783, "b": "11", "t": "Angst", "s": "Heidegger's term for the basic mood in which the nothingness of existence is disclosed."}, {"n": 784, "b": "11", "t": "Being-for-Itself", "s": "Sartre's term for consciousness, which is free and lacks fixed nature, as opposed to being-in-itself."}, {"n": 785, "b": "11", "t": "Being-in-Itself", "s": "Sartre's term for the solid, self-identical being of things, which simply is."}, {"n": 786, "b": "11", "t": "Condemned to Be Free", "s": "Sartre's thesis that human beings cannot escape freedom and must choose even when they refuse to."}, {"n": 787, "b": "11", "t": "The Look", "s": "Sartre's analysis of how being seen by another turns one into an object and reveals shame."}, {"n": 788, "b": "11", "t": "Facticity", "s": "The given circumstances of one's existence, such as body, past and situation, which one cannot choose."}, {"n": 789, "b": "11", "t": "Transcendence", "s": "The human capacity to go beyond what is given by projecting oneself toward possibilities."}, {"n": 790, "b": "11", "t": "Dasein", "s": "Heidegger's term for the human mode of being, the being for whom being is an issue."}, {"n": 791, "b": "11", "t": "Being-in-the-World", "s": "Heidegger's thesis that we are always already engaged with a world of tools and others, not detached subjects."}, {"n": 792, "b": "11", "t": "Being-toward-Death", "s": "Heidegger's idea that confronting one's own mortality is the key to authentic existence."}, {"n": 793, "b": "11", "t": "Thrownness", "s": "Heidegger's term for the fact that we find ourselves already in a world not of our choosing."}, {"n": 794, "b": "11", "t": "Ready-to-Hand", "s": "Heidegger's term for equipment as used in practice, as opposed to present-at-hand objects observed theoretically."}, {"n": 795, "b": "11", "t": "The They", "s": "Heidegger's das Man, the anonymous public norms that govern everyday life and dissolve individuality."}, {"n": 796, "b": "11", "t": "Ontological Difference", "s": "Heidegger's distinction between beings and the Being by which they are, which philosophy has forgotten."}, {"n": 797, "b": "11", "t": "Care", "s": "Heidegger's name for the basic structure of Dasein as concerned about its own existence."}, {"n": 798, "b": "11", "t": "Phenomenology", "s": "Husserl's study of the structures of experience as they appear to consciousness."}, {"n": 799, "b": "11", "t": "Epoché", "s": "Husserl's bracketing of assumptions about the existence of the world in order to describe experience as it is given."}, {"n": 800, "b": "11", "t": "Intentionality in Phenomenology", "s": "Husserl's thesis that all consciousness is consciousness of something."}, {"n": 801, "b": "11", "t": "Lifeworld", "s": "Husserl's term for the pre-theoretical world of lived experience that underlies scientific abstraction."}, {"n": 802, "b": "11", "t": "Embodiment", "s": "Merleau-Ponty's view that the lived body is the subject of perception and not an object among others."}, {"n": 803, "b": "11", "t": "Lived Body", "s": "The body as experienced from within, in contrast with the body as a physical object."}, {"n": 804, "b": "11", "t": "Intersubjectivity", "s": "The shared structure of experience among subjects, important in Husserl and Schutz."}, {"n": 805, "b": "11", "t": "Alterity", "s": "Otherness; Levinas held that the encounter with the Other, not the self, grounds ethics."}, {"n": 806, "b": "11", "t": "Face of the Other", "s": "Levinas's image of the other person's face, which commands responsibility before any theory."}, {"n": 807, "b": "11", "t": "Ethics as First Philosophy", "s": "Levinas's thesis that responsibility for the Other precedes ontology."}, {"n": 808, "b": "11", "t": "Leap and Stages of Existence", "s": "Kierkegaard's account of aesthetic, ethical and religious ways of life, with transitions through leaps."}, {"n": 809, "b": "11", "t": "Subjectivity is Truth", "s": "Kierkegaard's claim that in matters of existence, the manner of holding a belief matters more than its content."}, {"n": 810, "b": "11", "t": "Eternal Return", "s": "Nietzsche's thought experiment of living one's life again infinitely, as a test of affirming life."}, {"n": 811, "b": "11", "t": "Amor Fati", "s": "Nietzsche's love of fate, the willingness to affirm everything that happens, even suffering."}, {"n": 812, "b": "11", "t": "Übermensch", "s": "Nietzsche's overman, who creates new values after the death of God."}, {"n": 813, "b": "11", "t": "Perspectivism", "s": "Nietzsche's view that all knowledge is from a perspective and that no view from nowhere exists."}, {"n": 814, "b": "11", "t": "Nihilism", "s": "The loss of belief in meaning or value, which Nietzsche saw as the crisis of modernity."}, {"n": 815, "b": "11", "t": "Duration", "s": "Bergson's term for time as lived, a continuous flow that spatialised clock time distorts."}, {"n": 816, "b": "11", "t": "Élan Vital", "s": "Bergson's vital impetus, a creative force in evolution."}, {"n": 817, "b": "11", "t": "Spirit", "s": "Hegel's Geist, the self-developing reality that comes to know itself through history."}, {"n": 818, "b": "11", "t": "Phenomenology of Spirit", "s": "Hegel's 1807 account of consciousness developing through stages to absolute knowing."}, {"n": 819, "b": "11", "t": "Master-Slave Dialectic", "s": "Hegel's analysis of the struggle for recognition in which the dependent servant achieves self-consciousness through work."}, {"n": 820, "b": "11", "t": "Aufhebung", "s": "Hegel's term for sublation: the cancelling, preserving and lifting up of a stage in a higher unity."}, {"n": 821, "b": "11", "t": "Cunning of Reason", "s": "Hegel's idea that history advances reason's ends through the passions and self-interested actions of individuals."}, {"n": 822, "b": "11", "t": "Will", "s": "Schopenhauer's blind, striving reality underlying appearance, the source of suffering."}, {"n": 823, "b": "11", "t": "Pessimism", "s": "Schopenhauer's view that existence is dominated by suffering and that the best response is denial of the will."}, {"n": 824, "b": "11", "t": "Critical Philosophy", "s": "Kant's project of examining the limits and conditions of reason before applying it."}, {"n": 825, "b": "11", "t": "Copernican Revolution in Philosophy", "s": "Kant's turn from asking how the mind conforms to objects to asking how objects conform to the mind."}, {"n": 826, "b": "11", "t": "Categories of Understanding", "s": "Kant's twelve pure concepts, such as causality and substance, by which the mind structures experience."}, {"n": 827, "b": "11", "t": "Antinomies", "s": "Kant's pairs of contradictory conclusions reason falls into when it applies its categories beyond experience."}, {"n": 828, "b": "11", "t": "Critique of Pure Reason", "s": "Kant's 1781 work examining what reason can know apart from experience and where it oversteps its limits."}, {"n": 829, "b": "11", "t": "Enlightenment", "s": "Kant's \"emergence from self-incurred immaturity\" through daring to use one's own reason."}, {"n": 830, "b": "11", "t": "German Idealism", "s": "The movement of Fichte, Schelling and Hegel that developed Kant's philosophy into systems of the self-determining mind."}, {"n": 831, "b": "11", "t": "Romanticism", "s": "The movement valuing feeling, nature and creative individuality against Enlightenment rationalism."}, {"n": 832, "b": "11", "t": "Pragmatism", "s": "The American school of Peirce, James and Dewey that tests ideas by their practical consequences."}, {"n": 833, "b": "11", "t": "Pragmatic Maxim", "s": "Peirce's rule that the meaning of a concept lies in its conceivable practical effects."}, {"n": 834, "b": "11", "t": "Neopragmatism", "s": "Rorty's and Brandom's revival of pragmatism that rejects the idea of the mind as a mirror of nature."}, {"n": 835, "b": "11", "t": "Psychoanalysis", "s": "Freud's theory of the unconscious, which challenged the Cartesian transparency of mind."}, {"n": 836, "b": "11", "t": "Unconscious", "s": "The mental processes beyond awareness that shape thought and behaviour, according to Freud."}, {"n": 837, "b": "11", "t": "Dialectic of Enlightenment", "s": "Adorno and Horkheimer's argument that Enlightenment reason reverts into domination."}, {"n": 838, "b": "11", "t": "One-Dimensional Man", "s": "Marcuse's thesis that advanced industrial society suppresses critical thought."}, {"n": 839, "b": "11", "t": "Society of the Spectacle", "s": "Debord's thesis that modern life is mediated by images and commodities."}, {"n": 840, "b": "11", "t": "Rhizome", "s": "Deleuze and Guattari's image of non-hierarchical, interconnected thought contrasted with the tree."}, {"n": 841, "b": "11", "t": "Archaeology of Knowledge", "s": "Foucault's method of uncovering the rules governing what can be said in an historical period."}, {"n": 842, "b": "11", "t": "Postmodernism", "s": "The skepticism toward grand narratives and universal truths, associated with Lyotard."}, {"n": 843, "b": "11", "t": "Incredulity toward Metanarratives", "s": "Lyotard's definition of the postmodern condition as distrust of grand stories, such as progress or emancipation, that claim to legitimise all knowledge."}, {"n": 844, "b": "11", "t": "Poststructuralism", "s": "The movement after structuralism, including Derrida, Foucault and Deleuze, that stresses instability of meaning and structure."}, {"n": 845, "b": "11", "t": "Speculative Realism", "s": "A recent movement that rejects the primacy of human access to the world over reality independent of thought."}, {"n": 846, "b": "12", "t": "Free Will", "s": "The capacity of agents to choose among alternatives and to be the source of their actions, the subject of one of philosophy's oldest debates."}, {"n": 847, "b": "12", "t": "Determinism", "s": "The thesis that every event is necessitated by prior events and the laws of nature."}, {"n": 848, "b": "12", "t": "Compatibilism", "s": "The view that free will is compatible with determinism, defended by Hume, Frankfurt and Dennett."}, {"n": 849, "b": "12", "t": "Incompatibilism", "s": "The view that free will and determinism cannot both be true."}, {"n": 850, "b": "12", "t": "Libertarianism about Free Will", "s": "The incompatibilist view that we have free will and that determinism is false."}, {"n": 851, "b": "12", "t": "Hard Determinism", "s": "The view that determinism is true and that therefore there is no free will."}, {"n": 852, "b": "12", "t": "Hard Incompatibilism", "s": "Pereboom's view that free will, in the sense required for desert, is incompatible with both determinism and indeterminism."}, {"n": 853, "b": "12", "t": "Consequence Argument", "s": "Van Inwagen's argument that if determinism is true, our acts are consequences of facts we cannot control."}, {"n": 854, "b": "12", "t": "Principle of Alternate Possibilities", "s": "The principle that a person is responsible only if they could have done otherwise."}, {"n": 855, "b": "12", "t": "Frankfurt Cases", "s": "Frankfurt's examples of agents who are responsible though they could not have done otherwise, challenging the principle of alternate possibilities."}, {"n": 856, "b": "12", "t": "Hierarchical Theory of Free Will", "s": "Frankfurt's view that freedom involves having the will one wants to have, through second-order desires."}, {"n": 857, "b": "12", "t": "Reasons-Responsiveness", "s": "The view that an agent is free when they respond appropriately to reasons, as in Fischer and Ravizza."}, {"n": 858, "b": "12", "t": "Agent Causation", "s": "The view that free actions are caused directly by agents, not by prior events."}, {"n": 859, "b": "12", "t": "Event-Causal Libertarianism", "s": "The view that free actions are undetermined events caused by the agent's mental states."}, {"n": 860, "b": "12", "t": "Luck Objection", "s": "The challenge that indeterministic choices seem random and hence not free."}, {"n": 861, "b": "12", "t": "Manipulation Argument", "s": "Pereboom's argument that a manipulated agent is unfree, and that determinism is relevantly like manipulation."}, {"n": 862, "b": "12", "t": "Basic Argument", "s": "Galen Strawson's argument that no one can be ultimately responsible for who they are and so for what they do."}, {"n": 863, "b": "12", "t": "Reactive Attitudes", "s": "Strawson's idea that resentment and gratitude are natural responses that underlie our practice of holding responsible."}, {"n": 864, "b": "12", "t": "Illusionism about Free Will", "s": "The view that belief in free will is an illusion that may nonetheless be useful."}, {"n": 865, "b": "12", "t": "Neuroscience and Free Will", "s": "The issue raised by Libet's experiments about whether unconscious brain activity precedes conscious decisions."}, {"n": 866, "b": "12", "t": "Fatalism", "s": "The view that what will happen is fixed regardless of what we do."}, {"n": 867, "b": "12", "t": "Action", "s": "What agents do, as opposed to what merely happens to them; philosophers ask what distinguishes the two."}, {"n": 868, "b": "12", "t": "Intention", "s": "The mental state of aiming to act, which Anscombe distinguished from mere prediction."}, {"n": 869, "b": "12", "t": "Reasons and Causes", "s": "The debate over whether an agent's reasons for acting are also causes of the action, as Davidson maintained."}, {"n": 870, "b": "12", "t": "Practical Reason", "s": "Reasoning about what to do, as opposed to reasoning about what to believe."}, {"n": 871, "b": "12", "t": "Intention and Foresight", "s": "The distinction between what an agent aims at and what they merely foresee as a side effect."}, {"n": 872, "b": "12", "t": "Weakness of Will", "s": "Acting against one's own considered judgment of what is best."}, {"n": 873, "b": "12", "t": "Self-Control", "s": "The capacity to govern one's impulses in line with one's values."}, {"n": 874, "b": "12", "t": "Self-Deception", "s": "Believing something while at some level knowing it to be false, which poses puzzles about the unity of the mind."}, {"n": 875, "b": "12", "t": "Moral Agency", "s": "The capacity to act on moral reasons and to be held accountable."}, {"n": 876, "b": "12", "t": "Collective Intentionality", "s": "The capacity of groups to share intentions and act together, studied by Searle and Bratman."}, {"n": 877, "b": "12", "t": "Joint Action", "s": "Action performed by several agents together, analysed in terms of shared intentions."}, {"n": 878, "b": "12", "t": "Personal Identity", "s": "The question of what makes a person at one time the same as a person at another."}, {"n": 879, "b": "12", "t": "Psychological Continuity", "s": "The view, from Locke, that personal identity consists in the continuity of memory and character."}, {"n": 880, "b": "12", "t": "Bodily Criterion", "s": "The view that personal identity consists in the continuation of the same body or brain."}, {"n": 881, "b": "12", "t": "Animalism", "s": "The view that we are human animals and that personal identity is that of an organism."}, {"n": 882, "b": "12", "t": "Teletransportation", "s": "Parfit's thought experiment of being scanned and recreated elsewhere, to test what matters in survival."}, {"n": 883, "b": "12", "t": "Fission", "s": "Cases in which a person divides into two, used by Parfit to argue that identity is not what matters."}, {"n": 884, "b": "12", "t": "What Matters in Survival", "s": "Parfit's thesis that psychological continuity and connectedness, not identity, is what matters."}, {"n": 885, "b": "12", "t": "Reductionism about Persons", "s": "Parfit's view that a person's existence consists in other facts such as brain events and mental states."}, {"n": 886, "b": "12", "t": "Narrative Identity", "s": "The view that a person's identity is formed by the story they tell about their life."}, {"n": 887, "b": "12", "t": "Soul", "s": "The immaterial principle of life or mind in Plato, Aristotle and Christian thought, whose existence is disputed."}, {"n": 888, "b": "12", "t": "Death", "s": "The end of life, whose badness Epicurus denied and Nagel defended as a deprivation."}, {"n": 889, "b": "12", "t": "Epicurus on Death", "s": "The view that death is nothing to us, since when we exist death is not, and when death exists we are not."}, {"n": 890, "b": "12", "t": "Deprivation Account of Death", "s": "Nagel's view that death is bad because it deprives us of the goods of continued life."}, {"n": 891, "b": "12", "t": "Meaning of Life", "s": "The question of whether life has a purpose or significance, answered by religion, humanism and nihilism."}, {"n": 892, "b": "12", "t": "Happiness", "s": "The good life for a person, understood as pleasure, satisfaction or flourishing."}, {"n": 893, "b": "12", "t": "Stoic Acceptance", "s": "The Stoic view that peace comes from accepting what is outside our control and attending to what is within it."}, {"n": 894, "b": "12", "t": "Dichotomy of Control", "s": "Epictetus's distinction between what is up to us, such as judgments, and what is not."}, {"n": 895, "b": "12", "t": "Ataraxia", "s": "The Hellenistic ideal of tranquillity, freedom from disturbance, sought by Epicureans and skeptics."}, {"n": 896, "b": "12", "t": "Apatheia", "s": "The Stoic ideal of freedom from destructive passions."}, {"n": 897, "b": "12", "t": "Cynicism", "s": "The ancient school, from Diogenes, that rejected convention and sought a life in accord with nature."}, {"n": 898, "b": "12", "t": "Epicureanism", "s": "The philosophy of Epicurus that sought tranquil pleasure through modest desires and friendship."}, {"n": 899, "b": "12", "t": "Stoicism", "s": "The school of Zeno, Epictetus, Seneca and Marcus Aurelius that taught virtue as the sole good and life in accord with reason."}, {"n": 900, "b": "12", "t": "Logos", "s": "In Heraclitus and the Stoics, the rational order of the cosmos, also word and reason."}, {"n": 901, "b": "12", "t": "Love", "s": "Philosophers analyse love as desire for the beautiful (Plato), union (Aristophanes), valuing, or concern for the beloved's good."}, {"n": 902, "b": "12", "t": "Platonic Love", "s": "Plato's ascent from love of a body to love of Beauty itself, as in the Symposium."}, {"n": 903, "b": "13", "t": "Dharma", "s": "In Indian thought, the order of the cosmos and the duty and right conduct that sustains it, with specific meanings in Hindu, Buddhist and Jain traditions."}, {"n": 904, "b": "13", "t": "Karma", "s": "The doctrine that intentional actions have moral consequences that shape one's future, including later rebirths."}, {"n": 905, "b": "13", "t": "Samsara", "s": "The cycle of birth, death and rebirth that Indian traditions seek to escape."}, {"n": 906, "b": "13", "t": "Moksha", "s": "Liberation from the cycle of rebirth, the supreme goal in many Indian traditions."}, {"n": 907, "b": "13", "t": "Atman", "s": "The self or soul, which the Upanishads identify with the ultimate reality."}, {"n": 908, "b": "13", "t": "Brahman", "s": "The ultimate, unchanging reality underlying the world in Vedic and Vedantic thought."}, {"n": 909, "b": "13", "t": "Maya", "s": "In Advaita Vedanta, the power by which the one reality appears as a world of multiplicity."}, {"n": 910, "b": "13", "t": "Advaita Vedanta", "s": "Shankara's non-dualist school holding that Atman and Brahman are one and that the world of difference is appearance."}, {"n": 911, "b": "13", "t": "Vishishtadvaita", "s": "Ramanuja's qualified non-dualism, in which souls and world are real but dependent parts of Brahman."}, {"n": 912, "b": "13", "t": "Dvaita Vedanta", "s": "Madhva's dualism, which holds that God and individual souls are eternally distinct."}, {"n": 913, "b": "13", "t": "Upanishads", "s": "The philosophical texts of the Vedic tradition that explore the self, Brahman and liberation."}, {"n": 914, "b": "13", "t": "Rta", "s": "The Vedic idea of cosmic order that governs nature and ritual and anticipates dharma."}, {"n": 915, "b": "13", "t": "Samkhya", "s": "The dualist school that explains the world through two ultimate principles, spirit and nature."}, {"n": 916, "b": "13", "t": "Purusha and Prakriti", "s": "Samkhya's dual principles of conscious spirit and unconscious nature, whose entanglement causes suffering."}, {"n": 917, "b": "13", "t": "Yoga Philosophy", "s": "Patanjali's system of disciplined practice leading to the cessation of mental fluctuation and the isolation of the self."}, {"n": 918, "b": "13", "t": "Nyaya", "s": "The Indian school of logic and epistemology that analyses the means of valid knowledge and the structure of debate."}, {"n": 919, "b": "13", "t": "Pramana", "s": "The accepted means of valid knowledge in Indian thought, such as perception, inference and testimony."}, {"n": 920, "b": "13", "t": "Vaisheshika", "s": "The atomist school that classifies reality into categories such as substance, quality and action."}, {"n": 921, "b": "13", "t": "Mimamsa", "s": "The school devoted to interpreting Vedic ritual, holding the Vedas to be eternal and authorless."}, {"n": 922, "b": "13", "t": "Anekantavada", "s": "The Jain doctrine of many-sidedness, that reality is too complex to be captured by any single viewpoint."}, {"n": 923, "b": "13", "t": "Syadvada", "s": "The Jain doctrine that every statement is true only in some respect, expressed with a qualifying \"in some way\"."}, {"n": 924, "b": "13", "t": "Ahimsa", "s": "Non-violence toward all living beings, a central virtue in Jainism, Buddhism and Hinduism, later used by Gandhi."}, {"n": 925, "b": "13", "t": "Four Noble Truths", "s": "The Buddha's teaching that life involves suffering, which has a cause, can cease, and has a path to its end."}, {"n": 926, "b": "13", "t": "Noble Eightfold Path", "s": "The Buddhist path of right view, intention, speech, action, livelihood, effort, mindfulness and concentration."}, {"n": 927, "b": "13", "t": "Dependent Origination", "s": "The Buddhist teaching that all phenomena arise in dependence on conditions and have no independent existence."}, {"n": 928, "b": "13", "t": "Dukkha", "s": "The Buddhist term for suffering or unsatisfactoriness, the characteristic of conditioned existence."}, {"n": 929, "b": "13", "t": "Impermanence", "s": "The Buddhist doctrine that all conditioned things are transient and in constant change."}, {"n": 930, "b": "13", "t": "Nirvana", "s": "The Buddhist goal of the extinction of craving and suffering, and release from rebirth."}, {"n": 931, "b": "13", "t": "Middle Way", "s": "The Buddha's path between self-indulgence and extreme asceticism, and between eternalism and annihilationism."}, {"n": 932, "b": "13", "t": "Emptiness", "s": "Nagarjuna's doctrine that all things lack inherent nature and exist only in dependence on other things."}, {"n": 933, "b": "13", "t": "Madhyamaka", "s": "Nagarjuna's school that develops the doctrine of emptiness through a critique of all fixed views."}, {"n": 934, "b": "13", "t": "Two Truths", "s": "The Buddhist distinction between conventional truth and ultimate truth, as interpreted by Madhyamaka."}, {"n": 935, "b": "13", "t": "Yogacara", "s": "The Buddhist school that teaches that experience is structured by consciousness and that the world is mind-dependent."}, {"n": 936, "b": "13", "t": "Buddha-Nature", "s": "The Mahayana teaching that all beings have the potential for awakening."}, {"n": 937, "b": "13", "t": "Bodhisattva", "s": "One who vows to attain awakening for the sake of all beings and postpones final release to help them."}, {"n": 938, "b": "13", "t": "Compassion", "s": "The Buddhist virtue of karuna, wishing to relieve the suffering of others, joined to wisdom."}, {"n": 939, "b": "13", "t": "Mindfulness", "s": "The Buddhist practice of attentive awareness of the present moment as a path to insight."}, {"n": 940, "b": "13", "t": "Abhidharma", "s": "The systematic Buddhist analysis of experience into basic constituents called dharmas."}, {"n": 941, "b": "13", "t": "Buddhist Logic", "s": "Dignaga's and Dharmakirti's theory of knowledge, which treats perception and inference as the only valid means."}, {"n": 942, "b": "13", "t": "Catuskoti", "s": "The four-cornered logic of affirming, denying, both and neither, used in Buddhist argument."}, {"n": 943, "b": "13", "t": "Zen", "s": "The Buddhist school, from Chan, that emphasises direct insight through meditation and beyond doctrinal study."}, {"n": 944, "b": "13", "t": "Satori", "s": "In Zen, a sudden flash of awakening or insight into one's true nature."}, {"n": 945, "b": "13", "t": "Koan", "s": "A paradoxical riddle used in Zen to break the grip of discursive thought."}, {"n": 946, "b": "13", "t": "Kyoto School", "s": "The twentieth-century Japanese philosophers, including Nishida and Nishitani, who combined Zen with Western philosophy."}, {"n": 947, "b": "13", "t": "Absolute Nothingness", "s": "Nishida's and Nishitani's idea of a groundless, unobjectifiable basis of reality that makes all things possible."}, {"n": 948, "b": "13", "t": "Being-Time", "s": "Dogen's thesis that being and time are inseparable and that each moment is complete in itself."}, {"n": 949, "b": "13", "t": "Dao", "s": "The Way, the fundamental pattern of nature and conduct, in Daoism an ineffable source of all things and in Confucianism the right path of life."}, {"n": 950, "b": "13", "t": "Wu Wei", "s": "Non-forcing action, the Daoist ideal of acting in harmony with the natural course of things."}, {"n": 951, "b": "13", "t": "Yin and Yang", "s": "The pair of complementary, interdependent forces whose interplay is seen to generate change in Chinese cosmology."}, {"n": 952, "b": "13", "t": "Qi", "s": "The vital energy or breath that animates the cosmos and the body in Chinese thought."}, {"n": 953, "b": "13", "t": "Ziran", "s": "Spontaneity or naturalness, the self-so quality of the Dao and of things that follow it."}, {"n": 954, "b": "13", "t": "Daodejing", "s": "The classic ascribed to Laozi, which teaches humility, simplicity and yielding in accord with the Dao."}, {"n": 955, "b": "13", "t": "Butterfly Dream", "s": "Zhuangzi's story of dreaming he was a butterfly, which questions the line between dream and waking and between self and other."}, {"n": 956, "b": "13", "t": "Free and Easy Wandering", "s": "Zhuangzi's ideal of spontaneous freedom that transcends conventional distinctions."}, {"n": 957, "b": "13", "t": "Confucianism", "s": "The tradition of Confucius that stresses moral cultivation, social roles, ritual and benevolent government."}, {"n": 958, "b": "13", "t": "Ren", "s": "The Confucian virtue of humaneness or benevolence, the root of ethical life."}, {"n": 959, "b": "13", "t": "Li", "s": "Ritual propriety, the forms of conduct through which Confucians cultivate character and social harmony."}, {"n": 960, "b": "13", "t": "Yi", "s": "Righteousness, the Confucian sense of doing what is appropriate in each situation."}, {"n": 961, "b": "13", "t": "Filial Piety", "s": "The Confucian virtue of respect and care for parents and ancestors, the root of other virtues."}, {"n": 962, "b": "13", "t": "Junzi", "s": "The exemplary person of Confucian ethics, who cultivates virtue and leads by example."}, {"n": 963, "b": "13", "t": "Rectification of Names", "s": "Confucius's thesis that social order requires words to match the roles and realities they name."}, {"n": 964, "b": "13", "t": "Mandate of Heaven", "s": "The Chinese doctrine that rulers hold power by Heaven's approval, which is lost through misrule."}, {"n": 965, "b": "13", "t": "Mencius on Human Nature", "s": "Mencius's view that human nature is good, with moral sprouts that must be nurtured."}, {"n": 966, "b": "13", "t": "Xunzi on Human Nature", "s": "Xunzi's view that human nature is bad and must be reshaped by ritual and education."}, {"n": 967, "b": "13", "t": "Impartial Care", "s": "The Mohist doctrine that we should care for all people equally, as an alternative to Confucian graded love."}, {"n": 968, "b": "13", "t": "Legalism", "s": "The school of Han Feizi that holds that order is maintained by strict law, punishment and the ruler's control."}, {"n": 969, "b": "13", "t": "School of Names", "s": "The Chinese logicians, including Gongsun Long, who analysed language, paradox and the relation between names and things."}, {"n": 970, "b": "13", "t": "Neo-Confucianism", "s": "The Song and Ming revival of Confucianism that integrated metaphysics from Buddhism and Daoism."}, {"n": 971, "b": "13", "t": "Principle and Qi", "s": "Zhu Xi's pairing of li, the patterning principle, with qi, the material energy that realises it."}, {"n": 972, "b": "13", "t": "Unity of Knowledge and Action", "s": "Wang Yangming's thesis that true knowledge of the good is inseparable from acting on it."}, {"n": 973, "b": "13", "t": "Five Phases", "s": "The Chinese system of wood, fire, earth, metal and water as interacting processes of change."}, {"n": 974, "b": "13", "t": "Harmony", "s": "In Chinese thought, the ideal of diverse elements cooperating without being made the same."}, {"n": 975, "b": "13", "t": "Tianxia", "s": "\"All under heaven\", the Chinese idea of a world order that is moral and universal, not merely political."}, {"n": 976, "b": "13", "t": "Ma", "s": "The Japanese notion of meaningful interval or negative space, central to aesthetics and thought."}, {"n": 977, "b": "13", "t": "Bushido", "s": "The code of the samurai, emphasising loyalty, honour and self-discipline."}, {"n": 978, "b": "13", "t": "Falsafa", "s": "The tradition of Islamic philosophy that took up and developed Greek thought in Arabic."}, {"n": 979, "b": "13", "t": "Floating Man", "s": "Avicenna's thought experiment of a suspended man who is aware of himself without sensing his body, suggesting the soul's independence."}, {"n": 980, "b": "13", "t": "Necessary Existent", "s": "Avicenna's argument that a being whose essence entails its existence must ground all contingent things."}, {"n": 981, "b": "13", "t": "Unity of the Intellect", "s": "Averroes's disputed doctrine that the active intellect is one for all humanity."}, {"n": 982, "b": "13", "t": "Incoherence of the Philosophers", "s": "Al-Ghazali's attack on the Aristotelian philosophers, which targeted their claims on causation and the eternity of the world."}, {"n": 983, "b": "13", "t": "Kalam", "s": "The Islamic tradition of rational theology that defends doctrine by argument."}, {"n": 984, "b": "13", "t": "Mutazila", "s": "The rationalist school of Islamic theology holding that reason can know good and evil and that God is just."}, {"n": 985, "b": "13", "t": "Sufism", "s": "The mystical dimension of Islam that seeks direct experience of God through love and discipline."}, {"n": 986, "b": "13", "t": "Fana", "s": "The Sufi annihilation of the self in God."}, {"n": 987, "b": "13", "t": "Illuminationism", "s": "Suhrawardi's philosophy in which reality is a hierarchy of light, known by direct presence as well as by reasoning."}, {"n": 988, "b": "13", "t": "Primacy of Existence", "s": "Mulla Sadra's claim that existence, not essence, is fundamental and that being admits of degrees and motion."}, {"n": 989, "b": "13", "t": "Virtuous City", "s": "Al-Farabi's vision of a state ruled by a philosopher-prophet, modelled on Plato."}, {"n": 990, "b": "13", "t": "Asabiyyah", "s": "Ibn Khaldun's concept of group solidarity as the driving force in the rise and fall of dynasties."}, {"n": 991, "b": "13", "t": "I and Thou", "s": "Buber's distinction between the I-It relation of use and the I-Thou relation of mutual presence."}, {"n": 992, "b": "13", "t": "Kabbalah", "s": "The Jewish mystical tradition that interprets the divine as emanating through a structure of ten spheres."}, {"n": 993, "b": "13", "t": "Ubuntu", "s": "The southern African idea that a person is a person through other persons, grounding an ethics of community."}, {"n": 994, "b": "13", "t": "Akan Concept of Person", "s": "The Akan view of a person as a composite of elements, with an emphasis on community and character."}, {"n": 995, "b": "13", "t": "Sage Philosophy", "s": "The study by Odera Oruka of the reflective thought of traditional African sages."}, {"n": 996, "b": "13", "t": "Négritude", "s": "The movement of Césaire and Senghor that affirmed black identity and culture against colonial denigration."}, {"n": 997, "b": "13", "t": "Ethnophilosophy", "s": "The study of philosophical thought embodied in the shared beliefs and practices of African peoples, and the critique of it."}, {"n": 998, "b": "13", "t": "Philosophy of Liberation", "s": "Dussel's and others' Latin American philosophy that starts from the standpoint of the oppressed."}, {"n": 999, "b": "13", "t": "Buen Vivir", "s": "The Andean ideal of living well in harmony with community and nature."}, {"n": 1000, "b": "13", "t": "Indigenous Relationality", "s": "The view found across many Indigenous traditions that persons, land and other beings are bound in reciprocal relationships."}];
const BRANCHES = {"01": "Metaphysics and Ontology", "02": "Epistemology", "03": "Logic and Mathematics", "04": "Language", "05": "Mind", "06": "Ethics", "07": "Political and Social", "08": "Aesthetics", "09": "Science", "10": "Religion", "11": "Existential and Continental", "12": "Action and Identity", "13": "Non-Western"};
const $ = id => document.getElementById(id);

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function chip(key, label) {

}
chip("all", "All");
for (const k of Object.keys(BRANCHES)) chip(k, BRANCHES[k]);
function hl(text, q) {
  const e = esc(text);
  if (!q) return e;
  const i = norm(text).indexOf(q);
  if (i < 0) return e;
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}
function render() {
  const q = norm($("q").value.trim());
  const az = $("ord").value === "az";
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.key === branch));
  let rows = DATA.filter(d => (branch === "all" || d.b === branch) && (!q || norm(d.t).includes(q) || norm(d.s).includes(q)));
  if (az) rows = rows.slice().sort((a, b) => norm(a.t).localeCompare(norm(b.t)));
  $("count").textContent = rows.length + " of " + DATA.length + " concepts";
  const azBox = $("az");

    azBox.querySelectorAll("button").forEach(b => b.onclick = () => {
      const t = document.querySelector('[data-first="' + b.dataset.l + '"]');

  if (!rows.length) { $("list").innerHTML = '<div class="empty">No concepts match.</div>'; return; }
  const seen = new Set();

    const l = norm(r.t)[0].toUpperCase();

    return '<article class="card" id="c' + r.n + '"' + first + '><span class="tag">' + esc(BRANCHES[r.b]) + "</span><h2><span class=\"num\">" + r.n + "</span>" + hl(r.t, q) + "</h2><p>" + hl(r.s, q) + "</p></article>";
  }).join("");
}
$("q").addEventListener("input", render);
$("ord").addEventListener("change", render);
render();
if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
