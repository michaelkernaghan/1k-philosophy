<style>
:root{--bg:#faf8f4;--fg:#222;--muted:#6b665e;--card:#fff;--line:#d9d3c7;--link:#c9c2b4}
@media (prefers-color-scheme:dark){:root{--bg:#18171a;--fg:#e8e4dc;--muted:#a09a8f;--card:#222126;--line:#34323a;--link:#4a4752}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);z-index:3;flex-wrap:wrap}
#top h1{font:600 1rem Georgia,serif;margin:0 6px 0 0}
#q{flex:1;min-width:160px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
button.b{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 10px;border-radius:8px;font:inherit;cursor:pointer}
#hits{position:fixed;top:48px;left:12px;width:min(320px,calc(100% - 24px));max-height:40vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;z-index:4;display:none}
#hits div{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
#hits div:hover{background:var(--line)}
#hits small{color:var(--muted)}
svg{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
svg.drag{cursor:grabbing}
.link{fill:none;stroke:var(--link);stroke-width:1}
.node{cursor:pointer}
.node text{fill:var(--fg);pointer-events:none}
.node circle{stroke:var(--bg);stroke-width:1.5}
.leaf text{font-size:11px}
.sel circle{stroke:var(--fg);stroke-width:2.5}
#panel{position:fixed;right:12px;bottom:12px;width:min(380px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;z-index:3;display:none;font:15px/1.5 Georgia,serif}
#panel h2{margin:0 0 4px;font-size:1.05rem}
#panel .meta{color:var(--muted);font:12px system-ui,sans-serif;margin-bottom:6px}
#panel .x{position:absolute;right:8px;top:4px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
#help{position:fixed;left:12px;bottom:12px;color:var(--muted);font-size:12px;z-index:2}
</style>

<script>
const TREE = {"name": "Philosophy", "children": [{"name": "Metaphysics", "k": "01", "children": [{"name": "Being and Existence", "children": [{"n": 1, "t": "Being", "s": "The most general question of what it is for anything to exist at all; Parmenides, Aristotle and Heidegger each made it central, asking what \"is\" means across all that is.", "b": "01"}, {"n": 4, "t": "Existence", "s": "Whether and how anything is actual; Kant argued it is not a real predicate, and Quine held that to be is to be the value of a bound variable.", "b": "01"}, {"n": 74, "t": "Nothingness", "s": "The idea of absence or non-being; Parmenides banned it, Sartre made it constitutive of consciousness, and Leibniz asked why there is something rather than nothing.", "b": "01"}, {"n": 75, "t": "Why Is There Something Rather Than Nothing", "s": "Leibniz's ultimate question of existence, asking why there is a world at all and whether the question has any answer.", "b": "01"}, {"n": 76, "t": "Metaontology", "s": "The study of what ontological questions mean, and whether they have objective answers or only answers relative to a framework.", "b": "01"}, {"n": 77, "t": "Ontological Commitment", "s": "Quine's idea that a theory is committed to whatever must exist for it to be true, read off from its quantifiers.", "b": "01"}, {"n": 78, "t": "Ontological Relativity", "s": "Quine's thesis that what a theory refers to can be fixed only relative to a background language and a mapping to another.", "b": "01"}, {"n": 79, "t": "Categories", "s": "The most general kinds of being; Aristotle listed ten, including substance, quantity, quality and relation, and Kant gave twelve concepts of understanding.", "b": "01"}, {"n": 80, "t": "Transcendentals", "s": "In scholastic thought, properties of being as such, usually unity, truth and goodness, convertible with being.", "b": "01"}, {"n": 81, "t": "Analogy of Being", "s": "The scholastic doctrine that \"being\" applies to God and creatures neither univocally nor equivocally but by analogy.", "b": "01"}, {"n": 82, "t": "Esse and Essentia", "s": "Aquinas's distinction between a thing's act of existing and its essence, which in God alone are identical.", "b": "01"}, {"n": 91, "t": "Appearance and Reality", "s": "The distinction between how things seem and how they are, running from Parmenides and Plato through Bradley.", "b": "01"}, {"n": 95, "t": "Existence Precedes Essence", "s": "Sartre's claim that a human being first exists and then defines itself by choice, with no fixed nature given in advance.", "b": "01"}]}, {"name": "Substance and Essence", "children": [{"n": 2, "t": "Substance", "s": "The underlying bearer of properties that persists through change; for Aristotle the primary reality, for Descartes and Spinoza what depends on nothing else, for Locke an unknowable substratum.", "b": "01"}, {"n": 3, "t": "Essence", "s": "What a thing is in itself, those features without which it would not be the thing it is, as opposed to its merely accidental traits.", "b": "01"}, {"n": 9, "t": "Platonic Forms", "s": "Plato's eternal, perfect, non-physical patterns, such as the Good and the Beautiful, of which sensible things are imperfect copies.", "b": "01"}, {"n": 10, "t": "Matter", "s": "The stuff or potential from which things are made; in Aristotle it is what takes form, in modern thought what physics describes.", "b": "01"}, {"n": 11, "t": "Hylomorphism", "s": "Aristotle's view that every natural thing is a compound of matter and form, with the form making the matter the kind of thing it is.", "b": "01"}, {"n": 41, "t": "Essentialism", "s": "The view that some properties are essential to an object, so it could not exist without them.", "b": "01"}, {"n": 42, "t": "Haecceity", "s": "The \"thisness\" of an individual, the non-qualitative property that makes it this very thing and no other, a notion due to Duns Scotus.", "b": "01"}, {"n": 43, "t": "Individuation", "s": "The question of what makes one thing a single, distinct individual, whether matter, form, location or bare particularity.", "b": "01"}, {"n": 44, "t": "Quiddity", "s": "The \"whatness\" of a thing, its essence as answering the question what it is, a term of scholastic philosophy.", "b": "01"}, {"n": 88, "t": "Conatus", "s": "Spinoza's term for the striving of every thing to persevere in its own being, the root of his psychology and ethics.", "b": "01"}, {"n": 89, "t": "Accident", "s": "A property a thing has but could lack without ceasing to be what it is, in contrast to its essence.", "b": "01"}, {"n": 90, "t": "Mode", "s": "In Spinoza, a particular way a substance is affected; in scholastic thought, a determination of a thing that is neither substance nor accident.", "b": "01"}]}, {"name": "Universals and Properties", "children": [{"n": 5, "t": "Universals", "s": "Properties or kinds, such as redness, that many particular things seem to share; the debate is whether they exist beyond their instances.", "b": "01"}, {"n": 6, "t": "Particulars", "s": "Individual, unrepeatable things located in space and time, contrasted with the universals they instantiate.", "b": "01"}, {"n": 7, "t": "Nominalism", "s": "The view that only particulars exist and that general terms name no shared entities, only similar things or the words we apply to them.", "b": "01"}, {"n": 8, "t": "Realism about Universals", "s": "The view that universals exist, either apart from their instances (Plato) or only in them (Aristotle, Armstrong).", "b": "01"}, {"n": 59, "t": "Properties", "s": "The qualities and relations things have; the debate is whether they are universals, sets, tropes or something else.", "b": "01"}, {"n": 60, "t": "Tropes", "s": "Particularized properties, such as this particular redness of this apple, proposed as the basic building blocks of reality.", "b": "01"}, {"n": 61, "t": "Bundle Theory", "s": "The view, taken from Hume, that an object is nothing but a collection of properties with no substratum beyond them.", "b": "01"}, {"n": 62, "t": "Natural Kinds", "s": "Categories that carve nature at its joints, such as gold or tiger, as opposed to arbitrary groupings.", "b": "01"}, {"n": 63, "t": "Dispositions", "s": "Properties like fragility or solubility, tendencies to manifest in certain conditions, which some hold to be irreducibly basic.", "b": "01"}, {"n": 68, "t": "Abstract Objects", "s": "Entities like numbers, sets and propositions that are not located in space and time and have no causal power.", "b": "01"}, {"n": 69, "t": "Platonism", "s": "The view that abstract objects, especially mathematical ones, exist independently of minds and language.", "b": "01"}, {"n": 70, "t": "Fictionalism", "s": "The view that statements about some domain, such as numbers or morals, are useful fictions rather than literal truths.", "b": "01"}]}, {"name": "Causation and Laws", "children": [{"n": 12, "t": "Causation", "s": "The relation by which one event or state brings about another; analyses include regularity, counterfactual dependence, and productive power.", "b": "01"}, {"n": 13, "t": "Four Causes", "s": "Aristotle's material, formal, efficient and final causes, four distinct ways of answering \"why is this thing as it is?\"", "b": "01"}, {"n": 14, "t": "Teleology", "s": "Explanation by purpose or end; Aristotle saw ends in nature, while modern science generally excludes final causes outside agency.", "b": "01"}, {"n": 15, "t": "Potentiality and Actuality", "s": "Aristotle's pair for what a thing can become versus what it currently is, used to explain change without making something come from nothing.", "b": "01"}, {"n": 40, "t": "Principle of Sufficient Reason", "s": "Leibniz's principle that everything has a reason why it is so rather than otherwise.", "b": "01"}, {"n": 64, "t": "Laws of Nature", "s": "The regularities or necessities governing events; Humeans see them as patterns, while others see real necessitation.", "b": "01"}, {"n": 65, "t": "Humean Supervenience", "s": "Lewis's doctrine that all facts supervene on the spatiotemporal arrangement of local qualities, with no necessary connections.", "b": "01"}, {"n": 66, "t": "Counterfactuals", "s": "Conditionals about what would have happened had things been otherwise, analysed through possible worlds by Stalnaker and Lewis.", "b": "01"}, {"n": 85, "t": "Pre-established Harmony", "s": "Leibniz's doctrine that substances do not interact but were created by God to unfold in perfect agreement.", "b": "01"}, {"n": 86, "t": "Occasionalism", "s": "The view that God is the only true cause, and created things merely provide occasions for his action.", "b": "01"}]}, {"name": "Time, Space and Change", "children": [{"n": 16, "t": "Change", "s": "The problem of how a thing can become different yet remain itself; Parmenides denied it and Heraclitus made it fundamental.", "b": "01"}, {"n": 17, "t": "Becoming", "s": "Reality understood as ceaseless flux rather than fixed being, associated with Heraclitus, Hegel and Whitehead.", "b": "01"}, {"n": 21, "t": "Persistence", "s": "How an object exists across time, either by being wholly present at each moment (endurance) or by having temporal parts (perdurance).", "b": "01"}, {"n": 22, "t": "Endurantism", "s": "The view that an ordinary object is wholly present at every moment of its existence and has no temporal parts.", "b": "01"}, {"n": 23, "t": "Perdurantism", "s": "The view that objects are four-dimensional wholes extended in time, with each moment a temporal part, as developed by Lewis and Sider.", "b": "01"}, {"n": 24, "t": "Time", "s": "The dimension of before and after; Augustine and McTaggart asked whether it is real, and physics and metaphysics dispute its direction and flow.", "b": "01"}, {"n": 25, "t": "A-Theory of Time", "s": "The view that the passage of time and the distinction of past, present and future are objective features of reality.", "b": "01"}, {"n": 26, "t": "Presentism", "s": "The A-theory that only present things exist, so the past is gone and the future is not yet.", "b": "01"}, {"n": 27, "t": "B-Theory of Time", "s": "The view that events are ordered only by earlier-than and later-than, and that the flow of time is an illusion of perspective.", "b": "01"}, {"n": 28, "t": "Eternalism", "s": "The view that past, present and future events all exist equally, as in the block universe suggested by relativity.", "b": "01"}, {"n": 29, "t": "Growing Block Universe", "s": "The view that the past and present exist but the future does not, so reality grows as time passes.", "b": "01"}, {"n": 30, "t": "McTaggart's Paradox", "s": "The argument that time is unreal because the A-series is contradictory and the B-series alone cannot give change.", "b": "01"}, {"n": 31, "t": "Space", "s": "The arena of spatial relations; the question is whether it is a thing, a container, or just the relations among bodies.", "b": "01"}, {"n": 32, "t": "Substantivalism", "s": "The view that space or spacetime is a real entity existing independently of the objects in it, as Newton held.", "b": "01"}, {"n": 33, "t": "Relationalism", "s": "The view that space and time are nothing over and above relations among objects and events, as Leibniz argued.", "b": "01"}, {"n": 71, "t": "Events", "s": "Occurrences like a collision or a birth; the debate is whether they are basic particulars or properties of objects at times.", "b": "01"}, {"n": 83, "t": "Process Philosophy", "s": "The view, from Whitehead, that events and becoming rather than enduring substances are the basic realities.", "b": "01"}]}, {"name": "Identity", "children": [{"n": 18, "t": "Identity", "s": "The relation each thing bears only to itself; philosophers ask what makes a thing one and the same over time and across descriptions.", "b": "01"}, {"n": 19, "t": "Identity of Indiscernibles", "s": "Leibniz's principle that no two distinct things share all their properties; its converse, the indiscernibility of identicals, is uncontroversial.", "b": "01"}, {"n": 20, "t": "Leibniz's Law", "s": "If a and b are identical, whatever is true of a is true of b; it is the standard test for ruling out claimed identities.", "b": "01"}, {"n": 58, "t": "Ship of Theseus", "s": "A puzzle about identity over time: if every plank of a ship is replaced, and the old planks reassembled, which ship is the original?", "b": "01"}]}, {"name": "Modality", "children": [{"n": 34, "t": "Possibility and Necessity", "s": "The modal notions of what could be and what must be, which give metaphysics its distinction between the contingent and the unavoidable.", "b": "01"}, {"n": 35, "t": "Possible Worlds", "s": "Complete ways things might have been, used since Leibniz and Kripke to analyse necessity, possibility and counterfactuals.", "b": "01"}, {"n": 36, "t": "Modal Realism", "s": "David Lewis's thesis that possible worlds are as real as our own, concrete and causally isolated from one another.", "b": "01"}, {"n": 37, "t": "Actualism", "s": "The view that only actual things exist, so talk of merely possible entities must be reduced to something actual.", "b": "01"}, {"n": 38, "t": "Contingency", "s": "The status of what is true but might have been false; Leibniz and Aquinas used it to argue for a necessary ground.", "b": "01"}, {"n": 39, "t": "Necessary Being", "s": "A being that cannot fail to exist, invoked in cosmological arguments as the explanation of contingent things.", "b": "01"}]}, {"name": "Parts, Wholes and Dependence", "children": [{"n": 50, "t": "Emergence", "s": "The idea that complex systems have properties that are not predictable from, or reducible to, those of their parts.", "b": "01"}, {"n": 51, "t": "Supervenience", "s": "A dependence relation on which there can be no difference in one domain, such as the mental or moral, without a difference in another.", "b": "01"}, {"n": 52, "t": "Reduction", "s": "Explaining one domain, a theory or kind of entity, wholly in terms of another more basic domain.", "b": "01"}, {"n": 53, "t": "Grounding", "s": "A relation of metaphysical explanation by which one fact holds in virtue of another, such as the fact that a set exists in virtue of its members.", "b": "01"}, {"n": 54, "t": "Fundamentality", "s": "The question of which entities or facts are basic and which are derivative, structuring all of metaphysics.", "b": "01"}, {"n": 55, "t": "Mereology", "s": "The formal theory of parts and wholes, asking when objects compose a further object and how parthood behaves.", "b": "01"}, {"n": 56, "t": "Composition", "s": "Van Inwagen's Special Composition Question: under what conditions do several things add up to a single object?", "b": "01"}, {"n": 57, "t": "Vagueness", "s": "The fact that many predicates lack sharp boundaries; the issue is whether this is a defect of language, knowledge or reality.", "b": "01"}, {"n": 67, "t": "Truthmakers", "s": "The things in the world in virtue of which true statements are true; the question is whether every truth needs one.", "b": "01"}, {"n": 72, "t": "Facts", "s": "What makes true statements true, or true propositions themselves; their status is contested between Russell, Wittgenstein and Strawson.", "b": "01"}, {"n": 73, "t": "States of Affairs", "s": "Complexes of an object having a property or objects standing in a relation, taken by Armstrong as the world's basic constituents.", "b": "01"}, {"n": 94, "t": "Internal and External Relations", "s": "Whether relations are grounded in the natures of the things related, as monists hold, or can be external to them, as Russell held.", "b": "01"}]}, {"name": "Grand Positions", "children": [{"n": 45, "t": "Monism", "s": "The view that reality is ultimately one kind of thing, or even one thing, as in Parmenides, Spinoza and Advaita.", "b": "01"}, {"n": 46, "t": "Pluralism", "s": "The view that reality comprises many fundamentally distinct entities or kinds, with no single underlying one.", "b": "01"}, {"n": 47, "t": "Idealism", "s": "The view that reality is fundamentally mental or dependent on mind, whether Berkeley's ideas, Kant's transcendental form, or Hegel's Spirit.", "b": "01"}, {"n": 48, "t": "Materialism", "s": "The view that everything that exists is matter or depends on matter, a thesis traceable to Democritus and Lucretius.", "b": "01"}, {"n": 49, "t": "Naturalism", "s": "The view that reality is exhausted by the natural world studied by science, with no supernatural order beyond it.", "b": "01"}, {"n": 84, "t": "Monad", "s": "Leibniz's simple, windowless, soul-like substances of which all reality is composed, each mirroring the universe.", "b": "01"}, {"n": 87, "t": "Neutral Monism", "s": "The view that mind and matter are both made of one neutral stuff, as held by Russell and Mach.", "b": "01"}, {"n": 92, "t": "Immanence and Transcendence", "s": "Whether the divine or ultimate lies within the world or beyond it, a division organising pantheism, theism and much modern thought.", "b": "01"}, {"n": 93, "t": "Coherentism about Reality", "s": "The idealist view, as in Bradley, that reality is a single coherent whole and that separate things are abstractions from it.", "b": "01"}]}]}, {"name": "Epistemology", "k": "02", "children": [{"name": "Knowledge and Truth", "children": [{"n": 96, "t": "Knowledge", "s": "Traditionally justified true belief; the field asks what knowing requires and how it differs from mere opinion or luck.", "b": "02"}, {"n": 97, "t": "Justified True Belief", "s": "The classical analysis of knowledge from Plato's Theaetetus, attacked by Gettier as insufficient.", "b": "02"}, {"n": 98, "t": "Gettier Problem", "s": "Edmund Gettier's 1963 counterexamples showing that justified true belief can arise by luck without being knowledge.", "b": "02"}, {"n": 99, "t": "Truth", "s": "The property of statements or beliefs that say how things are; correspondence, coherence and pragmatist accounts compete.", "b": "02"}, {"n": 100, "t": "Correspondence Theory of Truth", "s": "Truth consists in agreement with the facts; a belief is true when the world is as it says.", "b": "02"}, {"n": 101, "t": "Coherence Theory of Truth", "s": "Truth consists in coherence within a comprehensive system of beliefs, favoured by idealists such as Bradley.", "b": "02"}, {"n": 102, "t": "Pragmatic Theory of Truth", "s": "Truth is what works or is warranted in the long run of inquiry, as in Peirce, James and Dewey.", "b": "02"}, {"n": 103, "t": "Deflationism about Truth", "s": "The view that calling something true adds nothing beyond asserting it, so truth is not a substantive property.", "b": "02"}, {"n": 167, "t": "Knowledge How and Knowledge That", "s": "Ryle's distinction between practical skill and propositional knowledge, with the dispute over whether the former reduces to the latter.", "b": "02"}, {"n": 180, "t": "Knowledge First", "s": "Williamson's thesis that knowledge is a basic, unanalysable mental state, not a compound of belief plus other factors.", "b": "02"}, {"n": 181, "t": "Safety and Sensitivity", "s": "Modal conditions on knowledge: that one would not easily have believed falsely, or would not have believed had p been false.", "b": "02"}, {"n": 185, "t": "Wisdom", "s": "Practical and theoretical excellence in understanding and judgment, treated by many traditions as the aim of inquiry beyond knowledge.", "b": "02"}, {"n": 186, "t": "Understanding", "s": "A grasp of how things hang together, widely held to be more than mere knowledge of facts.", "b": "02"}, {"n": 188, "t": "Nous", "s": "The Greek term for intellect or intuitive reason, which Plato and Aristotle took to grasp first principles directly and which Plotinus placed second in the hierarchy of being.", "b": "02"}]}, {"name": "Justification", "children": [{"n": 104, "t": "Belief", "s": "The attitude of taking something to be the case; epistemology asks when it is rational and whether it is voluntary.", "b": "02"}, {"n": 105, "t": "Justification", "s": "The standing a belief has when it is properly supported; internalists tie it to what the believer can access, externalists to reliable connection.", "b": "02"}, {"n": 106, "t": "Foundationalism", "s": "The view that knowledge rests on basic beliefs that need no further support, with all other justified belief built upon them.", "b": "02"}, {"n": 107, "t": "Coherentism", "s": "The view that beliefs are justified by fitting together in a mutually supporting web, with no privileged foundation.", "b": "02"}, {"n": 108, "t": "Infinitism", "s": "The view that justification rests on an endless chain of reasons, so that no belief is basic.", "b": "02"}, {"n": 109, "t": "Regress Problem", "s": "The worry that every justification needs a further justification, leading to infinite regress, circularity or arbitrary stopping.", "b": "02"}, {"n": 110, "t": "Internalism and Externalism", "s": "The dispute over whether justification depends only on factors accessible to the believer or can depend on facts outside awareness.", "b": "02"}, {"n": 111, "t": "Reliabilism", "s": "The view that a belief is justified or known if produced by a process that reliably yields true beliefs.", "b": "02"}, {"n": 112, "t": "Virtue Epistemology", "s": "The view that knowledge is belief that is true because of the believer's intellectual virtues or competences, as developed by Sosa and Zagzebski.", "b": "02"}, {"n": 140, "t": "Evidentialism", "s": "The view that one should believe a proposition only to the degree one's evidence supports it, as Clifford and Conee and Feldman maintain.", "b": "02"}, {"n": 141, "t": "Pragmatic Encroachment", "s": "The thesis that practical stakes affect whether a belief counts as knowledge.", "b": "02"}, {"n": 150, "t": "Epistemic Luck", "s": "The way knowledge can be undermined when a belief's truth is due to chance rather than to the believer's competence.", "b": "02"}, {"n": 151, "t": "Epistemic Norms", "s": "The standards, such as truth, evidence and coherence, that govern what one ought to believe.", "b": "02"}, {"n": 152, "t": "Epistemic Virtue", "s": "Traits like open-mindedness, intellectual courage and carefulness that make a person a good inquirer.", "b": "02"}, {"n": 153, "t": "Doxastic Voluntarism", "s": "The question of whether we can choose what to believe, which bears on whether belief can be obligatory.", "b": "02"}, {"n": 154, "t": "Pascal's Wager", "s": "Pascal's argument that belief in God is the rational bet given infinite possible reward, which raises the issue of believing on practical grounds.", "b": "02"}, {"n": 155, "t": "The Will to Believe", "s": "James's defence of holding a belief without sufficient evidence in genuine, live and momentous options.", "b": "02"}, {"n": 182, "t": "Defeaters", "s": "Further evidence that undermines the justification a belief previously had.", "b": "02"}, {"n": 183, "t": "Basic Beliefs", "s": "Beliefs that are justified without being inferred from other beliefs, like perceptual or memory beliefs, in foundationalist theory.", "b": "02"}, {"n": 184, "t": "Reformed Epistemology", "s": "Plantinga's view that belief in God can be properly basic and justified without arguments.", "b": "02"}]}, {"name": "Skepticism", "children": [{"n": 113, "t": "Skepticism", "s": "The doubt that we have knowledge or justified belief in some domain, a challenge answered rather than ignored by most epistemology.", "b": "02"}, {"n": 114, "t": "Pyrrhonian Skepticism", "s": "The ancient practice of suspending judgment in the face of equally balanced arguments in order to reach tranquillity.", "b": "02"}, {"n": 115, "t": "Academic Skepticism", "s": "The Hellenistic Academy's view that nothing can be known with certainty, though some beliefs are more probable than others.", "b": "02"}, {"n": 116, "t": "Cartesian Doubt", "s": "Descartes' method of withholding assent from whatever can be doubted to find an indubitable foundation, ending in the cogito.", "b": "02"}, {"n": 117, "t": "Cogito", "s": "Descartes' \"I think, therefore I am,\" the claim that the very act of doubting guarantees the thinker's existence.", "b": "02"}, {"n": 118, "t": "Evil Demon Argument", "s": "Descartes' hypothesis of a deceiver who makes all experience misleading, used to test how much can be known.", "b": "02"}, {"n": 119, "t": "Brain in a Vat", "s": "Putnam's modern version of the demon scenario, in which a disembodied brain is fed simulated experience.", "b": "02"}, {"n": 120, "t": "Closure Principle", "s": "If one knows p and knows that p entails q, one knows q; skeptical arguments exploit it and some answers deny it.", "b": "02"}, {"n": 121, "t": "Contextualism", "s": "The view that the standards for \"knows\" shift with the context of the speaker, so the same claim may be true in one setting and false in another.", "b": "02"}, {"n": 122, "t": "Fallibilism", "s": "The view that one can know something even though one's evidence does not rule out error.", "b": "02"}, {"n": 123, "t": "Certainty", "s": "A state of complete assurance, which Descartes sought and many later philosophers held to be unattainable for empirical beliefs.", "b": "02"}, {"n": 165, "t": "Hinge Epistemology", "s": "Wittgenstein's idea in On Certainty that some propositions are exempt from doubt because they form the framework of inquiry.", "b": "02"}, {"n": 166, "t": "Moorean Response", "s": "G. E. Moore's reply to skepticism that he knows he has hands, so that skeptical conclusions are less certain than ordinary knowledge.", "b": "02"}]}, {"name": "Sources of Knowledge", "children": [{"n": 124, "t": "A Priori and A Posteriori", "s": "Knowledge independent of experience versus knowledge that rests on it, a distinction made central by Kant.", "b": "02"}, {"n": 125, "t": "Analytic and Synthetic", "s": "Kant's distinction between judgments true by meaning alone and judgments that add information, challenged by Quine.", "b": "02"}, {"n": 126, "t": "Synthetic A Priori", "s": "Kant's category of judgments that extend knowledge yet are known independently of experience, such as the claims of mathematics and geometry.", "b": "02"}, {"n": 127, "t": "Rationalism", "s": "The view that reason, not sense experience, is the chief source of knowledge, held by Descartes, Spinoza and Leibniz.", "b": "02"}, {"n": 128, "t": "Empiricism", "s": "The view that all knowledge derives from experience, held by Locke, Berkeley and Hume.", "b": "02"}, {"n": 129, "t": "Innate Ideas", "s": "Concepts or knowledge present in the mind from birth, affirmed by rationalists and denied by Locke.", "b": "02"}, {"n": 130, "t": "Tabula Rasa", "s": "Locke's image of the mind as a blank slate on which experience writes.", "b": "02"}, {"n": 142, "t": "Testimony", "s": "Knowledge gained by being told; the question is whether trust in others is basic or must be justified by independent checks.", "b": "02"}, {"n": 143, "t": "Memory", "s": "The retention of past information; epistemologists ask how it justifies belief and what it means to remember rather than reconstruct.", "b": "02"}, {"n": 168, "t": "Self-Knowledge", "s": "Knowledge of one's own mental states, widely thought to be special in being direct and non-observational.", "b": "02"}, {"n": 169, "t": "Privileged Access", "s": "The view that one has an authoritative, immediate access to one's own mental states that others lack.", "b": "02"}, {"n": 170, "t": "Introspection", "s": "Looking inward at one's own mental states, whose reliability has been challenged by psychology.", "b": "02"}, {"n": 171, "t": "Intuition", "s": "A seeming that something is true without explicit inference, treated as evidence in philosophical method.", "b": "02"}]}, {"name": "Perception and Appearance", "children": [{"n": 131, "t": "Sense Data", "s": "The immediate objects of perception, supposed by some philosophers to be what we are directly aware of, rather than physical things.", "b": "02"}, {"n": 132, "t": "Perception", "s": "How the mind comes to be aware of the world through the senses, with direct and indirect theories contesting what is perceived.", "b": "02"}, {"n": 133, "t": "Direct Realism", "s": "The view that we perceive external objects directly, with nothing mental standing between us and them.", "b": "02"}, {"n": 134, "t": "Representative Realism", "s": "The view that we perceive the world through mental representations that stand in for external objects, as in Locke.", "b": "02"}, {"n": 135, "t": "Phenomenalism", "s": "The view that physical objects are constructions out of actual and possible sense experiences, advanced by Mill and Ayer.", "b": "02"}, {"n": 156, "t": "Noumenon and Phenomenon", "s": "Kant's contrast between things as they appear and things as they are in themselves, the latter being unknowable.", "b": "02"}, {"n": 157, "t": "Thing-in-Itself", "s": "Kant's term for reality as it is independent of our forms of perception, which we can think but never know.", "b": "02"}, {"n": 158, "t": "Transcendental Idealism", "s": "Kant's doctrine that space, time and the categories are contributions of the mind, so we know only appearances.", "b": "02"}, {"n": 159, "t": "Transcendental Argument", "s": "An argument that identifies necessary conditions of experience or thought, used by Kant and later against skepticism.", "b": "02"}, {"n": 160, "t": "The Given", "s": "The supposed immediate, non-conceptual element of experience that grounds knowledge, rejected by Sellars as a myth.", "b": "02"}, {"n": 161, "t": "Myth of the Given", "s": "Sellars's attack on the idea that experience provides non-inferential knowledge independent of any conceptual framework.", "b": "02"}]}, {"name": "Induction and Evidence", "children": [{"n": 136, "t": "Problem of Induction", "s": "Hume's challenge that no non-circular argument justifies inferring the unobserved from the observed.", "b": "02"}, {"n": 137, "t": "Induction", "s": "Reasoning from observed cases to general conclusions, the engine of empirical science and the target of Hume's doubt.", "b": "02"}, {"n": 138, "t": "Abduction", "s": "Inference to the best explanation, introduced by Peirce as reasoning from effects to the hypothesis that would best account for them.", "b": "02"}, {"n": 139, "t": "Bayesian Epistemology", "s": "The view that rational belief comes in degrees obeying the probability calculus and is updated by conditionalisation on evidence.", "b": "02"}, {"n": 162, "t": "Two Dogmas of Empiricism", "s": "Quine's critique of the analytic-synthetic distinction and of reductionism, supporting a holistic view of confirmation.", "b": "02"}, {"n": 163, "t": "Confirmation Holism", "s": "The Duhem-Quine thesis that hypotheses face the tribunal of experience only together with auxiliary assumptions.", "b": "02"}, {"n": 164, "t": "Underdetermination", "s": "The thesis that evidence can fit more than one theory, so data alone cannot decide which is true.", "b": "02"}, {"n": 176, "t": "Verificationism", "s": "The view of the logical positivists that a statement is meaningful only if it can be verified empirically or is true by definition.", "b": "02"}, {"n": 177, "t": "Falsificationism", "s": "Popper's criterion that scientific claims must be capable of being refuted by observation.", "b": "02"}, {"n": 179, "t": "Paradigm Shift", "s": "Kuhn's term for a revolutionary change in the basic framework of a science, raising questions of incommensurability and progress.", "b": "02"}]}, {"name": "Social Epistemology and Method", "children": [{"n": 144, "t": "Epistemic Peer Disagreement", "s": "The problem of what to believe when an equally informed and capable thinker disagrees with you.", "b": "02"}, {"n": 145, "t": "Social Epistemology", "s": "The study of knowledge as a social phenomenon, including testimony, expertise, institutions and the spread of belief.", "b": "02"}, {"n": 146, "t": "Epistemic Injustice", "s": "Miranda Fricker's term for wrongs done to people as knowers, through testimonial or hermeneutical exclusion.", "b": "02"}, {"n": 147, "t": "Standpoint Epistemology", "s": "The view that social position shapes what one can know, and that marginalised standpoints can yield privileged insight into power.", "b": "02"}, {"n": 148, "t": "Feminist Epistemology", "s": "A family of views that examine how gender shapes the production and evaluation of knowledge.", "b": "02"}, {"n": 149, "t": "Naturalized Epistemology", "s": "Quine's proposal to treat knowledge as a subject for empirical science, replacing normative theory with psychology.", "b": "02"}, {"n": 172, "t": "Thought Experiment", "s": "A scenario devised to test a theory by what we would judge about it, as in Gettier cases and trolley problems.", "b": "02"}, {"n": 173, "t": "Experimental Philosophy", "s": "The use of surveys and empirical methods to study the intuitions behind philosophical positions.", "b": "02"}, {"n": 174, "t": "Conceptual Analysis", "s": "The attempt to clarify a concept by stating necessary and sufficient conditions for its application.", "b": "02"}, {"n": 175, "t": "Reflective Equilibrium", "s": "Rawls's method of adjusting principles and particular judgments until they cohere.", "b": "02"}, {"n": 178, "t": "Epistemic Relativism", "s": "The view that what counts as knowledge or justified belief varies with a culture, framework or community.", "b": "02"}, {"n": 187, "t": "Hermeneutics", "s": "The theory of interpretation, developed by Schleiermacher, Dilthey and Gadamer, treating understanding as always situated and historical.", "b": "02"}]}]}, {"name": "Logic and Mathematics", "k": "03", "children": [{"name": "Foundations of Logic", "children": [{"n": 189, "t": "Logic", "s": "The study of correct inference, concerned with what follows from what and what makes an argument valid.", "b": "03"}, {"n": 190, "t": "Validity", "s": "A property of arguments whose conclusion cannot be false if the premises are true.", "b": "03"}, {"n": 191, "t": "Soundness", "s": "A valid argument with true premises, which therefore guarantees a true conclusion.", "b": "03"}, {"n": 192, "t": "Deduction", "s": "Reasoning in which the conclusion follows necessarily from the premises, as opposed to induction or abduction.", "b": "03"}, {"n": 193, "t": "Syllogism", "s": "Aristotle's form of deduction with two premises and a conclusion, such as \"all men are mortal; Socrates is a man; so Socrates is mortal\".", "b": "03"}, {"n": 194, "t": "Law of Non-Contradiction", "s": "The principle that a proposition and its negation cannot both be true in the same respect, which Aristotle called the firmest of principles.", "b": "03"}, {"n": 195, "t": "Law of Excluded Middle", "s": "The principle that every proposition is either true or false, rejected in intuitionistic logic.", "b": "03"}, {"n": 196, "t": "Law of Identity", "s": "The principle that each thing is identical with itself, the third traditional law of thought.", "b": "03"}, {"n": 258, "t": "Fallacy", "s": "A common error in reasoning, such as the ad hominem, the straw man or begging the question.", "b": "03"}, {"n": 259, "t": "Begging the Question", "s": "The fallacy of assuming in the premises what the argument claims to prove.", "b": "03"}, {"n": 260, "t": "Ad Hominem", "s": "The fallacy of attacking a person rather than the argument that person offers.", "b": "03"}, {"n": 261, "t": "Reductio ad Absurdum", "s": "A form of argument that refutes a claim by deriving a contradiction or absurdity from it.", "b": "03"}, {"n": 262, "t": "Dialectic", "s": "A method of argument by question, answer and contradiction; Socrates, Hegel and Marx each gave it a distinct role.", "b": "03"}, {"n": 263, "t": "Hegelian Dialectic", "s": "Hegel's pattern of development in which a thesis generates its opposite and both are overcome in a higher synthesis.", "b": "03"}, {"n": 269, "t": "Logical Consequence", "s": "The relation between premises and what follows from them, understood by Tarski in terms of truth preservation across interpretations.", "b": "03"}, {"n": 270, "t": "Logical Form", "s": "The underlying structure of a sentence revealed by formalisation, central to Russell's and Frege's approaches.", "b": "03"}, {"n": 271, "t": "Logical Pluralism", "s": "The view that more than one logic can be correct, depending on the purposes or notion of consequence at stake.", "b": "03"}]}, {"name": "Formal Systems", "children": [{"n": 197, "t": "Propositional Logic", "s": "The logic of sentences combined by connectives such as \"and\", \"or\", \"not\" and \"if\", independent of their internal structure.", "b": "03"}, {"n": 198, "t": "Predicate Logic", "s": "First-order logic, which adds quantifiers and predicates and can express general claims about objects.", "b": "03"}, {"n": 199, "t": "Quantifiers", "s": "Expressions such as \"all\" and \"some\" that state how many things satisfy a condition, formalised by Frege.", "b": "03"}, {"n": 200, "t": "Material Implication", "s": "The truth-functional \"if... then\" of classical logic, true whenever the antecedent is false, which gives rise to its paradoxes.", "b": "03"}, {"n": 201, "t": "Paradoxes of Material Implication", "s": "The oddities that a false statement implies anything and a true one is implied by anything, which motivate relevance logic.", "b": "03"}, {"n": 211, "t": "Free Logic", "s": "Logic that allows terms that do not refer, avoiding commitments to the existence of what names denote.", "b": "03"}, {"n": 212, "t": "Second-Order Logic", "s": "Logic that quantifies over properties and relations as well as individuals, more expressive but lacking a complete proof system.", "b": "03"}, {"n": 213, "t": "Completeness Theorem", "s": "Gödel's 1929 result that every valid sentence of first-order logic can be proved.", "b": "03"}, {"n": 220, "t": "Proof Theory", "s": "The study of formal proofs and what they establish, associated with Hilbert and Gentzen.", "b": "03"}, {"n": 221, "t": "Model Theory", "s": "The study of the relation between formal languages and the structures that satisfy them.", "b": "03"}, {"n": 222, "t": "Tarski's Semantic Conception of Truth", "s": "Tarski's definition of truth for formal languages, with the schema that \"snow is white\" is true if and only if snow is white.", "b": "03"}, {"n": 264, "t": "Conditionals", "s": "Sentences of the form \"if A then B\", whose logic and truth conditions are disputed among material, strict and probabilistic accounts.", "b": "03"}]}, {"name": "Non-Classical and Modal Logics", "children": [{"n": 202, "t": "Modal Logic", "s": "The logic of necessity and possibility, given its modern form by C. I. Lewis and Kripke's possible-worlds semantics.", "b": "03"}, {"n": 203, "t": "Possible-Worlds Semantics", "s": "Kripke's account of modal truth, on which necessity is truth in all accessible worlds.", "b": "03"}, {"n": 204, "t": "Intuitionistic Logic", "s": "Brouwer's constructive logic, which rejects excluded middle and requires that existence claims be backed by a construction.", "b": "03"}, {"n": 206, "t": "Relevance Logic", "s": "A family of logics requiring the premises of a valid argument to be relevant to its conclusion.", "b": "03"}, {"n": 207, "t": "Paraconsistent Logic", "s": "Logics that tolerate contradictions without collapsing into triviality, so that not everything follows from a contradiction.", "b": "03"}, {"n": 208, "t": "Dialetheism", "s": "Graham Priest's view that some contradictions are true, motivated by the semantic paradoxes.", "b": "03"}, {"n": 209, "t": "Many-Valued Logic", "s": "Logics, beginning with Łukasiewicz, that allow truth values beyond true and false.", "b": "03"}, {"n": 210, "t": "Fuzzy Logic", "s": "A many-valued approach in which truth comes in degrees, applied to vagueness and to engineering.", "b": "03"}, {"n": 265, "t": "Counterfactual Logic", "s": "The logic of \"if it had been the case that A, it would have been B\", analysed with similarity among possible worlds.", "b": "03"}, {"n": 266, "t": "Deontic Logic", "s": "The logic of obligation and permission, which formalises what ought to be the case.", "b": "03"}, {"n": 267, "t": "Epistemic Logic", "s": "The logic of knowledge and belief, which formalises principles such as the closure of knowledge.", "b": "03"}, {"n": 268, "t": "Temporal Logic", "s": "The logic of reasoning about time, developed by Arthur Prior with operators for past and future.", "b": "03"}]}, {"name": "Limits and Computation", "children": [{"n": 214, "t": "Incompleteness Theorems", "s": "Gödel's 1931 results that any consistent, sufficiently strong formal system contains true statements it cannot prove and cannot prove its own consistency.", "b": "03"}, {"n": 215, "t": "Decidability", "s": "Whether there is an algorithm that settles for every input whether a statement is a theorem; Church and Turing showed first-order logic is undecidable.", "b": "03"}, {"n": 216, "t": "Halting Problem", "s": "Turing's proof that no general algorithm can decide whether an arbitrary program halts.", "b": "03"}, {"n": 217, "t": "Church-Turing Thesis", "s": "The claim that whatever is effectively computable is computable by a Turing machine.", "b": "03"}, {"n": 218, "t": "Computability", "s": "The study of which functions can be calculated by mechanical procedures, central to logic and the philosophy of mind.", "b": "03"}, {"n": 219, "t": "Turing Machine", "s": "Turing's abstract model of computation, a tape and a head following simple rules, which defines what is computable.", "b": "03"}, {"n": 237, "t": "Hilbert's Program", "s": "Hilbert's project of founding mathematics on finitary consistency proofs, undermined by Gödel's second theorem.", "b": "03"}]}, {"name": "Paradoxes", "children": [{"n": 223, "t": "Liar Paradox", "s": "The sentence \"this sentence is false\", which is true only if false, and which drives research into truth and self-reference.", "b": "03"}, {"n": 224, "t": "Russell's Paradox", "s": "Russell's 1901 discovery that the set of all sets not members of themselves leads to contradiction, undermining naive set theory.", "b": "03"}, {"n": 225, "t": "Sorites Paradox", "s": "The paradox of the heap: if removing one grain never turns a heap into a non-heap, then a single grain is a heap.", "b": "03"}, {"n": 226, "t": "Epistemicism", "s": "The view that vague predicates have sharp boundaries that we cannot know, defended by Williamson.", "b": "03"}, {"n": 227, "t": "Supervaluationism", "s": "An approach to vagueness on which a sentence is true if true on every acceptable way of sharpening its terms.", "b": "03"}, {"n": 228, "t": "Paradoxes of Zeno", "s": "Arguments, including Achilles and the Tortoise, that motion and plurality are impossible, which prompted work on infinity and limits.", "b": "03"}, {"n": 244, "t": "Frege's Puzzle", "s": "The problem of how \"a = b\" can be informative though a and b name the same thing, which led Frege to the distinction of sense and reference.", "b": "03"}, {"n": 274, "t": "Theory of Types", "s": "Russell's hierarchy of entities designed to block paradoxes by forbidding self-referential sets.", "b": "03"}]}, {"name": "Sets and Infinity", "children": [{"n": 229, "t": "Infinity", "s": "The notion of the unbounded; philosophers distinguish potential from actual infinity, and Cantor made the latter mathematically respectable.", "b": "03"}, {"n": 230, "t": "Actual and Potential Infinity", "s": "Aristotle's distinction between a process that can go on forever and a completed infinite totality.", "b": "03"}, {"n": 231, "t": "Set Theory", "s": "The mathematical theory of collections, which Cantor founded and which serves as a foundation for much of mathematics.", "b": "03"}, {"n": 232, "t": "Cantor's Theorem", "s": "The proof that no set can be matched one-to-one with its power set, which yields different sizes of infinity.", "b": "03"}, {"n": 233, "t": "Continuum Hypothesis", "s": "Cantor's conjecture that there is no infinity between the integers and the reals, shown independent of standard set theory.", "b": "03"}, {"n": 234, "t": "Axiom of Choice", "s": "The principle that one can pick an element from each of a collection of non-empty sets, controversial for its non-constructive consequences.", "b": "03"}, {"n": 243, "t": "Number", "s": "The nature of numbers, treated by Frege as logical objects, by Dedekind as structures, and by Kant as given in intuition.", "b": "03"}, {"n": 245, "t": "Peano Axioms", "s": "A short set of axioms for the natural numbers, including induction, that characterise arithmetic.", "b": "03"}, {"n": 246, "t": "Mathematical Induction", "s": "A proof technique showing that a property holds for all natural numbers if it holds for zero and passes from each number to the next.", "b": "03"}, {"n": 247, "t": "Axioms", "s": "Basic statements taken as starting points of a theory, whether as self-evident truths or as stipulations.", "b": "03"}, {"n": 248, "t": "Geometry and Non-Euclidean Geometry", "s": "The discovery of consistent geometries denying the parallel postulate, which forced a rethinking of whether space is Euclidean.", "b": "03"}, {"n": 275, "t": "Category Theory", "s": "A branch of mathematics that studies structures and the mappings between them, proposed by some as an alternative foundation to set theory.", "b": "03"}]}, {"name": "Philosophies of Mathematics", "children": [{"n": 205, "t": "Constructivism", "s": "The view that mathematical objects exist only if they can be constructed, with truth tied to proof.", "b": "03"}, {"n": 235, "t": "Logicism", "s": "The view of Frege and Russell that mathematics is reducible to logic.", "b": "03"}, {"n": 236, "t": "Formalism", "s": "Hilbert's view that mathematics is the manipulation of symbols according to rules, with its meaning found in consistency.", "b": "03"}, {"n": 238, "t": "Intuitionism", "s": "Brouwer's philosophy of mathematics as mental construction, with truth requiring proof rather than correspondence.", "b": "03"}, {"n": 239, "t": "Mathematical Platonism", "s": "The view that mathematical objects are real, abstract and mind-independent, and that we discover rather than invent mathematics.", "b": "03"}, {"n": 240, "t": "Structuralism in Mathematics", "s": "The view that mathematics studies structures and positions within them rather than objects with intrinsic natures.", "b": "03"}, {"n": 241, "t": "Benacerraf's Dilemma", "s": "The tension between a plausible semantics for mathematics, which requires abstract objects, and a plausible epistemology, which requires causal contact.", "b": "03"}, {"n": 242, "t": "Indispensability Argument", "s": "Quine and Putnam's argument that we should believe in mathematical objects because science cannot do without them.", "b": "03"}, {"n": 272, "t": "Logical Positivism", "s": "The Vienna Circle's programme of using logic and empirical verification to dissolve metaphysical questions.", "b": "03"}, {"n": 273, "t": "Principia Mathematica", "s": "Whitehead and Russell's attempt to derive mathematics from logic using a theory of types.", "b": "03"}]}, {"name": "Probability and Decision", "children": [{"n": 249, "t": "Probability", "s": "The study of chance and degrees of belief, whose interpretations include frequency, propensity and subjective credence.", "b": "03"}, {"n": 250, "t": "Subjective Probability", "s": "The view that probabilities are degrees of belief constrained only by coherence, defended by Ramsey and de Finetti.", "b": "03"}, {"n": 251, "t": "Dutch Book Argument", "s": "The argument that credences violating probability axioms make an agent open to a sure loss in betting.", "b": "03"}, {"n": 252, "t": "Decision Theory", "s": "The theory of rational choice under uncertainty, centred on maximising expected utility.", "b": "03"}, {"n": 253, "t": "Newcomb's Problem", "s": "A decision puzzle that pits expected-utility reasoning against dominance reasoning when a predictor knows your choice.", "b": "03"}, {"n": 254, "t": "Game Theory", "s": "The mathematical study of strategic interaction, which philosophers apply to ethics, convention and social contracts.", "b": "03"}, {"n": 255, "t": "Prisoner's Dilemma", "s": "A game in which individually rational choices produce a collectively worse outcome, used to model cooperation and the state of nature.", "b": "03"}, {"n": 256, "t": "Social Choice Theory", "s": "The study of how to aggregate individual preferences into collective decisions, with Arrow's theorem showing limits on fair procedures.", "b": "03"}, {"n": 257, "t": "Arrow's Impossibility Theorem", "s": "The result that no ranked voting system with several options can satisfy a set of basic fairness conditions.", "b": "03"}]}]}, {"name": "Language", "k": "04", "children": [{"name": "Reference and Names", "children": [{"n": 277, "t": "Sense and Reference", "s": "Frege's distinction between the object a term picks out and the mode of presentation by which it does so.", "b": "04"}, {"n": 278, "t": "Reference", "s": "The relation by which a word or phrase picks out an object, central to theories of names and descriptions.", "b": "04"}, {"n": 279, "t": "Proper Names", "s": "Terms like \"Aristotle\" that pick out individuals; descriptivists and causal theorists disagree about how they refer.", "b": "04"}, {"n": 280, "t": "Descriptivism", "s": "The view of Frege and Russell that a name refers by means of a description or cluster of descriptions the speaker associates with it.", "b": "04"}, {"n": 281, "t": "Causal Theory of Reference", "s": "Kripke's view that a name refers by a chain of communication leading back to an initial baptism, not by descriptions.", "b": "04"}, {"n": 282, "t": "Rigid Designation", "s": "Kripke's term for an expression that refers to the same object in every possible world where it exists.", "b": "04"}, {"n": 283, "t": "Theory of Descriptions", "s": "Russell's analysis of phrases like \"the present king of France\" as quantified claims rather than names, resolving puzzles about empty terms.", "b": "04"}, {"n": 284, "t": "Naming and Necessity", "s": "Kripke's 1972 lectures arguing that names are rigid, that identity statements can be necessary a posteriori, and that essences exist.", "b": "04"}, {"n": 285, "t": "Necessary A Posteriori", "s": "Truths like \"water is H2O\" that are necessary yet knowable only through experience.", "b": "04"}, {"n": 286, "t": "Contingent A Priori", "s": "Truths such as \"the standard metre is one metre long\", knowable without experience yet not necessary, as Kripke argued.", "b": "04"}, {"n": 287, "t": "Two-Dimensionalism", "s": "A framework that assigns expressions both a primary intension, tied to how we pick things out, and a secondary one, tied to what they pick out in worlds.", "b": "04"}, {"n": 288, "t": "Direct Reference Theory", "s": "The view that the meaning of a name or indexical is just its referent, defended by Kaplan and Salmon.", "b": "04"}, {"n": 289, "t": "Indexicals", "s": "Words like \"I\", \"here\" and \"now\" whose reference depends on context, analysed by Kaplan as having a stable character.", "b": "04"}, {"n": 290, "t": "Character and Content", "s": "Kaplan's distinction between the rule that fixes reference in context and the proposition expressed in a particular context.", "b": "04"}]}, {"name": "Theories of Meaning", "children": [{"n": 276, "t": "Meaning", "s": "What words and sentences convey; theories tie it to reference, ideas, use, truth conditions or verification.", "b": "04"}, {"n": 291, "t": "Propositions", "s": "The objects of belief and the bearers of truth, thought of as what sentences express across languages.", "b": "04"}, {"n": 292, "t": "Truth-Conditional Semantics", "s": "The view, from Davidson and Tarski, that to give a sentence's meaning is to state the conditions under which it is true.", "b": "04"}, {"n": 293, "t": "Compositionality", "s": "The principle that the meaning of a complex expression is determined by the meanings of its parts and how they are combined.", "b": "04"}, {"n": 294, "t": "Context Principle", "s": "Frege's maxim that words have meaning only in the context of a sentence.", "b": "04"}, {"n": 295, "t": "Ideational Theory of Meaning", "s": "Locke's view that words signify the ideas in the speaker's mind.", "b": "04"}, {"n": 296, "t": "Use Theory of Meaning", "s": "Wittgenstein's thesis that the meaning of a word is its use in the language.", "b": "04"}, {"n": 302, "t": "Picture Theory of Meaning", "s": "The Tractatus view that a proposition is a picture of a possible state of affairs, sharing its logical form with reality.", "b": "04"}, {"n": 303, "t": "Said and Shown", "s": "The Tractarian distinction between what can be stated and what can only be shown by the form of language.", "b": "04"}, {"n": 312, "t": "Semantic Externalism", "s": "The thesis, from Putnam and Burge, that meaning and content depend partly on the environment and not just on the head.", "b": "04"}, {"n": 313, "t": "Twin Earth", "s": "Putnam's thought experiment in which an identical-seeming liquid with a different chemistry shows that \"meaning ain't in the head\".", "b": "04"}, {"n": 325, "t": "Syntax and Semantics", "s": "The distinction between the formal rules that govern sentence structure and the meanings those structures carry.", "b": "04"}, {"n": 326, "t": "Metaphor", "s": "Figurative speech in which one thing is described in terms of another, raising the question of whether it has a distinctive meaning.", "b": "04"}, {"n": 327, "t": "Ambiguity", "s": "The presence of more than one meaning in an expression, which logical analysis seeks to disentangle.", "b": "04"}]}, {"name": "Wittgenstein and Usage", "children": [{"n": 297, "t": "Language Games", "s": "Wittgenstein's term for the activities in which words are embedded, stressing that meaning is rooted in shared practice.", "b": "04"}, {"n": 298, "t": "Private Language Argument", "s": "Wittgenstein's argument that a language whose words refer to a speaker's inner sensations alone, and that no one else can understand, is impossible.", "b": "04"}, {"n": 299, "t": "Rule-Following", "s": "Wittgenstein's puzzle about what makes a use of a word correct, which Kripke read as a skeptical paradox about meaning.", "b": "04"}, {"n": 300, "t": "Kripkenstein", "s": "Kripke's reading of Wittgenstein's rule-following considerations, claiming that no fact about me fixes what I mean by \"plus\".", "b": "04"}, {"n": 301, "t": "Family Resemblance", "s": "Wittgenstein's idea that concepts like \"game\" are unified by overlapping similarities, not by a common essence.", "b": "04"}, {"n": 304, "t": "Ordinary Language Philosophy", "s": "The Oxford approach of Austin and Ryle that philosophical problems arise from, and can be dissolved by attention to, everyday usage.", "b": "04"}, {"n": 320, "t": "Linguistic Turn", "s": "The twentieth-century shift in philosophy toward analysing language as the means of solving or dissolving philosophical problems.", "b": "04"}, {"n": 328, "t": "Analytic Philosophy", "s": "The tradition, from Frege, Russell and Moore, that prizes clarity, logical analysis and close argument.", "b": "04"}]}, {"name": "Speech and Pragmatics", "children": [{"n": 305, "t": "Speech Acts", "s": "Austin's and Searle's idea that to say something is to do something, such as promising, warning or asserting.", "b": "04"}, {"n": 306, "t": "Performative Utterance", "s": "A statement like \"I promise\" that performs an action by being uttered, rather than describing it.", "b": "04"}, {"n": 307, "t": "Illocutionary Force", "s": "The kind of act, such as asking, ordering or asserting, performed in saying something.", "b": "04"}, {"n": 308, "t": "Implicature", "s": "Grice's term for what a speaker suggests without saying, governed by shared conversational maxims.", "b": "04"}, {"n": 309, "t": "Cooperative Principle", "s": "Grice's idea that conversation is governed by norms of quantity, quality, relation and manner.", "b": "04"}, {"n": 310, "t": "Pragmatics", "s": "The study of how context contributes to meaning beyond the literal content of sentences.", "b": "04"}, {"n": 311, "t": "Presupposition", "s": "What a statement takes for granted, such as the existence of a king in \"the king is bald\", and whose failure leaves it neither true nor false, on Strawson's view.", "b": "04"}]}, {"name": "Interpretation and Translation", "children": [{"n": 314, "t": "Radical Translation", "s": "Quine's thought experiment about interpreting a wholly unknown language, used to argue that meaning is indeterminate.", "b": "04"}, {"n": 315, "t": "Indeterminacy of Translation", "s": "Quine's thesis that many incompatible translation manuals fit all the behavioural evidence equally well.", "b": "04"}, {"n": 316, "t": "Gavagai", "s": "Quine's example of a native word used when a rabbit is seen, which cannot be pinned to \"rabbit\" rather than \"undetached rabbit part\".", "b": "04"}, {"n": 317, "t": "Principle of Charity", "s": "Davidson's and Quine's maxim that interpretation should maximise the truth and rationality of the speaker's beliefs.", "b": "04"}, {"n": 318, "t": "Radical Interpretation", "s": "Davidson's extension of Quine's idea, in which a theory of truth for a speaker's language is built from evidence of what they hold true.", "b": "04"}, {"n": 340, "t": "Hermeneutic Circle", "s": "The idea that interpreting a whole requires understanding its parts, and understanding the parts requires some grasp of the whole.", "b": "04"}]}, {"name": "Language and Mind", "children": [{"n": 319, "t": "Natural Language and Formal Language", "s": "The contrast between languages that grew up spontaneously and artificial languages with explicit syntax and semantics, as in the ideal language tradition.", "b": "04"}, {"n": 321, "t": "Sapir-Whorf Hypothesis", "s": "The thesis that the language one speaks shapes or limits one's thought, in strong and weak versions.", "b": "04"}, {"n": 322, "t": "Universal Grammar", "s": "Chomsky's proposal of an innate faculty that underlies the grammars of all human languages.", "b": "04"}, {"n": 323, "t": "Poverty of the Stimulus", "s": "Chomsky's argument that children learn language from too little evidence to do so without innate structure.", "b": "04"}, {"n": 324, "t": "Innateness of Language", "s": "The thesis that humans are born with specifically linguistic knowledge, central to the rationalist side of cognitive science.", "b": "04"}]}, {"name": "Moral Language", "children": [{"n": 329, "t": "Emotivism", "s": "The view of Ayer and Stevenson that moral statements express attitudes and do not state facts.", "b": "04"}, {"n": 330, "t": "Expressivism", "s": "The wider view that certain statements, notably moral ones, express mental states other than belief.", "b": "04"}, {"n": 331, "t": "Prescriptivism", "s": "R. M. Hare's view that moral judgments are universalisable commands telling us what to do.", "b": "04"}]}, {"name": "Signs and Deconstruction", "children": [{"n": 332, "t": "Speech and Writing", "s": "Derrida's critique of the tradition's privileging of speech as present meaning over writing as a derivative sign.", "b": "04"}, {"n": 333, "t": "Différance", "s": "Derrida's coinage for the play of difference and deferral that makes meaning possible and never fully stable.", "b": "04"}, {"n": 334, "t": "Deconstruction", "s": "Derrida's mode of reading that exposes the tensions and hierarchies on which texts depend, so that their meaning is unstable.", "b": "04"}, {"n": 335, "t": "Structuralism", "s": "The approach, from Saussure and Lévi-Strauss, of explaining phenomena by their position in systems of relations.", "b": "04"}, {"n": 336, "t": "Signifier and Signified", "s": "Saussure's two sides of the linguistic sign: the sound-image and the concept it evokes, linked arbitrarily.", "b": "04"}, {"n": 337, "t": "Semiotics", "s": "The general study of signs and their meaning, developed by Peirce and Saussure.", "b": "04"}, {"n": 338, "t": "Peirce's Triad of Signs", "s": "Peirce's classification of signs as icons, indices and symbols by their relation to what they stand for.", "b": "04"}, {"n": 339, "t": "Discourse", "s": "Structured ways of speaking that shape what can be said and known, a central concept for Foucault.", "b": "04"}]}]}, {"name": "Mind", "k": "05", "children": [{"name": "Mind and Body", "children": [{"n": 341, "t": "Mind-Body Problem", "s": "The question of how mental states relate to the physical body and brain, central to philosophy since Descartes.", "b": "05"}, {"n": 342, "t": "Substance Dualism", "s": "Descartes' view that mind and body are two distinct kinds of substance, one thinking and unextended, the other extended and unthinking.", "b": "05"}, {"n": 343, "t": "Property Dualism", "s": "The view that there is one kind of substance, but mental properties are not reducible to physical ones.", "b": "05"}, {"n": 344, "t": "Interaction Problem", "s": "The difficulty of explaining how an immaterial mind could causally affect a material body, pressed by Princess Elisabeth against Descartes.", "b": "05"}, {"n": 345, "t": "Epiphenomenalism", "s": "The view that mental states are caused by physical processes but have no causal effect on them.", "b": "05"}, {"n": 346, "t": "Physicalism", "s": "The view that everything, including mental states, is physical or depends on the physical.", "b": "05"}, {"n": 347, "t": "Identity Theory", "s": "The view of Place and Smart that mental states are identical with brain states.", "b": "05"}, {"n": 348, "t": "Multiple Realizability", "s": "The idea, due to Putnam, that the same mental state can be realised in different physical systems, an objection to type identity.", "b": "05"}, {"n": 349, "t": "Functionalism", "s": "The view that mental states are defined by their causal roles in relation to inputs, outputs and other states, not by their material makeup.", "b": "05"}, {"n": 350, "t": "Behaviourism", "s": "The view that mental states are dispositions to behave, and that psychology should concern only observable behaviour.", "b": "05"}, {"n": 351, "t": "Eliminative Materialism", "s": "The view of the Churchlands that folk psychology is a false theory and that beliefs and desires will be replaced by neuroscience.", "b": "05"}, {"n": 352, "t": "Folk Psychology", "s": "Our everyday framework of explaining behaviour by beliefs and desires, whose scientific standing is disputed.", "b": "05"}, {"n": 353, "t": "Anomalous Monism", "s": "Davidson's view that each mental event is a physical event but that there are no strict psychophysical laws.", "b": "05"}]}, {"name": "Consciousness", "children": [{"n": 354, "t": "Consciousness", "s": "The having of subjective experience, the central puzzle of the philosophy of mind.", "b": "05"}, {"n": 355, "t": "Hard Problem of Consciousness", "s": "Chalmers's question of why physical processes give rise to subjective experience at all.", "b": "05"}, {"n": 356, "t": "Qualia", "s": "The intrinsic, subjectively experienced qualities of mental states, such as the redness of red.", "b": "05"}, {"n": 357, "t": "What Is It Like to Be a Bat", "s": "Nagel's argument that consciousness has an irreducibly subjective character that objective science cannot capture.", "b": "05"}, {"n": 358, "t": "Knowledge Argument", "s": "Jackson's story of Mary, a colour scientist who learns something new on seeing red for the first time, thought to refute physicalism.", "b": "05"}, {"n": 359, "t": "Explanatory Gap", "s": "Levine's term for the gap between physical explanations of the brain and an explanation of why there is experience.", "b": "05"}, {"n": 360, "t": "Philosophical Zombie", "s": "Chalmers's imagined being physically identical to us but lacking consciousness, used to argue against physicalism.", "b": "05"}, {"n": 361, "t": "Inverted Spectrum", "s": "The thought experiment of a person whose colour experiences are systematically swapped with ours without any behavioural difference.", "b": "05"}, {"n": 362, "t": "Panpsychism", "s": "The view that mind or experience is a fundamental feature of all matter.", "b": "05"}, {"n": 363, "t": "Mysterianism", "s": "McGinn's view that the mind-body problem is real but beyond the cognitive reach of human beings.", "b": "05"}, {"n": 367, "t": "Access and Phenomenal Consciousness", "s": "Block's distinction between information available for reasoning and action, and the raw experience itself.", "b": "05"}, {"n": 397, "t": "Unity of Consciousness", "s": "The fact that experiences are experienced together as belonging to a single subject.", "b": "05"}, {"n": 398, "t": "Binding Problem", "s": "The puzzle of how features processed in different brain areas are combined into a single unified experience.", "b": "05"}, {"n": 399, "t": "Split Brain", "s": "Cases, after severing of the corpus callosum, that suggest a single person may have divided consciousness.", "b": "05"}]}, {"name": "Theories of Consciousness", "children": [{"n": 364, "t": "Higher-Order Theories", "s": "Theories on which a mental state is conscious when one has a higher-order thought or perception of it.", "b": "05"}, {"n": 365, "t": "Global Workspace Theory", "s": "Baars's view that consciousness is the broadcasting of information to many cognitive systems at once.", "b": "05"}, {"n": 366, "t": "Integrated Information Theory", "s": "Tononi's view that consciousness corresponds to a system's integrated information, measured by phi.", "b": "05"}, {"n": 383, "t": "Predictive Processing", "s": "The theory that the brain continually generates predictions about its inputs and learns by reducing prediction error.", "b": "05"}, {"n": 395, "t": "Representationalism", "s": "The view that the phenomenal character of experience is exhausted by what it represents.", "b": "05"}, {"n": 396, "t": "Attention", "s": "The selective focus of mind on certain items, studied for its role in consciousness and perception.", "b": "05"}]}, {"name": "Intentionality and Content", "children": [{"n": 368, "t": "Intentionality", "s": "The \"aboutness\" of mental states, their directedness at objects or states of affairs, which Brentano called the mark of the mental.", "b": "05"}, {"n": 369, "t": "Brentano's Thesis", "s": "Brentano's claim that intentionality distinguishes the mental from the physical.", "b": "05"}, {"n": 370, "t": "Mental Representation", "s": "The idea that thought involves internal states that stand for things beyond themselves.", "b": "05"}, {"n": 371, "t": "Language of Thought", "s": "Fodor's hypothesis that thinking takes place in an inner symbolic system with syntax and compositional semantics.", "b": "05"}, {"n": 387, "t": "Mental Content", "s": "What a thought is about or says; narrow content is fixed by the head, broad content also by the environment.", "b": "05"}, {"n": 388, "t": "Propositional Attitudes", "s": "Mental states, such as belief and desire, that take a proposition as their object.", "b": "05"}, {"n": 389, "t": "Belief-Desire Psychology", "s": "The model on which actions are explained by what an agent wants and believes.", "b": "05"}]}, {"name": "Computation and AI", "children": [{"n": 372, "t": "Computational Theory of Mind", "s": "The view that mental processes are computations over mental representations.", "b": "05"}, {"n": 373, "t": "Chinese Room", "s": "Searle's thought experiment showing that symbol manipulation alone does not suffice for understanding.", "b": "05"}, {"n": 374, "t": "Strong and Weak AI", "s": "Searle's distinction between the claim that a suitably programmed computer has a mind and the claim that it merely models one.", "b": "05"}, {"n": 375, "t": "Turing Test", "s": "Turing's proposal that a machine that is indistinguishable from a human in conversation should count as thinking.", "b": "05"}, {"n": 376, "t": "Artificial Intelligence", "s": "The project of building machines that perform tasks requiring intelligence, which poses questions of understanding and moral status.", "b": "05"}, {"n": 377, "t": "Connectionism", "s": "The approach that models cognition with networks of simple interconnected units rather than explicit symbolic rules.", "b": "05"}, {"n": 378, "t": "Frame Problem", "s": "The difficulty of specifying which things change and which stay the same when an agent acts, a challenge for artificial intelligence.", "b": "05"}]}, {"name": "Situated Cognition", "children": [{"n": 379, "t": "Extended Mind", "s": "Clark and Chalmers's thesis that cognitive processes can extend into tools and the environment, such as a notebook serving as memory.", "b": "05"}, {"n": 380, "t": "Embodied Cognition", "s": "The view that cognition depends on the body and its interactions with the world, not just on the brain.", "b": "05"}, {"n": 381, "t": "Enactivism", "s": "The view that minds arise from the active engagement of organisms with their environments.", "b": "05"}, {"n": 382, "t": "4E Cognition", "s": "The umbrella view that cognition is embodied, embedded, enacted and extended.", "b": "05"}]}, {"name": "Mental Causation", "children": [{"n": 384, "t": "Mental Causation", "s": "The problem of how mental states can cause behaviour if the physical realm is causally closed.", "b": "05"}, {"n": 385, "t": "Causal Closure of the Physical", "s": "The principle that every physical event with a cause has a sufficient physical cause.", "b": "05"}, {"n": 386, "t": "Exclusion Argument", "s": "Kim's argument that mental causation is threatened by sufficient physical causes, leaving no work for the mental.", "b": "05"}]}, {"name": "Self and Others", "children": [{"n": 400, "t": "Self", "s": "The subject of experience; theories range from an enduring soul to a bundle of perceptions to a narrative construction.", "b": "05"}, {"n": 401, "t": "Bundle Theory of the Self", "s": "Hume's claim that the self is nothing but a bundle of perceptions in perpetual flux.", "b": "05"}, {"n": 402, "t": "No-Self", "s": "The Buddhist and Humean view that there is no unchanging self underlying experience.", "b": "05"}, {"n": 403, "t": "Narrative Self", "s": "The idea that selfhood is constituted by the stories we tell about our lives.", "b": "05"}, {"n": 404, "t": "Minimal Self", "s": "The pre-reflective sense of being the subject of experience, defended by phenomenologists and Gallagher and Zahavi.", "b": "05"}, {"n": 405, "t": "Other Minds", "s": "The problem of how we can know that others have minds, given that we perceive only their behaviour.", "b": "05"}, {"n": 406, "t": "Theory of Mind", "s": "The capacity to attribute mental states to others, studied through theory-theory and simulation accounts.", "b": "05"}, {"n": 407, "t": "Simulation Theory", "s": "The view that we understand others by simulating their mental states in ourselves.", "b": "05"}, {"n": 408, "t": "Animal Minds", "s": "Questions of whether and how animals think and feel, with consequences for ethics.", "b": "05"}]}, {"name": "Experience", "children": [{"n": 390, "t": "Emotions", "s": "Affective states such as fear and anger; accounts treat them as feelings, judgments, or embodied appraisals.", "b": "05"}, {"n": 391, "t": "Moods", "s": "Diffuse affective states without a specific object, such as anxiety or elation, studied in phenomenology.", "b": "05"}, {"n": 392, "t": "Imagination", "s": "The capacity to represent what is not present, important to thought, fiction and modal knowledge.", "b": "05"}, {"n": 393, "t": "Perception and Illusion", "s": "The study of how we see the world and how experience can mislead, raising questions about the nature of appearance.", "b": "05"}, {"n": 394, "t": "Disjunctivism", "s": "The view that veridical perception and hallucination are fundamentally different kinds of state, not a common experience.", "b": "05"}]}]}, {"name": "Ethics", "k": "06", "children": [{"name": "Virtue Ethics", "children": [{"n": 409, "t": "The Good", "s": "What is worth pursuing or valuing; Plato placed the Form of the Good at the summit of reality and ethics asks what makes things good.", "b": "06"}, {"n": 410, "t": "Virtue", "s": "A stable trait of character that enables excellent action, central to Aristotle's ethics.", "b": "06"}, {"n": 411, "t": "Virtue Ethics", "s": "The approach that makes character, not rules or consequences, the basis of morality.", "b": "06"}, {"n": 412, "t": "Eudaimonia", "s": "Aristotle's term for human flourishing, the final end of life, achieved through virtuous activity.", "b": "06"}, {"n": 413, "t": "Doctrine of the Mean", "s": "Aristotle's view that each virtue lies between an excess and a deficiency, such as courage between rashness and cowardice.", "b": "06"}, {"n": 414, "t": "Practical Wisdom", "s": "Aristotle's phronesis, the capacity to see what to do in particular situations, which unifies the virtues.", "b": "06"}, {"n": 415, "t": "Cardinal Virtues", "s": "Wisdom, courage, temperance and justice, the four hinge virtues of the classical tradition.", "b": "06"}, {"n": 416, "t": "Habituation", "s": "Aristotle's idea that virtues are acquired by practice, becoming second nature.", "b": "06"}, {"n": 417, "t": "Akrasia", "s": "Weakness of will, acting against one's better judgment, which Socrates denied was possible.", "b": "06"}, {"n": 418, "t": "Socratic Intellectualism", "s": "Socrates' view that virtue is knowledge and that no one does wrong knowingly.", "b": "06"}, {"n": 419, "t": "Unity of the Virtues", "s": "The thesis that the virtues are inseparable, so that one cannot truly have one without the others.", "b": "06"}, {"n": 514, "t": "Integrity", "s": "Williams's idea that morality must leave room for the projects and commitments that make a life one's own.", "b": "06"}]}, {"name": "Consequentialism", "children": [{"n": 420, "t": "Consequentialism", "s": "The view that the rightness of an act depends only on its outcomes.", "b": "06"}, {"n": 421, "t": "Utilitarianism", "s": "The view of Bentham and Mill that the right act maximises overall happiness or welfare.", "b": "06"}, {"n": 422, "t": "Principle of Utility", "s": "Bentham's principle that actions are right in proportion as they tend to promote happiness and wrong as they tend to produce its reverse.", "b": "06"}, {"n": 423, "t": "Hedonism", "s": "The view that pleasure is the only intrinsic good and pain the only intrinsic evil.", "b": "06"}, {"n": 424, "t": "Higher and Lower Pleasures", "s": "Mill's distinction holding that intellectual pleasures are intrinsically more valuable than bodily ones.", "b": "06"}, {"n": 425, "t": "Act and Rule Utilitarianism", "s": "The contrast between judging each act by its consequences and judging acts by rules whose general adoption would be best.", "b": "06"}, {"n": 426, "t": "Preference Utilitarianism", "s": "The view that what matters is the satisfaction of preferences, developed by Hare and Singer.", "b": "06"}, {"n": 427, "t": "Welfare and Well-Being", "s": "Theories of what makes a life go well, whether pleasure, desire satisfaction or objective goods.", "b": "06"}, {"n": 428, "t": "Experience Machine", "s": "Nozick's thought experiment designed to show that we value more than pleasurable experiences.", "b": "06"}, {"n": 429, "t": "Repugnant Conclusion", "s": "Parfit's result that total utilitarianism implies a vast population with lives barely worth living would be better than a smaller flourishing one.", "b": "06"}, {"n": 484, "t": "Effective Altruism", "s": "The movement and view that we should use evidence and reason to do as much good as possible.", "b": "06"}, {"n": 485, "t": "Duty of Beneficence", "s": "Singer's argument that affluent people must give to relieve suffering when they can do so at little cost.", "b": "06"}, {"n": 486, "t": "Drowning Child", "s": "Singer's analogy that failing to aid distant strangers is like refusing to save a child at small cost.", "b": "06"}, {"n": 513, "t": "Demandingness Objection", "s": "The complaint that consequentialism asks too much of agents.", "b": "06"}]}, {"name": "Kantian and Rule-Based Ethics", "children": [{"n": 430, "t": "Deontology", "s": "The view that some acts are right or wrong in themselves, regardless of their consequences.", "b": "06"}, {"n": 431, "t": "Categorical Imperative", "s": "Kant's supreme principle of morality, commanding that we act only on maxims we could wil
