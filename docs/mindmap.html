"}, {"n": 946, "t": "Kyoto School", "s": "The twentieth-century Japanese philosophers, including Nishida and Nishitani, who combined Zen with Western philosophy.", "b": "13"}, {"n": 947, "t": "Absolute Nothingness", "s": "Nishida's and Nishitani's idea of a groundless, unobjectifiable basis of reality that makes all things possible.", "b": "13"}, {"n": 948, "t": "Being-Time", "s": "Dogen's thesis that being and time are inseparable and that each moment is complete in itself.", "b": "13"}, {"n": 976, "t": "Ma", "s": "The Japanese notion of meaningful interval or negative space, central to aesthetics and thought.", "b": "13"}, {"n": 977, "t": "Bushido", "s": "The code of the samurai, emphasising loyalty, honour and self-discipline.", "b": "13"}]}, {"name": "Daoism and Cosmology", "children": [{"n": 949, "t": "Dao", "s": "The Way, the fundamental pattern of nature and conduct, in Daoism an ineffable source of all things and in Confucianism the right path of life.", "b": "13"}, {"n": 950, "t": "Wu Wei", "s": "Non-forcing action, the Daoist ideal of acting in harmony with the natural course of things.", "b": "13"}, {"n": 951, "t": "Yin and Yang", "s": "The pair of complementary, interdependent forces whose interplay is seen to generate change in Chinese cosmology.", "b": "13"}, {"n": 952, "t": "Qi", "s": "The vital energy or breath that animates the cosmos and the body in Chinese thought.", "b": "13"}, {"n": 953, "t": "Ziran", "s": "Spontaneity or naturalness, the self-so quality of the Dao and of things that follow it.", "b": "13"}, {"n": 954, "t": "Daodejing", "s": "The classic ascribed to Laozi, which teaches humility, simplicity and yielding in accord with the Dao.", "b": "13"}, {"n": 955, "t": "Butterfly Dream", "s": "Zhuangzi's story of dreaming he was a butterfly, which questions the line between dream and waking and between self and other.", "b": "13"}, {"n": 956, "t": "Free and Easy Wandering", "s": "Zhuangzi's ideal of spontaneous freedom that transcends conventional distinctions.", "b": "13"}, {"n": 973, "t": "Five Phases", "s": "The Chinese system of wood, fire, earth, metal and water as interacting processes of change.", "b": "13"}, {"n": 974, "t": "Harmony", "s": "In Chinese thought, the ideal of diverse elements cooperating without being made the same.", "b": "13"}]}, {"name": "Confucian Thought", "children": [{"n": 957, "t": "Confucianism", "s": "The tradition of Confucius that stresses moral cultivation, social roles, ritual and benevolent government.", "b": "13"}, {"n": 958, "t": "Ren", "s": "The Confucian virtue of humaneness or benevolence, the root of ethical life.", "b": "13"}, {"n": 959, "t": "Li", "s": "Ritual propriety, the forms of conduct through which Confucians cultivate character and social harmony.", "b": "13"}, {"n": 960, "t": "Yi", "s": "Righteousness, the Confucian sense of doing what is appropriate in each situation.", "b": "13"}, {"n": 961, "t": "Filial Piety", "s": "The Confucian virtue of respect and care for parents and ancestors, the root of other virtues.", "b": "13"}, {"n": 962, "t": "Junzi", "s": "The exemplary person of Confucian ethics, who cultivates virtue and leads by example.", "b": "13"}, {"n": 963, "t": "Rectification of Names", "s": "Confucius's thesis that social order requires words to match the roles and realities they name.", "b": "13"}, {"n": 964, "t": "Mandate of Heaven", "s": "The Chinese doctrine that rulers hold power by Heaven's approval, which is lost through misrule.", "b": "13"}, {"n": 965, "t": "Mencius on Human Nature", "s": "Mencius's view that human nature is good, with moral sprouts that must be nurtured.", "b": "13"}, {"n": 966, "t": "Xunzi on Human Nature", "s": "Xunzi's view that human nature is bad and must be reshaped by ritual and education.", "b": "13"}, {"n": 970, "t": "Neo-Confucianism", "s": "The Song and Ming revival of Confucianism that integrated metaphysics from Buddhism and Daoism.", "b": "13"}, {"n": 971, "t": "Principle and Qi", "s": "Zhu Xi's pairing of li, the patterning principle, with qi, the material energy that realises it.", "b": "13"}, {"n": 972, "t": "Unity of Knowledge and Action", "s": "Wang Yangming's thesis that true knowledge of the good is inseparable from acting on it.", "b": "13"}, {"n": 975, "t": "Tianxia", "s": "\"All under heaven\", the Chinese idea of a world order that is moral and universal, not merely political.", "b": "13"}]}, {"name": "Other Chinese Schools", "children": [{"n": 967, "t": "Impartial Care", "s": "The Mohist doctrine that we should care for all people equally, as an alternative to Confucian graded love.", "b": "13"}, {"n": 968, "t": "Legalism", "s": "The school of Han Feizi that holds that order is maintained by strict law, punishment and the ruler's control.", "b": "13"}, {"n": 969, "t": "School of Names", "s": "The Chinese logicians, including Gongsun Long, who analysed language, paradox and the relation between names and things.", "b": "13"}]}, {"name": "Islamic Philosophy", "children": [{"n": 978, "t": "Falsafa", "s": "The tradition of Islamic philosophy that took up and developed Greek thought in Arabic.", "b": "13"}, {"n": 979, "t": "Floating Man", "s": "Avicenna's thought experiment of a suspended man who is aware of himself without sensing his body, suggesting the soul's independence.", "b": "13"}, {"n": 980, "t": "Necessary Existent", "s": "Avicenna's argument that a being whose essence entails its existence must ground all contingent things.", "b": "13"}, {"n": 981, "t": "Unity of the Intellect", "s": "Averroes's disputed doctrine that the active intellect is one for all humanity.", "b": "13"}, {"n": 982, "t": "Incoherence of the Philosophers", "s": "Al-Ghazali's attack on the Aristotelian philosophers, which targeted their claims on causation and the eternity of the world.", "b": "13"}, {"n": 983, "t": "Kalam", "s": "The Islamic tradition of rational theology that defends doctrine by argument.", "b": "13"}, {"n": 984, "t": "Mutazila", "s": "The rationalist school of Islamic theology holding that reason can know good and evil and that God is just.", "b": "13"}, {"n": 985, "t": "Sufism", "s": "The mystical dimension of Islam that seeks direct experience of God through love and discipline.", "b": "13"}, {"n": 986, "t": "Fana", "s": "The Sufi annihilation of the self in God.", "b": "13"}, {"n": 987, "t": "Illuminationism", "s": "Suhrawardi's philosophy in which reality is a hierarchy of light, known by direct presence as well as by reasoning.", "b": "13"}, {"n": 988, "t": "Primacy of Existence", "s": "Mulla Sadra's claim that existence, not essence, is fundamental and that being admits of degrees and motion.", "b": "13"}, {"n": 989, "t": "Virtuous City", "s": "Al-Farabi's vision of a state ruled by a philosopher-prophet, modelled on Plato.", "b": "13"}, {"n": 990, "t": "Asabiyyah", "s": "Ibn Khaldun's concept of group solidarity as the driving force in the rise and fall of dynasties.", "b": "13"}]}, {"name": "Jewish Thought", "children": [{"n": 991, "t": "I and Thou", "s": "Buber's distinction between the I-It relation of use and the I-Thou relation of mutual presence.", "b": "13"}, {"n": 992, "t": "Kabbalah", "s": "The Jewish mystical tradition that interprets the divine as emanating through a structure of ten spheres.", "b": "13"}]}, {"name": "Africa and the Americas", "children": [{"n": 993, "t": "Ubuntu", "s": "The southern African idea that a person is a person through other persons, grounding an ethics of community.", "b": "13"}, {"n": 994, "t": "Akan Concept of Person", "s": "The Akan view of a person as a composite of elements, with an emphasis on community and character.", "b": "13"}, {"n": 995, "t": "Sage Philosophy", "s": "The study by Odera Oruka of the reflective thought of traditional African sages.", "b": "13"}, {"n": 996, "t": "Négritude", "s": "The movement of Césaire and Senghor that affirmed black identity and culture against colonial denigration.", "b": "13"}, {"n": 997, "t": "Ethnophilosophy", "s": "The study of philosophical thought embodied in the shared beliefs and practices of African peoples, and the critique of it.", "b": "13"}, {"n": 998, "t": "Philosophy of Liberation", "s": "Dussel's and others' Latin American philosophy that starts from the standpoint of the oppressed.", "b": "13"}, {"n": 999, "t": "Buen Vivir", "s": "The Andean ideal of living well in harmony with community and nature.", "b": "13"}, {"n": 1000, "t": "Indigenous Relationality", "s": "The view found across many Indigenous traditions that persons, land and other beings are bound in reciprocal relationships.", "b": "13"}]}]}]};
