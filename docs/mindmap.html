l as universal laws.", "b": "06"}, {"n": 432, "t": "Hypothetical Imperative", "s": "A command of reason that tells us what to do given a goal we already have, in contrast to a categorical one.", "b": "06"}, {"n": 433, "t": "Universal Law Formula", "s": "The first version of Kant's imperative, which tests maxims by whether they can be universalised without contradiction.", "b": "06"}, {"n": 434, "t": "Humanity Formula", "s": "Kant's imperative to treat humanity, in oneself and others, always as an end and never merely as a means.", "b": "06"}, {"n": 435, "t": "Good Will", "s": "Kant's claim that the only thing good without qualification is a will that acts from duty.", "b": "06"}, {"n": 436, "t": "Duty", "s": "What morality requires of us; Kant held that actions have moral worth only when done from respect for duty.", "b": "06"}, {"n": 437, "t": "Autonomy", "s": "Self-governance; for Kant, the will's giving itself the moral law.", "b": "06"}, {"n": 438, "t": "Dignity", "s": "The unconditional worth of persons, which Kant opposed to price.", "b": "06"}, {"n": 439, "t": "Moral Law", "s": "The principle of morality that binds all rational beings, for Kant given by reason.", "b": "06"}, {"n": 440, "t": "Prima Facie Duties", "s": "W. D. Ross's idea of several duties, each binding unless outweighed by another in a given situation.", "b": "06"}, {"n": 467, "t": "Doctrine of Double Effect", "s": "The principle that a harm may be permissible as a foreseen side effect though impermissible as an intended means.", "b": "06"}, {"n": 468, "t": "Doing and Allowing", "s": "The distinction between causing harm and failing to prevent it, which many hold to differ morally.", "b": "06"}, {"n": 469, "t": "Trolley Problem", "s": "Foot's and Thomson's dilemmas about diverting a runaway trolley, probing the limits of consequentialism and deontology.", "b": "06"}, {"n": 470, "t": "Supererogation", "s": "Acts that are good but beyond the call of duty.", "b": "06"}]}, {"name": "Rights and Contracts", "children": [{"n": 441, "t": "Rights Theory", "s": "The view that moral standing is expressed in individual rights, which limit what may be done to persons.", "b": "06"}, {"n": 442, "t": "Natural Rights", "s": "Rights held to belong to people as such, independent of any government, as in Locke.", "b": "06"}, {"n": 443, "t": "Human Rights", "s": "Fundamental claims all persons hold by virtue of their humanity, enshrined in modern declarations.", "b": "06"}, {"n": 444, "t": "Contractualism", "s": "Scanlon's view that an act is wrong if it is forbidden by principles no one could reasonably reject.", "b": "06"}, {"n": 445, "t": "Social Contract Ethics", "s": "The view that morality consists in rules agreed upon by rational persons for mutual benefit.", "b": "06"}, {"n": 446, "t": "Ethics of Care", "s": "The view of Gilligan and Noddings that morality centres on relationships and attentiveness to particular others.", "b": "06"}, {"n": 447, "t": "Moral Particularism", "s": "The view that morality has no general principles and that moral reasons depend on the case.", "b": "06"}, {"n": 466, "t": "Natural Law", "s": "The view, from Aquinas, that moral principles are grounded in human nature and discoverable by reason.", "b": "06"}, {"n": 496, "t": "Golden Rule", "s": "The principle, found across traditions, to treat others as one would wish to be treated.", "b": "06"}]}, {"name": "Metaethics", "children": [{"n": 448, "t": "Moral Realism", "s": "The view that there are objective moral facts independent of what anyone thinks.", "b": "06"}, {"n": 449, "t": "Anti-Realism in Ethics", "s": "The family of views denying that there are mind-independent moral facts.", "b": "06"}, {"n": 450, "t": "Error Theory", "s": "Mackie's view that moral claims aim at objective truth but are all false because no such facts exist.", "b": "06"}, {"n": 451, "t": "Moral Relativism", "s": "The view that moral truth or justification is relative to a culture or individual.", "b": "06"}, {"n": 452, "t": "Cultural Relativism", "s": "The thesis that moral standards vary with culture and have no independent authority.", "b": "06"}, {"n": 453, "t": "Moral Nihilism", "s": "The view that nothing is morally right or wrong, or that moral claims have no truth.", "b": "06"}, {"n": 454, "t": "Naturalism in Ethics", "s": "The view that moral properties are natural properties that science can study.", "b": "06"}, {"n": 455, "t": "Non-Naturalism", "s": "Moore's view that goodness is a simple, indefinable, non-natural property.", "b": "06"}, {"n": 456, "t": "Naturalistic Fallacy", "s": "Moore's charge that it is an error to define \"good\" in terms of any natural property.", "b": "06"}, {"n": 457, "t": "Is-Ought Problem", "s": "Hume's observation that one cannot derive an ought from an is without a further evaluative premise.", "b": "06"}, {"n": 458, "t": "Open Question Argument", "s": "Moore's argument that \"is it good?\" stays open whatever natural property we name, so good is not identical to it.", "b": "06"}, {"n": 459, "t": "Moral Sentimentalism", "s": "The view of Hume and Smith that morality is grounded in sentiments such as sympathy.", "b": "06"}, {"n": 460, "t": "Sympathy", "s": "In Hume and Smith, the capacity to feel with others, which underlies moral approval.", "b": "06"}, {"n": 461, "t": "Impartial Spectator", "s": "Adam Smith's imagined fair observer, whose approval is the standard of conduct.", "b": "06"}, {"n": 462, "t": "Moral Intuitionism", "s": "The view that we know basic moral truths directly, without inference.", "b": "06"}, {"n": 463, "t": "Constructivism in Ethics", "s": "The view that moral truths are determined by the outcome of an idealised procedure of reasoning.", "b": "06"}, {"n": 464, "t": "Divine Command Theory", "s": "The view that morality consists in the commands of God.", "b": "06"}, {"n": 465, "t": "Euthyphro Dilemma", "s": "Plato's question whether the pious is loved by the gods because it is pious, or pious because it is loved.", "b": "06"}]}, {"name": "Moral Psychology", "children": [{"n": 471, "t": "Moral Luck", "s": "Williams's and Nagel's puzzle that we are judged by factors beyond our control.", "b": "06"}, {"n": 472, "t": "Moral Responsibility", "s": "The conditions under which a person is rightly praised or blamed for an act.", "b": "06"}, {"n": 473, "t": "Moral Psychology", "s": "The study of the mental capacities underlying morality, such as motivation, emotion and character.", "b": "06"}, {"n": 474, "t": "Moral Motivation", "s": "The question of what moves us to act morally, with internalists tying judgment to motivation.", "b": "06"}, {"n": 497, "t": "Altruism", "s": "Acting for the benefit of others, and the debate whether it exists or reduces to self-interest.", "b": "06"}, {"n": 498, "t": "Psychological Egoism", "s": "The claim that all human action is ultimately motivated by self-interest.", "b": "06"}, {"n": 499, "t": "Ethical Egoism", "s": "The normative view that each person ought to pursue their own interest.", "b": "06"}, {"n": 504, "t": "Reasons for Action", "s": "The considerations that count in favour of acting, central to debates about internalism and externalism.", "b": "06"}, {"n": 505, "t": "Internalism about Reasons", "s": "Williams's thesis that a reason must connect to the agent's existing motivations.", "b": "06"}, {"n": 506, "t": "Rationality and Morality", "s": "The question of whether it is always rational to act morally, posed by Plato and Sidgwick.", "b": "06"}, {"n": 507, "t": "Dualism of Practical Reason", "s": "Sidgwick's worry that reason supports both egoism and impartial benevolence, with no way to reconcile them.", "b": "06"}]}, {"name": "Value and Its Critics", "children": [{"n": 500, "t": "Master and Slave Morality", "s": "Nietzsche's contrast between a morality of strength and one born of resentment among the weak.", "b": "06"}, {"n": 501, "t": "Genealogy of Morals", "s": "Nietzsche's historical critique tracing moral concepts to the interests and psychology that produced them.", "b": "06"}, {"n": 502, "t": "Ressentiment", "s": "Nietzsche's term for the festering resentment of the powerless, which he saw as the root of slave morality.", "b": "06"}, {"n": 503, "t": "Will to Power", "s": "Nietzsche's idea that the basic drive of living things is to expand and exert their strength.", "b": "06"}, {"n": 508, "t": "Value Pluralism", "s": "Berlin's view that human values are many and sometimes irreconcilable, with no single scale for weighing them.", "b": "06"}, {"n": 509, "t": "Intrinsic and Instrumental Value", "s": "The distinction between what is valuable for its own sake and what is valuable as a means.", "b": "06"}, {"n": 510, "t": "Fitting Attitude Analysis", "s": "The view that to be valuable is to merit a favourable attitude.", "b": "06"}, {"n": 511, "t": "Thick and Thin Concepts", "s": "The contrast between richly descriptive evaluative terms like \"cruel\" and thin ones like \"good\".", "b": "06"}, {"n": 512, "t": "Dirty Hands", "s": "The problem that political and moral life can require doing wrong in order to do right.", "b": "06"}]}, {"name": "Applied Ethics", "children": [{"n": 475, "t": "Moral Status", "s": "Whether a being matters morally for its own sake, whether infants, animals or artificial beings.", "b": "06"}, {"n": 476, "t": "Moral Circle", "s": "The boundary of beings given moral consideration, which Singer argues has been widened over history.", "b": "06"}, {"n": 477, "t": "Animal Ethics", "s": "The study of our obligations to animals, including Singer's critique of speciesism and Regan's rights view.", "b": "06"}, {"n": 478, "t": "Speciesism", "s": "The charge that favouring one's own species without a morally relevant ground is a prejudice like racism.", "b": "06"}, {"n": 479, "t": "Environmental Ethics", "s": "The study of our obligations to nature, including deep ecology and the land ethic.", "b": "06"}, {"n": 480, "t": "Deep Ecology", "s": "Naess's view that nature has intrinsic value and that human interests do not override it.", "b": "06"}, {"n": 481, "t": "Land Ethic", "s": "Leopold's proposal that we treat the land community as a moral object.", "b": "06"}, {"n": 482, "t": "Future Generations", "s": "The question of what we owe to people not yet born, and how to weigh their interests.", "b": "06"}, {"n": 483, "t": "Population Ethics", "s": "The study of the value of different possible populations, with puzzles like the repugnant conclusion.", "b": "06"}, {"n": 487, "t": "Bioethics", "s": "The ethics of medicine and biology, including consent, life and death, and enhancement.", "b": "06"}, {"n": 488, "t": "Autonomy in Medicine", "s": "The principle that competent patients have the right to decide about their own treatment.", "b": "06"}, {"n": 489, "t": "Informed Consent", "s": "A person's voluntary agreement to a procedure on the basis of adequate understanding.", "b": "06"}, {"n": 490, "t": "Euthanasia", "s": "Deliberately ending life to relieve suffering, which raises issues of autonomy and the sanctity of life.", "b": "06"}, {"n": 491, "t": "Just War Theory", "s": "The tradition of criteria governing when war is justified and how it may be fought.", "b": "06"}, {"n": 492, "t": "Punishment", "s": "The infliction of a penalty for wrongdoing, justified by retribution, deterrence or reform.", "b": "06"}, {"n": 493, "t": "Retributivism", "s": "The view that wrongdoers deserve punishment in proportion to their wrongdoing.", "b": "06"}, {"n": 494, "t": "Deterrence", "s": "The justification of punishment by its effect in discouraging future offences.", "b": "06"}, {"n": 495, "t": "Machine Ethics", "s": "The study of how artificial agents should act and what moral limits apply to their design.", "b": "06"}]}]}, {"name": "Political and Social", "k": "07", "children": [{"name": "State and Authority", "children": [{"n": 516, "t": "Social Contract", "s": "The idea that political authority rests on an agreement among free persons, developed by Hobbes, Locke, Rousseau and Rawls.", "b": "07"}, {"n": 517, "t": "State of Nature", "s": "The imagined condition before government, which Hobbes saw as a war of all against all and Locke as governed by natural law.", "b": "07"}, {"n": 518, "t": "Leviathan", "s": "Hobbes's image of the sovereign state, created by contract so that people may escape the violence of the state of nature.", "b": "07"}, {"n": 519, "t": "General Will", "s": "Rousseau's notion of the will of the people directed at the common good, to which each citizen submits and so remains free.", "b": "07"}, {"n": 520, "t": "Sovereignty", "s": "Supreme authority within a territory; theorists ask who holds it and what limits it.", "b": "07"}, {"n": 521, "t": "Political Obligation", "s": "Whether and why citizens must obey the law of their state.", "b": "07"}, {"n": 522, "t": "Consent of the Governed", "s": "The principle that legitimate government rests on the agreement of those it rules.", "b": "07"}, {"n": 523, "t": "Legitimacy", "s": "The right of a political authority to rule, as distinct from its mere power.", "b": "07"}, {"n": 524, "t": "Authority", "s": "The right to command and to be obeyed, which anarchists such as Wolff deny that any state can have.", "b": "07"}, {"n": 525, "t": "Anarchism", "s": "The view that the state is unnecessary and illegitimate and that society can be organised without coercive government.", "b": "07"}, {"n": 583, "t": "Civil Disobedience", "s": "Open, non-violent breach of law on grounds of conscience, as defended by Thoreau, Gandhi and King.", "b": "07"}, {"n": 584, "t": "Revolution", "s": "A fundamental and rapid overthrow of a political order, whose justification is a perennial subject for political theory.", "b": "07"}, {"n": 601, "t": "Political Realism", "s": "The tradition, from Thucydides and Machiavelli, that stresses power and interest in the conduct of states.", "b": "07"}, {"n": 602, "t": "Virtù and Fortuna", "s": "Machiavelli's contrast between the skill of the prince and the force of chance in political success.", "b": "07"}]}, {"name": "Liberty and Liberalism", "children": [{"n": 526, "t": "Liberalism", "s": "The political tradition that prizes individual liberty, equality of rights and limited government.", "b": "07"}, {"n": 527, "t": "Classical Liberalism", "s": "The doctrine, from Locke and Smith, of limited government, free markets and individual rights.", "b": "07"}, {"n": 528, "t": "Negative and Positive Liberty", "s": "Berlin's contrast between freedom from interference and freedom as self-mastery or the capacity to act.", "b": "07"}, {"n": 529, "t": "Harm Principle", "s": "Mill's rule that power may be exercised over a person against their will only to prevent harm to others.", "b": "07"}, {"n": 530, "t": "Republicanism", "s": "The tradition that defines freedom as non-domination and stresses civic virtue and self-rule.", "b": "07"}, {"n": 531, "t": "Freedom as Non-Domination", "s": "Pettit's view that liberty is the absence of being subject to another's arbitrary will, even if they do not interfere.", "b": "07"}, {"n": 532, "t": "Conservatism", "s": "The tradition, from Burke, that values inherited institutions and distrusts rapid, abstract reform.", "b": "07"}, {"n": 533, "t": "Communitarianism", "s": "The view of Sandel, MacIntyre and Taylor that the self is formed by communities and that liberalism neglects this.", "b": "07"}, {"n": 534, "t": "Libertarianism", "s": "The view that individual liberty and property rights should be maximally protected and the state minimal.", "b": "07"}, {"n": 535, "t": "Minimal State", "s": "Nozick's thesis that only a state limited to protection against force, theft and fraud can be justified.", "b": "07"}, {"n": 536, "t": "Entitlement Theory", "s": "Nozick's view that a distribution is just if it arose through just acquisition and transfer, whatever its pattern.", "b": "07"}, {"n": 589, "t": "Property", "s": "The right to use and exclude others from things; Locke grounded it in labour, others in convention or social need.", "b": "07"}, {"n": 590, "t": "Labour Theory of Property", "s": "Locke's view that mixing one's labour with unowned things gives one a right to them.", "b": "07"}, {"n": 591, "t": "Tragedy of the Commons", "s": "Hardin's account of how shared resources are depleted when individuals pursue self-interest.", "b": "07"}, {"n": 592, "t": "Paternalism", "s": "Interfering with a person's liberty for their own good, a standing problem for liberal theory.", "b": "07"}, {"n": 593, "t": "Privacy", "s": "The claim to control access to oneself and information about oneself, challenged by modern technology.", "b": "07"}, {"n": 594, "t": "Freedom of Speech", "s": "The right to express opinions, whose limits are debated, as in Mill's defence of free discussion.", "b": "07"}, {"n": 595, "t": "Toleration", "s": "The practice of putting up with what one dislikes or disapproves of, defended by Locke and Mill.", "b": "07"}, {"n": 596, "t": "Secularism", "s": "The principle of separating religious authority from the state.", "b": "07"}]}, {"name": "Theories of Justice", "children": [{"n": 515, "t": "Justice", "s": "Giving each their due; the central concept of political philosophy, variously understood as order (Plato), fairness (Rawls) or entitlement (Nozick).", "b": "07"}, {"n": 537, "t": "Justice as Fairness", "s": "Rawls's theory that the principles of justice are those that free and equal persons would choose in a fair initial situation.", "b": "07"}, {"n": 538, "t": "Original Position", "s": "Rawls's hypothetical situation in which people choose principles of justice without knowing their own place in society.", "b": "07"}, {"n": 539, "t": "Veil of Ignorance", "s": "The device of the original position that hides one's class, talents and conception of the good so that choice is impartial.", "b": "07"}, {"n": 540, "t": "Difference Principle", "s": "Rawls's principle that inequalities are just only if they benefit the least advantaged.", "b": "07"}, {"n": 541, "t": "Overlapping Consensus", "s": "Rawls's idea of a political conception of justice endorsed by citizens who hold differing comprehensive doctrines.", "b": "07"}, {"n": 542, "t": "Public Reason", "s": "The idea that political decisions should be justified by reasons all reasonable citizens can accept.", "b": "07"}, {"n": 543, "t": "Egalitarianism", "s": "The view that equality should be a central aim of social arrangements.", "b": "07"}, {"n": 544, "t": "Luck Egalitarianism", "s": "The view that inequalities are unjust when they stem from luck and not from people's choices.", "b": "07"}, {"n": 545, "t": "Capabilities Approach", "s": "Sen's and Nussbaum's view that justice concerns what people are actually able to do and be.", "b": "07"}, {"n": 546, "t": "Distributive Justice", "s": "The question of how benefits and burdens of social life should be allocated.", "b": "07"}, {"n": 547, "t": "Desert", "s": "The idea that people deserve rewards or penalties in virtue of what they have done.", "b": "07"}, {"n": 548, "t": "Meritocracy", "s": "A system in which positions and rewards go to those with talent and effort, subject to critique for hidden inequalities.", "b": "07"}, {"n": 567, "t": "Cosmopolitanism", "s": "The view that all human beings belong to a single moral community and that national borders carry limited moral weight.", "b": "07"}, {"n": 568, "t": "Global Justice", "s": "The study of what justice requires across borders, concerning poverty, trade and migration.", "b": "07"}]}, {"name": "Marxism and Critical Theory", "children": [{"n": 549, "t": "Socialism", "s": "The family of views that favours collective or social ownership and control of the means of production.", "b": "07"}, {"n": 550, "t": "Marxism", "s": "The theory of Marx and Engels that history is driven by class conflict and that capitalism will be succeeded by communism.", "b": "07"}, {"n": 551, "t": "Historical Materialism", "s": "Marx's thesis that the economic base shapes the legal, political and ideological superstructure.", "b": "07"}, {"n": 552, "t": "Class Struggle", "s": "Marx's thesis that history is the history of conflict between classes defined by their relation to production.", "b": "07"}, {"n": 553, "t": "Alienation", "s": "Marx's analysis of how workers under capitalism are estranged from their labour, its product, others and themselves.", "b": "07"}, {"n": 554, "t": "Surplus Value", "s": "Marx's term for the unpaid labour appropriated by the capitalist, the source of profit.", "b": "07"}, {"n": 555, "t": "Commodity Fetishism", "s": "Marx's idea that social relations among people appear as relations among things.", "b": "07"}, {"n": 556, "t": "Ideology", "s": "A system of ideas that obscures and legitimises existing social power, a concept central to Marxist critique.", "b": "07"}, {"n": 557, "t": "Hegemony", "s": "Gramsci's term for domination secured through cultural leadership and consent rather than force alone.", "b": "07"}, {"n": 558, "t": "Critical Theory", "s": "The Frankfurt School's project of diagnosing and challenging domination through interdisciplinary social critique.", "b": "07"}, {"n": 559, "t": "Communicative Action", "s": "Habermas's theory that social coordination rests on reaching mutual understanding through reasoned discourse.", "b": "07"}, {"n": 560, "t": "Public Sphere", "s": "Habermas's term for the space where citizens discuss matters of common concern and form public opinion.", "b": "07"}]}, {"name": "Democracy and Constitution", "children": [{"n": 561, "t": "Deliberative Democracy", "s": "The view that democratic legitimacy comes from public reasoning among free and equal citizens.", "b": "07"}, {"n": 562, "t": "Democracy", "s": "Rule by the people; theorists debate its justification, its forms and its limits, from Athens to the present.", "b": "07"}, {"n": 563, "t": "Tyranny of the Majority", "s": "Tocqueville's and Mill's worry that democratic majorities can oppress minorities.", "b": "07"}, {"n": 564, "t": "Separation of Powers", "s": "Montesquieu's principle that dividing legislative, executive and judicial authority guards against tyranny.", "b": "07"}, {"n": 565, "t": "Rule of Law", "s": "The ideal that all are subject to law that is public, general and impartially applied.", "b": "07"}, {"n": 566, "t": "Constitutionalism", "s": "The view that government should be limited by a fundamental law.", "b": "07"}, {"n": 569, "t": "Nationalism", "s": "The view that the nation is the proper basis of political community, with loyalty and self-determination as key values.", "b": "07"}, {"n": 570, "t": "Multiculturalism", "s": "The view that cultural diversity should be recognised and accommodated by public institutions.", "b": "07"}, {"n": 571, "t": "Recognition", "s": "Hegel's, Taylor's and Honneth's idea that identity depends on being acknowledged by others and that misrecognition is a harm.", "b": "07"}]}, {"name": "Power, Gender and Race", "children": [{"n": 572, "t": "Feminism", "s": "The movement and theory concerned with the equality of women and the critique of gender hierarchy.", "b": "07"}, {"n": 573, "t": "Patriarchy", "s": "A social order in which men dominate, subject to analysis in feminist theory.", "b": "07"}, {"n": 574, "t": "Intersectionality", "s": "Crenshaw's term for how overlapping systems of oppression, such as race and gender, compound each other.", "b": "07"}, {"n": 575, "t": "Gender as Performance", "s": "Butler's thesis that gender is constituted by repeated acts and not a natural fact.", "b": "07"}, {"n": 576, "t": "Critical Race Theory", "s": "The analysis of how law and institutions embed racial hierarchy.", "b": "07"}, {"n": 577, "t": "Colonialism and Postcolonial Theory", "s": "The critique of imperial domination and its legacies, developed by Fanon, Said and Spivak.", "b": "07"}, {"n": 578, "t": "Orientalism", "s": "Said's analysis of how Western representations of the East served the cause of domination.", "b": "07"}, {"n": 579, "t": "Biopower", "s": "Foucault's term for forms of power that manage the life of populations.", "b": "07"}, {"n": 580, "t": "Panopticon", "s": "Bentham's design for a prison with constant surveillance, which Foucault used as a model of modern disciplinary power.", "b": "07"}, {"n": 581, "t": "Power/Knowledge", "s": "Foucault's claim that knowledge and power are intertwined, so that regimes of truth are also regimes of control.", "b": "07"}, {"n": 582, "t": "Social Construction", "s": "The thesis that categories such as gender and race are products of social practice, not natural facts.", "b": "07"}]}, {"name": "Philosophy of Law", "children": [{"n": 585, "t": "Legal Positivism", "s": "The view that the existence of law depends on social facts and not on its moral merit.", "b": "07"}, {"n": 586, "t": "Natural Law Theory of Law", "s": "The view that an unjust law is not truly law, or that law is bound up with morality.", "b": "07"}, {"n": 587, "t": "Hart's Rule of Recognition", "s": "Hart's idea of the social rule that identifies which norms count as valid law in a legal system.", "b": "07"}, {"n": 588, "t": "Law as Integrity", "s": "Dworkin's view that judges should interpret law as a coherent expression of moral principle.", "b": "07"}]}, {"name": "Modernity and Totalitarianism", "children": [{"n": 597, "t": "Iron Cage", "s": "Weber's metaphor for the way rationalised bureaucratic life constrains and disenchants modern individuals.", "b": "07"}, {"n": 598, "t": "Disenchantment", "s": "Weber's term for the loss of magic and ultimate meaning in modernity as rational calculation spreads.", "b": "07"}, {"n": 599, "t": "Anomie", "s": "Durkheim's term for a condition in which social norms break down and individuals lose moral guidance.", "b": "07"}, {"n": 600, "t": "Collective Representations", "s": "Durkheim's idea that shared beliefs and symbols are social facts that shape individual thought.", "b": "07"}, {"n": 603, "t": "End of History", "s": "Fukuyama's thesis, drawing on Hegel and Kojève, that liberal democracy represents the final form of government.", "b": "07"}, {"n": 604, "t": "Totalitarianism", "s": "Arendt's term for a novel form of rule that uses terror and ideology to dominate every part of life.", "b": "07"}, {"n": 605, "t": "Banality of Evil", "s": "Arendt's phrase for wrongdoing committed by ordinary people who do not think about what they are doing.", "b": "07"}, {"n": 606, "t": "Vita Activa", "s": "Arendt's division of the active life into labour, work and action, with action as the highest.", "b": "07"}]}]}, {"name": "Aesthetics", "k": "08", "children": [{"name": "Beauty and Taste", "children": [{"n": 607, "t": "Beauty", "s": "The quality of things that please when perceived or contemplated; philosophers disagree whether it is objective or subjective.", "b": "08"}, {"n": 608, "t": "Aesthetics", "s": "The philosophical study of beauty, art and aesthetic experience, named by Baumgarten in the eighteenth century.", "b": "08"}, {"n": 609, "t": "Aesthetic Experience", "s": "A distinctive kind of attention to an object for its own sake, marked by pleasure and absorption.", "b": "08"}, {"n": 610, "t": "Taste", "s": "The capacity to judge beauty; Hume sought a standard of taste in the verdicts of ideal critics.", "b": "08"}, {"n": 611, "t": "Standard of Taste", "s": "Hume's proposal that aesthetic value is revealed by the joint judgment of qualified critics.", "b": "08"}, {"n": 612, "t": "Judgment of Taste", "s": "Kant's claim that a judgment of beauty is subjective yet claims universal assent.", "b": "08"}, {"n": 613, "t": "Disinterestedness", "s": "The idea that aesthetic pleasure is free of desire for the object's use or possession, as in Kant and Schopenhauer.", "b": "08"}, {"n": 614, "t": "Purposiveness without Purpose", "s": "Kant's phrase for the formal fit of a beautiful object, which seems designed though it serves no end.", "b": "08"}, {"n": 615, "t": "Sublime", "s": "The experience of overwhelming greatness or power, such as a storm or mountain, which Burke and Kant contrasted with beauty.", "b": "08"}, {"n": 643, "t": "Aesthetic Education", "s": "Schiller's view that experience of beauty can cultivate freedom and moral character.", "b": "08"}, {"n": 644, "t": "Aesthetic Value", "s": "The goodness of a thing as an object of aesthetic regard, and the question of whether it can be separated from moral and cognitive value.", "b": "08"}, {"n": 650, "t": "Sensus Communis", "s": "The shared sense on which Kant based the demand that others agree with one's judgment of taste.", "b": "08"}]}, {"name": "Nature of Art", "children": [{"n": 616, "t": "Genius", "s": "Kant's term for the innate talent through which nature gives the rule to art.", "b": "08"}, {"n": 617, "t": "Mimesis", "s": "Imitation or representation; Plato distrusted it and Aristotle saw it as the basis of art.", "b": "08"}, {"n": 621, "t": "Expression Theory", "s": "The view of Tolstoy and Collingwood that art is the expression of emotion.", "b": "08"}, {"n": 622, "t": "Formalism in Art", "s": "The view that the value of an artwork lies in its form and not in its content or subject.", "b": "08"}, {"n": 623, "t": "Significant Form", "s": "Clive Bell's thesis that what makes something art is its arrangement of lines and colours.", "b": "08"}, {"n": 624, "t": "Institutional Theory of Art", "s": "Dickie's and Danto's view that something is art when the artworld confers that status on it.", "b": "08"}, {"n": 625, "t": "Artworld", "s": "Danto's term for the theory and institutions that make it possible to see something as art.", "b": "08"}, {"n": 626, "t": "Definition of Art", "s": "The question of whether art can be defined, with Weitz denying that it has necessary and sufficient conditions.", "b": "08"}, {"n": 627, "t": "Ready-Made", "s": "Duchamp's practice of presenting ordinary objects as art, which forced the question of what makes art.", "b": "08"}, {"n": 628, "t": "Authenticity and Forgery", "s": "The question of whether the origin of a work matters to its aesthetic value, when a perfect copy looks identical.", "b": "08"}, {"n": 636, "t": "Music", "s": "The art of sound; philosophers ask how it expresses emotion and what its meaning consists in.", "b": "08"}, {"n": 640, "t": "Kitsch", "s": "Sentimental, formulaic art that flatters its audience, which critics such as Greenberg and Kundera disdained.", "b": "08"}, {"n": 641, "t": "Aura", "s": "Benjamin's term for the unique presence of an original artwork, which mechanical reproduction erodes.", "b": "08"}, {"n": 642, "t": "Culture Industry", "s": "Adorno and Horkheimer's critique of mass-produced culture as a means of social control.", "b": "08"}]}, {"name": "Tragedy and Fiction", "children": [{"n": 618, "t": "Catharsis", "s": "Aristotle's term for the purging or clarifying of emotions such as pity and fear through tragedy.", "b": "08"}, {"n": 619, "t": "Tragedy", "s": "A dramatic form depicting suffering and downfall, whose appeal Aristotle, Hegel and Nietzsche each explained.", "b": "08"}, {"n": 620, "t": "Apollonian and Dionysian", "s": "Nietzsche's contrast between art of order and form and art of ecstasy and dissolution.", "b": "08"}, {"n": 632, "t": "Fiction", "s": "Representations of imagined events; philosophers ask how we can respond emotionally to what we know to be unreal.", "b": "08"}, {"n": 633, "t": "Paradox of Fiction", "s": "The puzzle of why we feel real emotions for characters we know do not exist.", "b": "08"}, {"n": 634, "t": "Paradox of Tragedy", "s": "The puzzle of why we take pleasure in works that depict painful events.", "b": "08"}, {"n": 635, "t": "Make-Believe", "s": "Walton's account of fiction as props in games of imagination.", "b": "08"}]}, {"name": "Interpretation and Value", "children": [{"n": 629, "t": "Intentional Fallacy", "s": "Wimsatt and Beardsley's claim that an author's intention is neither available nor desirable as a standard for judging a work.", "b": "08"}, {"n": 630, "t": "Death of the Author", "s": "Barthes's thesis that a text's meaning is made by readers and not fixed by its writer.", "b": "08"}, {"n": 631, "t": "Interpretation", "s": "The attempt to make sense of artworks and texts, with disputes over the role of authorial intention.", "b": "08"}, {"n": 645, "t": "Moralism and Autonomism", "s": "The debate over whether an artwork's moral qualities affect its aesthetic merit.", "b": "08"}, {"n": 646, "t": "Gaze", "s": "The way in which viewing is structured by power, as in the male gaze of feminist film theory.", "b": "08"}, {"n": 647, "t": "Postmodernism in Art", "s": "The rejection of grand narratives and the blurring of high and low, with play and pastiche.", "b": "08"}, {"n": 648, "t": "Simulacra", "s": "Baudrillard's term for copies without originals, in a culture saturated with signs and images.", "b": "08"}, {"n": 649, "t": "Hyperreality", "s": "Baudrillard's idea that models and images come to replace reality in advanced media culture.", "b": "08"}]}, {"name": "Nature and Everyday", "children": [{"n": 637, "t": "Aesthetics of Nature", "s": "The study of the appreciation of natural environments, in contrast with art.", "b": "08"}, {"n": 638, "t": "Environmental Aesthetics", "s": "The study of how we perceive and value built and natural surroundings.", "b": "08"}, {"n": 639, "t": "Everyday Aesthetics", "s": "The study of aesthetic qualities in ordinary life beyond the arts.", "b": "08"}]}, {"name": "Eastern Aesthetics", "children": [{"n": 651, "t": "Wabi-Sabi", "s": "The Japanese aesthetic that finds beauty in impermanence and imperfection.", "b": "08"}, {"n": 652, "t": "Mono no Aware", "s": "The Japanese sensitivity to the transience of things, a gentle sadness at their passing.", "b": "08"}, {"n": 653, "t": "Yūgen", "s": "The Japanese aesthetic of subtle, profound mystery suggested but not stated.", "b": "08"}, {"n": 654, "t": "Rasa", "s": "The Indian theory of aesthetic flavour, the emotional essence evoked in an audience by drama and poetry.", "b": "08"}]}]}, {"name": "Science", "k": "09", "children": [{"name": "Method and Demarcation", "children": [{"n": 655, "t": "Scientific Method", "s": "The set of practices by which science forms and tests theories; philosophers doubt whether any single method exists.", "b": "09"}, {"n": 656, "t": "Demarcation Problem", "s": "The question of what separates science from pseudoscience and metaphysics.", "b": "09"}, {"n": 657, "t": "Falsifiability", "s": "Popper's criterion that a theory is scientific only if observation could in principle refute it.", "b": "09"}, {"n": 658, "t": "Conjectures and Refutations", "s": "Popper's picture of science as bold hypotheses tested by attempts to disprove them.", "b": "09"}, {"n": 659, "t": "Hypothetico-Deductive Method", "s": "The method of deriving testable predictions from a hypothesis and checking them.", "b": "09"}, {"n": 692, "t": "Statistical Inference", "s": "Methods for drawing conclusions from data, with frequentist and Bayesian schools in dispute.", "b": "09"}, {"n": 713, "t": "Positivism", "s": "The view that genuine knowledge derives from observation and logic, associated with Comte and the Vienna Circle.", "b": "09"}, {"n": 714, "t": "Values in Science", "s": "The question of whether social and ethical values legitimately influence scientific reasoning.", "b": "09"}, {"n": 715, "t": "Ockham's Razor", "s": "The principle that one should not multiply entities beyond necessity, used as a guide to theory choice.", "b": "09"}, {"n": 716, "t": "Simplicity", "s": "A virtue of theories whose epistemic standing is debated: whether simpler theories are likelier to be true.", "b": "09"}]}, {"name": "Confirmation and Explanation", "children": [{"n": 660, "t": "Confirmation", "s": "The relation by which evidence supports a hypothesis, analysed in logical, probabilistic and holistic terms.", "b": "09"}, {"n": 661, "t": "Raven Paradox", "s": "Hempel's puzzle that a white shoe seems to confirm \"all ravens are black\".", "b": "09"}, {"n": 662, "t": "Grue Paradox", "s": "Goodman's new riddle of induction, showing that evidence fits unnatural predicates as well as natural ones.", "b": "09"}, {"n": 663, "t": "Inference to the Best Explanation", "s": "The principle that we should accept the hypothesis that best explains the evidence.", "b": "09"}, {"n": 664, "t": "Scientific Explanation", "s": "The question of what it is to explain a phenomenon, whether by laws, causes or unification.", "b": "09"}, {"n": 665, "t": "Covering Law Model", "s": "Hempel and Oppenheim's view that explanation is the deduction of a phenomenon from laws and conditions.", "b": "09"}, {"n": 666, "t": "Causal Explanation", "s": "The view that to explain an event is to cite its causes, which many take to be the heart of explanation.", "b": "09"}, {"n": 672, "t": "Underdetermination of Theory", "s": "The thesis that evidence cannot single out one theory among empirically equivalent rivals.", "b": "09"}, {"n": 673, "t": "Observable and Unobservable", "s": "The distinction between what can be directly detected and what cannot, central to realism debates.", "b": "09"}, {"n": 674, "t": "Theory-Ladenness of Observation", "s": "The thesis that observation is shaped by prior theory, which weakens any neutral foundation.", "b": "09"}]}, {"name": "Realism Debate", "children": [{"n": 667, "t": "Scientific Realism", "s": "The view that mature scientific theories are approximately true and that their unobservable entities exist.", "b": "09"}, {"n": 668, "t": "Instrumentalism", "s": "The view that scientific theories are tools for prediction and not literal descriptions of reality.", "b": "09"}, {"n": 669, "t": "Constructive Empiricism", "s": "Van Fraassen's view that science aims at empirical adequacy, not truth about unobservables.", "b": "09"}, {"n": 670, "t": "No-Miracles Argument", "s": "Putnam's argument that realism is the only view that does not make the success of science a miracle.", "b": "09"}, {"n": 671, "t": "Pessimistic Meta-Induction", "s": "The argument that since past successful theories turned out false, current ones probably will too.", "b": "09"}, {"n": 682, "t": "Scientific Progress", "s": "The question of whether and how science advances, by truth, problem-solving or empirical success.", "b": "09"}, {"n": 683, "t": "Verisimilitude", "s": "Popper's notion of closeness to the truth, an attempt to say how theories can be better without being true.", "b": "09"}]}, {"name": "Scientific Change", "children": [{"n": 675, "t": "Paradigm", "s": "Kuhn's term for the framework of assumptions, methods and exemplars that guides a scientific community.", "b": "09"}, {"n": 676, "t": "Normal Science", "s": "Kuhn's term for puzzle-solving work within an accepted paradigm.", "b": "09"}, {"n": 677, "t": "Scientific Revolution", "s": "Kuhn's account of episodes in which an old paradigm is replaced by an incompatible one.", "b": "09"}, {"n": 678, "t": "Incommensurability", "s": "Kuhn's and Feyerabend's thesis that rival paradigms lack a neutral standard of comparison.", "b": "09"}, {"n": 679, "t": "Research Programmes", "s": "Lakatos's view of science as competing series of theories sharing a hard core and protective belt.", "b": "09"}, {"n": 680, "t": "Epistemological Anarchism", "s": "Feyerabend's claim that no fixed method governs scientific progress, so \"anything goes\".", "b": "09"}, {"n": 681, "t": "Sociology of Scientific Knowledge", "s": "The approach that explains scientific beliefs by social factors, as in the Strong Programme.", "b": "09"}]}, {"name": "Laws, Models, Reduction", "children": [{"n": 684, "t": "Laws of Nature in Science", "s": "The role of general regularities in explanation and prediction, and the question of what makes them laws.", "b": "09"}, {"n": 685, "t": "Ceteris Paribus Laws", "s": "Laws that hold only when other things are equal, common in the special sciences.", "b": "09"}, {"n": 686, "t": "Reductionism in Science", "s": "The view that higher-level theories can be explained by more fundamental ones.", "b": "09"}, {"n": 687, "t": "Unity of Science", "s": "The positivist ideal of a single science with all the special sciences reduced to physics.", "b": "09"}, {"n": 688, "t": "Disunity of Science", "s": "The view that the sciences are a patchwork of methods and theories without a deep unity.", "b": "09"}, {"n": 689, "t": "Models", "s": "Idealised representations used in science, whose relation to reality raises questions about truth and understanding.", "b": "09"}, {"n": 690, "t": "Idealization", "s": "The deliberate simplification of a model, such as frictionless planes, that science uses to gain understanding.", "b": "09"}, {"n": 691, "t": "Thought Experiments in Science", "s": "Imagined scenarios, as in Galileo and Einstein, used to reason about nature without experiment.", "b": "09"}, {"n": 722, "t": "Laplace's Demon", "s": "The imagined intellect that could predict the future from complete knowledge of the present, an icon of determinism.", "b": "09"}]}, {"name": "Physics and Cosmos", "children": [{"n": 693, "t": "Philosophy of Physics", "s": "The study of the conceptual foundations of physical theories, including space, time and quantum mechanics.", "b": "09"}, {"n": 694, "t": "Measurement Problem", "s": "The puzzle in quantum mechanics of why a system in superposition yields a definite result on measurement.", "b": "09"}, {"n": 695, "t": "Interpretations of Quantum Mechanics", "s": "Rival accounts of what quantum theory says about reality, including Copenhagen, many-worlds and pilot-wave.", "b": "09"}, {"n": 696, "t": "Many-Worlds Interpretation", "s": "Everett's view that every quantum outcome occurs in a branching universe.", "b": "09"}, {"n": 697, "t": "Copenhagen Interpretation", "s": "Bohr and Heisenberg's view that quantum theory describes the results of measurement and not an underlying reality.", "b": "09"}, {"n": 698, "t": "Wave-Particle Duality", "s": "The finding that quantum entities show both wave and particle behaviour depending on how they are observed.", "b": "09"}, {"n": 699, "t": "Non-Locality", "s": "The feature of quantum entanglement in which distant systems show correlations that no local account can explain.", "b": "09"}, {"n": 717, "t": "Anthropic Principle", "s": "The idea that observations of the universe must be compatible with the existence of observers.", "b": "09"}, {"n": 718, "t": "Fine-Tuning", "s": "The observation that physical constants appear tuned for life, which is used in arguments for design or for multiple universes.", "b": "09"}, {"n": 719, "t": "Multiverse", "s": "The hypothesis that our universe is one of many, proposed to explain fine-tuning.", "b": "09"}, {"n": 720, "t": "Arrow of Time", "s": "The asymmetry between past and future, usually traced to the increase of entropy.", "b": "09"}, {"n": 721, "t": "Entropy", "s": "A measure of disorder whose tendency to increase underlies the direction of time.", "b": "09"}]}, {"name": "Biology", "children": [{"n": 700, "t": "Philosophy of Biology", "s": "The study of conceptual issues in evolution, genetics and ecology.", "b": "09"}, {"n": 701, "t": "Natural Selection", "s": "Darwin's mechanism of evolutionary change through differential survival and reproduction.", "b": "09"}, {"n": 702, "t": "Adaptationism", "s": "The view that traits are mainly to be explained as adaptations shaped by selection.", "b": "09"}, {"n": 703, "t": "Species Problem", "s": "The difficulty of defining what a species is and whether species are natural kinds or individuals.", "b": "09"}, {"n": 704, "t": "Function", "s": "The idea that parts of organisms have functions, analysed by selected effects or by causal role.", "b": "09"}, {"n": 705, "t": "Levels of Selection", "s": "The debate over whether selection acts on genes, organisms, groups or all of these.", "b": "09"}, {"n": 706, "t": "Reductionism in Biology", "s": "The view that biological phenomena can be explained by molecular and chemical processes.", "b": "09"}, {"n": 707, "t": "Vitalism", "s": "The discredited view that living things contain a non-physical vital force.", "b": "09"}]}, {"name": "Human Sciences", "children": [{"n": 708, "t": "Philosophy of Psychology", "s": "The study of the concepts and methods of the sciences of mind and behaviour.", "b": "09"}, {"n": 709, "t": "Philosophy of Social Science", "s": "The study of whether the social sciences differ from the natural sciences in their methods and aims.", "b": "09"}, {"n": 710, "t": "Methodological Individualism", "s": "The thesis that social phenomena should be explained by the actions of individuals.", "b": "09"}, {"n": 711, "t": "Holism in Social Science", "s": "The view that social wholes have properties not reducible to individuals.", "b": "09"}, {"n": 712, "t": "Verstehen", "s": "The interpretive understanding of human action from within, which Dilthey and Weber contrasted with natural explanation.", "b": "09"}]}]}, {"name": "Religion", "k": "10", "children": [{"name": "Views of God", "children": [{"n": 723, "t": "God", "s": "The supreme being of theism, conceived as all-powerful, all-knowing and perfectly good, whose existence and nature are the core questions of philosophical theology.", "b": "10"}, {"n": 724, "t": "Theism", "s": "The belief in a personal God who created and sustains the world.", "b": "10"}, {"n": 725, "t": "Atheism", "s": "The position that there is no God, or the lack of belief in one.", "b": "10"}, {"n": 726, "t": "Agnosticism", "s": "The view that the existence of God is unknown or unknowable, a term coined by T. H. Huxley.", "b": "10"}, {"n": 727, "t": "Pantheism", "s": "The view that God and the universe are identical, as in Spinoza.", "b": "10"}, {"n": 728, "t": "Panentheism", "s": "The view that the world is in God, though God is also more than the world.", "b": "10"}, {"n": 729, "t": "Deism", "s": "The view that God created the world but does not intervene in it, popular in the Enlightenment.", "b": "10"}, {"n": 740, "t": "Divine Attributes", "s": "Properties traditionally ascribed to God, including omnipotence, omniscience and omnibenevolence.", "b": "10"}, {"n": 741, "t": "Omnipotence", "s": "The attribute of unlimited power, and the puzzles about whether God can do the logically impossible.", "b": "10"}, {"n": 742, "t": "Omniscience", "s": "Complete knowledge, which raises questions about how it fits with human freedom.", "b": "10"}, {"n": 743, "t": "Divine Foreknowledge and Free Will", "s": "The puzzle of whether God's knowledge of the future leaves us free, which Boethius and others addressed.", "b": "10"}, {"n": 744, "t": "Divine Simplicity", "s": "The doctrine that God has no parts and is identical with his attributes.", "b": "10"}, {"n": 745, "t": "Eternity", "s": "God's relation to time, either everlasting duration or timeless existence outside time.", "b": "10"}]}, {"name": "Arguments for God", "children": [{"n": 730, "t": "Ontological Argument", "s": "Anselm's argument that God, being that than which nothing greater can be conceived, must exist in reality as well as in thought.", "b": "10"}, {"n": 731, "t": "Cosmological Argument", "s": "The argument from the existence of the world, or its contingency or beginning, to a first cause or necessary being.", "b": "10"}, {"n": 732, "t": "Kalam Argument", "s": "The argument that the universe began to exist and so must have a cause, developed by medieval Islamic thinkers.", "b": "10"}, {"n": 733, "t": "Teleological Argument", "s": "The argument from the order or design of the world to an intelligent designer, as in Paley's watch.", "b": "10"}, {"n": 734, "t": "Moral Argument", "s": "The argument that objective morality, or the possibility of moral life, requires God.", "b": "10"}, {"n": 735, "t": "Five Ways", "s": "Aquinas's five arguments for God's existence from motion, causation, contingency, degrees of perfection and design.", "b": "10"}, {"n": 771, "t": "Natural Theology", "s": "The attempt to establish truths about God by reason alone, without appeal to revelation.", "b": "10"}]}, {"name": "Evil and Hiddenness", "children": [{"n": 736, "t": "Problem of Evil", "s": "The challenge that the existence of evil and suffering is incompatible with an all-powerful, all-good God.", "b": "10"}, {"n": 737, "t": "Theodicy", "s": "An attempt to justify God's goodness in the face of evil, as in Leibniz's claim that this is the best of all possible worlds.", "b": "10"}, {"n": 738, "t": "Free Will Defence", "s": "The reply that God allowed evil in order to grant free will, which is a great good, as developed by Augustine and Plantinga.", "b": "10"}, {"n": 739, "t": "Natural and Moral Evil", "s": "The distinction between suffering caused by nature and suffering caused by human wrongdoing.", "b": "10"}, {"n": 746, "t": "Divine Hiddenness", "s": "Schellenberg's argument that a loving God would make his existence evident, so that reasonable non-belief counts against God.", "b": "10"}]}, {"name": "Faith and Experience", "children": [{"n": 747, "t": "Faith and Reason", "s": "The relation between religious belief and rational inquiry, held by turns to be harmonious or opposed.", "b": "10"}, {"n": 748, "t": "Fideism", "s": "The view that faith does not depend on reason and may be opposed to it, as in Kierkegaard.", "b": "10"}, {"n": 749, "t": "Leap of Faith", "s": "Kierkegaard's idea that religious commitment requires a passionate leap beyond what reason can justify.", "b": "10"}, {"n": 750, "t": "Teleological Suspension of the Ethical", "s": "Kierkegaard's reading of Abraham's willingness to sacrifice Isaac, in which faith overrides ethical duty.", "b": "10"}, {"n": 751, "t": "Religious Experience", "s": "Direct encounters with the divine, studied by James as evidence for religion.", "b": "10"}, {"n": 752, "t": "Mysticism", "s": "Experience of union with ultimate reality, found across traditions and raising questions of ineffability.", "b": "10"}, {"n": 753, "t": "Miracles", "s": "Events that violate natural law, which Hume argued can never be believed on the basis of testimony.", "b": "10"}, {"n": 766, "t": "Reformed Epistemology and Religion", "s": "Plantinga's defence of belief in God as rational without argument.", "b": "10"}, {"n": 767, "t": "Apophatic Mysticism", "s": "The tradition of unknowing in which the divine is approached by silence and negation.", "b": "10"}, {"n": 772, "t": "Revelation", "s": "Disclosure of divine truth to humanity, in contrast with knowledge by reason alone.", "b": "10"}]}, {"name": "Language and Doctrine", "children": [{"n": 759, "t": "Religious Language", "s": "The problem of how words can describe a transcendent God, answered by analogy, symbol or via negativa.", "b": "10"}, {"n": 760, "t": "Negative Theology", "s": "The approach of describing God only by what God is not, to avoid limiting the divine.", "b": "10"}, {"n": 761, "t": "Via Negativa", "s": "The path of approaching God by negation, a method of Pseudo-Dionysius and Maimonides.", "b": "10"}, {"n": 768, "t": "Predestination", "s": "The doctrine that God has determined in advance who will be saved, central to Augustine and Calvin.", "b": "10"}, {"n": 769, "t": "Grace", "s": "In Christian thought, the unmerited gift of divine favour, a central matter in debates about salvation and works.", "b": "10"}, {"n": 770, "t": "Original Sin", "s": "The Christian doctrine that humanity inherits a sinful condition from Adam's fall.", "b": "10"}, {"n": 774, "t": "Philosophy of Religion", "s": "The study of the concepts and arguments of religious belief, covering God, evil, faith and the afterlife.", "b": "10"}, {"n": 775, "t": "Scholasticism", "s": "The medieval method and tradition of Aquinas, Anselm and Scotus that used logical analysis and disputation to reconcile Christian doctrine with Aristotelian philosophy.", "b": "10"}]}, {"name": "Death and Afterlife", "children": [{"n": 756, "t": "Afterlife", "s": "The continued existence of persons after death, a hope in many religions and a puzzle for personal identity.", "b": "10"}, {"n": 757, "t": "Immortality of the Soul", "s": "Plato's thesis that the soul is imperishable and survives the death of the body.", "b": "10"}, {"n": 758, "t": "Resurrection", "s": "The Christian belief that the dead will be raised bodily, which raises puzzles of identity.", "b": "10"}]}, {"name": "Religion and Society", "children": [{"n": 754, "t": "Religious Pluralism", "s": "The view of Hick that the great religions are different responses to one ultimate reality.", "b": "10"}, {"n": 755, "t": "Exclusivism and Inclusivism", "s": "Views on whether only one religion is true or whether others share in truth to some degree.", "b": "10"}, {"n": 762, "t": "Secularization", "s": "The decline of the social and cultural authority of religion in modern societies.", "b": "10"}, {"n": 763, "t": "Death of God", "s": "Nietzsche's proclamation that belief in God has become untenable, and that the foundations of Western morality are shaken.", "b": "10"}, {"n": 764, "t": "Projection Theory of Religion", "s": "Feuerbach's view that God is a projection of human qualities onto an imagined being.", "b": "10"}, {"n": 765, "t": "Opium of the People", "s": "Marx's description of religion as a consoling illusion that masks social suffering.", "b": "10"}, {"n": 773, "t": "Religious Tolerance", "s": "The principle that different faiths may coexist peacefully, defended by Locke, Voltaire and Mendelssohn.", "b": "10"}]}]}, {"name": "Continental", "k": "11", "children": [{"name": "Existentialism", "children": [{"n": 776, "t": "Existentialism", "s": "The movement, from Kierkegaard through Sartre, that begins from individual existence, freedom and choice in a world without given meaning.", "b": "11"}, {"n": 777, "t": "Authenticity", "s": "Living in accord with one's own choices and being, in contrast to conforming to the crowd, a theme in Heidegger and Sartre.", "b": "11"}, {"n": 778, "t": "Bad Faith", "s": "Sartre's term for self-deception in which one denies one's freedom by pretending to be a fixed thing.", "b": "11"}, {"n": 779, "t": "Absurd", "s": "Camus's term for the clash between our demand for meaning and the silence of the universe.", "b": "11"}, {"n": 780, "t": "Revolt", "s": "Camus's response to the absurd: to live in defiance, without hope or despair.", "b": "11"}, {"n": 781, "t": "Myth of Sisyphus", "s": "Camus's essay that treats Sisyphus condemned to roll a rock as the image of absurd life, which one must imagine happy.", "b": "11"}, {"n": 782, "t": "Anguish", "s": "In Kierkegaard and Sartre, the dizzying awareness of one's freedom and responsibility.", "b": "11"}, {"n": 783, "t": "Angst", "s": "Heidegger's term for the basic mood in which the nothingness of existence is disclosed.", "b": "11"}, {"n": 784, "t": "Being-for-Itself", "s": "Sartre's term for consciousness, which is free and lacks fixed nature, as opposed to being-in-itself.", "b": "11"}, {"n": 785, "t": "Being-in-Itself", "s": "Sartre's term for the solid, self-identical being of things, which simply is.", "b": "11"}, {"n": 786, "t": "Condemned to Be Free", "s": "Sartre's thesis that human beings cannot escape freedom and must choose even when they refuse to.", "b": "11"}, {"n": 787, "t": "The Look", "s": "Sartre's analysis of how being seen by another turns one into an object and reveals shame.", "b": "11"}, {"n": 788, "t": "Facticity", "s": "The given circumstances of one's existence, such as body, past and situation, which one cannot choose.", "b": "11"}, {"n": 789, "t": "Transcendence", "s": "The human capacity to go beyond what is given by projecting oneself toward possibilities.", "b": "11"}, {"n": 808, "t": "Leap and Stages of Existence", "s": "Kierkegaard's account of aesthetic, ethical and religious ways of life, with transitions through leaps.", "b": "11"}, {"n": 809, "t": "Subjectivity is Truth", "s": "Kierkegaard's claim that in matters of existence, the manner of holding a belief matters more than its content.", "b": "11"}]}, {"name": "Heidegger", "children": [{"n": 790, "t": "Dasein", "s": "Heidegger's term for the human mode of being, the being for whom being is an issue.", "b": "11"}, {"n": 791, "t": "Being-in-the-World", "s": "Heidegger's thesis that we are always already engaged with a world of tools and others, not detached subjects.", "b": "11"}, {"n": 792, "t": "Being-toward-Death", "s": "Heidegger's idea that confronting one's own mortality is the key to authentic existence.", "b": "11"}, {"n": 793, "t": "Thrownness", "s": "Heidegger's term for the fact that we find ourselves already in a world not of our choosing.", "b": "11"}, {"n": 794, "t": "Ready-to-Hand", "s": "Heidegger's term for equipment as used in practice, as opposed to present-at-hand objects observed theoretically.", "b": "11"}, {"n": 795, "t": "The They", "s": "Heidegger's das Man, the anonymous public norms that govern everyday life and dissolve individuality.", "b": "11"}, {"n": 796, "t": "Ontological Difference", "s": "Heidegger's distinction between beings and the Being by which they are, which philosophy has forgotten.", "b": "11"}, {"n": 797, "t": "Care", "s": "Heidegger's name for the basic structure of Dasein as concerned about its own existence.", "b": "11"}]}, {"name": "Phenomenology and the Other", "children": [{"n": 798, "t": "Phenomenology", "s": "Husserl's study of the structures of experience as they appear to consciousness.", "b": "11"}, {"n": 799, "t": "Epoché", "s": "Husserl's bracketing of assumptions about the existence of the world in order to describe experience as it is given.", "b": "11"}, {"n": 800, "t": "Intentionality in Phenomenology", "s": "Husserl's thesis that all consciousness is consciousness of something.", "b": "11"}, {"n": 801, "t": "Lifeworld", "s": "Husserl's term for the pre-theoretical world of lived experience that underlies scientific abstraction.", "b": "11"}, {"n": 802, "t": "Embodiment", "s": "Merleau-Ponty's view that the lived body is the subject of perception and not an object among others.", "b": "11"}, {"n": 803, "t": "Lived Body", "s": "The body as experienced from within, in contrast with the body as a physical object.", "b": "11"}, {"n": 804, "t": "Intersubjectivity", "s": "The shared structure of experience among subjects, important in Husserl and Schutz.", "b": "11"}, {"n": 805, "t": "Alterity", "s": "Otherness; Levinas held that the encounter with the Other, not the self, grounds ethics.", "b": "11"}, {"n": 806, "t": "Face of the Other", "s": "Levinas's image of the other person's face, which commands responsibility before any theory.", "b": "11"}, {"n": 807, "t": "Ethics as First Philosophy", "s": "Levinas's thesis that responsibility for the Other precedes ontology.", "b": "11"}]}, {"name": "Nietzsche and Life Philosophy", "children": [{"n": 810, "t": "Eternal Return", "s": "Nietzsche's thought experiment of living one's life again infinitely, as a test of affirming life.", "b": "11"}, {"n": 811, "t": "Amor Fati", "s": "Nietzsche's love of fate, the willingness to affirm everything that happens, even suffering.", "b": "11"}, {"n": 812, "t": "Übermensch", "s": "Nietzsche's overman, who creates new values after the death of God.", "b": "11"}, {"n": 813, "t": "Perspectivism", "s": "Nietzsche's view that all knowledge is from a perspective and that no view from nowhere exists.", "b": "11"}, {"n": 814, "t": "Nihilism", "s": "The loss of belief in meaning or value, which Nietzsche saw as the crisis of modernity.", "b": "11"}, {"n": 815, "t": "Duration", "s": "Bergson's term for time as lived, a continuous flow that spatialised clock time distorts.", "b": "11"}, {"n": 816, "t": "Élan Vital", "s": "Bergson's vital impetus, a creative force in evolution.", "b": "11"}, {"n": 822, "t": "Will", "s": "Schopenhauer's blind, striving reality underlying appearance, the source of suffering.", "b": "11"}, {"n": 823, "t": "Pessimism", "s": "Schopenhauer's view that existence is dominated by suffering and that the best response is denial of the will.", "b": "11"}]}, {"name": "Kant and German Idealism", "children": [{"n": 817, "t": "Spirit", "s": "Hegel's Geist, the self-developing reality that comes to know itself through history.", "b": "11"}, {"n": 818, "t": "Phenomenology of Spirit", "s": "Hegel's 1807 account of consciousness developing through stages to absolute knowing.", "b": "11"}, {"n": 819, "t": "Master-Slave Dialectic", "s": "Hegel's analysis of the struggle for recognition in which the dependent servant achieves self-consciousness through work.", "b": "11"}, {"n": 820, "t": "Aufhebung", "s": "Hegel's term for sublation: the cancelling, preserving and lifting up of a stage in a higher unity.", "b": "11"}, {"n": 821, "t": "Cunning of Reason", "s": "Hegel's idea that history advances reason's ends through the passions and self-interested actions of individuals.", "b": "11"}, {"n": 824, "t": "Critical Philosophy", "s": "Kant's project of examining the limits and conditions of reason before applying it.", "b": "11"}, {"n": 825, "t": "Copernican Revolution in Philosophy", "s": "Kant's turn from asking how the mind conforms to objects to asking how objects conform to the mind.", "b": "11"}, {"n": 826, "t": "Categories of Understanding", "s": "Kant's twelve pure concepts, such as causality and substance, by which the mind structures experience.", "b": "11"}, {"n": 827, "t": "Antinomies", "s": "Kant's pairs of contradictory conclusions reason falls into when it applies its categories beyond experience.", "b": "11"}, {"n": 828, "t": "Critique of Pure Reason", "s": "Kant's 1781 work examining what reason can know apart from experience and where it oversteps its limits.", "b": "11"}, {"n": 829, "t": "Enlightenment", "s": "Kant's \"emergence from self-incurred immaturity\" through daring to use one's own reason.", "b": "11"}, {"n": 830, "t": "German Idealism", "s": "The movement of Fichte, Schelling and Hegel that developed Kant's philosophy into systems of the self-determining mind.", "b": "11"}, {"n": 831, "t": "Romanticism", "s": "The movement valuing feeling, nature and creative individuality against Enlightenment rationalism.", "b": "11"}]}, {"name": "Pragmatism", "children": [{"n": 832, "t": "Pragmatism", "s": "The American school of Peirce, James and Dewey that tests ideas by their practical consequences.", "b": "11"}, {"n": 833, "t": "Pragmatic Maxim", "s": "Peirce's rule that the meaning of a concept lies in its conceivable practical effects.", "b": "11"}, {"n": 834, "t": "Neopragmatism", "s": "Rorty's and Brandom's revival of pragmatism that rejects the idea of the mind as a mirror of nature.", "b": "11"}]}, {"name": "Critical and Postmodern Theory", "children": [{"n": 835, "t": "Psychoanalysis", "s": "Freud's theory of the unconscious, which challenged the Cartesian transparency of mind.", "b": "11"}, {"n": 836, "t": "Unconscious", "s": "The mental processes beyond awareness that shape thought and behaviour, according to Freud.", "b": "11"}, {"n": 837, "t": "Dialectic of Enlightenment", "s": "Adorno and Horkheimer's argument that Enlightenment reason reverts into domination.", "b": "11"}, {"n": 838, "t": "One-Dimensional Man", "s": "Marcuse's thesis that advanced industrial society suppresses critical thought.", "b": "11"}, {"n": 839, "t": "Society of the Spectacle", "s": "Debord's thesis that modern life is mediated by images and commodities.", "b": "11"}, {"n": 840, "t": "Rhizome", "s": "Deleuze and Guattari's image of non-hierarchical, interconnected thought contrasted with the tree.", "b": "11"}, {"n": 841, "t": "Archaeology of Knowledge", "s": "Foucault's method of uncovering the rules governing what can be said in an historical period.", "b": "11"}, {"n": 842, "t": "Postmodernism", "s": "The skepticism toward grand narratives and universal truths, associated with Lyotard.", "b": "11"}, {"n": 843, "t": "Incredulity toward Metanarratives", "s": "Lyotard's definition of the postmodern condition as distrust of grand stories, such as progress or emancipation, that claim to legitimise all knowledge.", "b": "11"}, {"n": 844, "t": "Poststructuralism", "s": "The movement after structuralism, including Derrida, Foucault and Deleuze, that stresses instability of meaning and structure.", "b": "11"}, {"n": 845, "t": "Speculative Realism", "s": "A recent movement that rejects the primacy of human access to the world over reality independent of thought.", "b": "11"}]}]}, {"name": "Action and Identity", "k": "12", "children": [{"name": "Free Will Debate", "children": [{"n": 846, "t": "Free Will", "s": "The capacity of agents to choose among alternatives and to be the source of their actions, the subject of one of philosophy's oldest debates.", "b": "12"}, {"n": 847, "t": "Determinism", "s": "The thesis that every event is necessitated by prior events and the laws of nature.", "b": "12"}, {"n": 848, "t": "Compatibilism", "s": "The view that free will is compatible with determinism, defended by Hume, Frankfurt and Dennett.", "b": "12"}, {"n": 849, "t": "Incompatibilism", "s": "The view that free will and determinism cannot both be true.", "b": "12"}, {"n": 850, "t": "Libertarianism about Free Will", "s": "The incompatibilist view that we have free will and that determinism is false.", "b": "12"}, {"n": 851, "t": "Hard Determinism", "s": "The view that determinism is true and that therefore there is no free will.", "b": "12"}, {"n": 852, "t": "Hard Incompatibilism", "s": "Pereboom's view that free will, in the sense required for desert, is incompatible with both determinism and indeterminism.", "b": "12"}, {"n": 853, "t": "Consequence Argument", "s": "Van Inwagen's argument that if determinism is true, our acts are consequences of facts we cannot control.", "b": "12"}, {"n": 854, "t": "Principle of Alternate Possibilities", "s": "The principle that a person is responsible only if they could have done otherwise.", "b": "12"}, {"n": 855, "t": "Frankfurt Cases", "s": "Frankfurt's examples of agents who are responsible though they could not have done otherwise, challenging the principle of alternate possibilities.", "b": "12"}, {"n": 856, "t": "Hierarchical Theory of Free Will", "s": "Frankfurt's view that freedom involves having the will one wants to have, through second-order desires.", "b": "12"}, {"n": 857, "t": "Reasons-Responsiveness", "s": "The view that an agent is free when they respond appropriately to reasons, as in Fischer and Ravizza.", "b": "12"}, {"n": 858, "t": "Agent Causation", "s": "The view that free actions are caused directly by agents, not by prior events.", "b": "12"}, {"n": 859, "t": "Event-Causal Libertarianism", "s": "The view that free actions are undetermined events caused by the agent's mental states.", "b": "12"}, {"n": 860, "t": "Luck Objection", "s": "The challenge that indeterministic choices seem random and hence not free.", "b": "12"}, {"n": 861, "t": "Manipulation Argument", "s": "Pereboom's argument that a manipulated agent is unfree, and that determinism is relevantly like manipulation.", "b": "12"}, {"n": 862, "t": "Basic Argument", "s": "Galen Strawson's argument that no one can be ultimately responsible for who they are and so for what they do.", "b": "12"}, {"n": 863, "t": "Reactive Attitudes", "s": "Strawson's idea that resentment and gratitude are natural responses that underlie our practice of holding responsible.", "b": "12"}, {"n": 864, "t": "Illusionism about Free Will", "s": "The view that belief in free will is an illusion that may nonetheless be useful.", "b": "12"}, {"n": 865, "t": "Neuroscience and Free Will", "s": "The issue raised by Libet's experiments about whether unconscious brain activity precedes conscious decisions.", "b": "12"}, {"n": 866, "t": "Fatalism", "s": "The view that what will happen is fixed regardless of what we do.", "b": "12"}]}, {"name": "Action and Agency", "children": [{"n": 867, "t": "Action", "s": "What agents do, as opposed to what merely happens to them; philosophers ask what distinguishes the two.", "b": "12"}, {"n": 868, "t": "Intention", "s": "The mental state of aiming to act, which Anscombe distinguished from mere prediction.", "b": "12"}, {"n": 869, "t": "Reasons and Causes", "s": "The debate over whether an agent's reasons for acting are also causes of the action, as Davidson maintained.", "b": "12"}, {"n": 870, "t": "Practical Reason", "s": "Reasoning about what to do, as opposed to reasoning about what to believe.", "b": "12"}, {"n": 871, "t": "Intention and Foresight", "s": "The distinction between what an agent aims at and what they merely foresee as a side effect.", "b": "12"}, {"n": 872, "t": "Weakness of Will", "s": "Acting against one's own considered judgment of what is best.", "b": "12"}, {"n": 873, "t": "Self-Control", "s": "The capacity to govern one's impulses in line with one's values.", "b": "12"}, {"n": 874, "t": "Self-Deception", "s": "Believing something while at some level knowing it to be false, which poses puzzles about the unity of the mind.", "b": "12"}, {"n": 875, "t": "Moral Agency", "s": "The capacity to act on moral reasons and to be held accountable.", "b": "12"}, {"n": 876, "t": "Collective Intentionality", "s": "The capacity of groups to share intentions and act together, studied by Searle and Bratman.", "b": "12"}, {"n": 877, "t": "Joint Action", "s": "Action performed by several agents together, analysed in terms of shared intentions.", "b": "12"}]}, {"name": "Personal Identity", "children": [{"n": 878, "t": "Personal Identity", "s": "The question of what makes a person at one time the same as a person at another.", "b": "12"}, {"n": 879, "t": "Psychological Continuity", "s": "The view, from Locke, that personal identity consists in the continuity of memory and character.", "b": "12"}, {"n": 880, "t": "Bodily Criterion", "s": "The view that personal identity consists in the continuation of the same body or brain.", "b": "12"}, {"n": 881, "t": "Animalism", "s": "The view that we are human animals and that personal identity is that of an organism.", "b": "12"}, {"n": 882, "t": "Teletransportation", "s": "Parfit's thought experiment of being scanned and recreated elsewhere, to test what matters in survival.", "b": "12"}, {"n": 883, "t": "Fission", "s": "Cases in which a person divides into two, used by Parfit to argue that identity is not what matters.", "b": "12"}, {"n": 884, "t": "What Matters in Survival", "s": "Parfit's thesis that psychological continuity and connectedness, not identity, is what matters.", "b": "12"}, {"n": 885, "t": "Reductionism about Persons", "s": "Parfit's view that a person's existence consists in other facts such as brain events and mental states.", "b": "12"}, {"n": 886, "t": "Narrative Identity", "s": "The view that a person's identity is formed by the story they tell about their life.", "b": "12"}, {"n": 887, "t": "Soul", "s": "The immaterial principle of life or mind in Plato, Aristotle and Christian thought, whose existence is disputed.", "b": "12"}]}, {"name": "Death and Meaning", "children": [{"n": 888, "t": "Death", "s": "The end of life, whose badness Epicurus denied and Nagel defended as a deprivation.", "b": "12"}, {"n": 889, "t": "Epicurus on Death", "s": "The view that death is nothing to us, since when we exist death is not, and when death exists we are not.", "b": "12"}, {"n": 890, "t": "Deprivation Account of Death", "s": "Nagel's view that death is bad because it deprives us of the goods of continued life.", "b": "12"}, {"n": 891, "t": "Meaning of Life", "s": "The question of whether life has a purpose or significance, answered by religion, humanism and nihilism.", "b": "12"}, {"n": 892, "t": "Happiness", "s": "The good life for a person, understood as pleasure, satisfaction or flourishing.", "b": "12"}, {"n": 901, "t": "Love", "s": "Philosophers analyse love as desire for the beautiful (Plato), union (Aristophanes), valuing, or concern for the beloved's good.", "b": "12"}, {"n": 902, "t": "Platonic Love", "s": "Plato's ascent from love of a body to love of Beauty itself, as in the Symposium.", "b": "12"}]}, {"name": "Hellenistic Schools", "children": [{"n": 893, "t": "Stoic Acceptance", "s": "The Stoic view that peace comes from accepting what is outside our control and attending to what is within it.", "b": "12"}, {"n": 894, "t": "Dichotomy of Control", "s": "Epictetus's distinction between what is up to us, such as judgments, and what is not.", "b": "12"}, {"n": 895, "t": "Ataraxia", "s": "The Hellenistic ideal of tranquillity, freedom from disturbance, sought by Epicureans and skeptics.", "b": "12"}, {"n": 896, "t": "Apatheia", "s": "The Stoic ideal of freedom from destructive passions.", "b": "12"}, {"n": 897, "t": "Cynicism", "s": "The ancient school, from Diogenes, that rejected convention and sought a life in accord with nature.", "b": "12"}, {"n": 898, "t": "Epicureanism", "s": "The philosophy of Epicurus that sought tranquil pleasure through modest desires and friendship.", "b": "12"}, {"n": 899, "t": "Stoicism", "s": "The school of Zeno, Epictetus, Seneca and Marcus Aurelius that taught virtue as the sole good and life in accord with reason.", "b": "12"}, {"n": 900, "t": "Logos", "s": "In Heraclitus and the Stoics, the rational order of the cosmos, also word and reason.", "b": "12"}]}]}, {"name": "Non-Western", "k": "13", "children": [{"name": "Hindu and Vedic Thought", "children": [{"n": 903, "t": "Dharma", "s": "In Indian thought, the order of the cosmos and the duty and right conduct that sustains it, with specific meanings in Hindu, Buddhist and Jain traditions.", "b": "13"}, {"n": 904, "t": "Karma", "s": "The doctrine that intentional actions have moral consequences that shape one's future, including later rebirths.", "b": "13"}, {"n": 905, "t": "Samsara", "s": "The cycle of birth, death and rebirth that Indian traditions seek to escape.", "b": "13"}, {"n": 906, "t": "Moksha", "s": "Liberation from the cycle of rebirth, the supreme goal in many Indian traditions.", "b": "13"}, {"n": 907, "t": "Atman", "s": "The self or soul, which the Upanishads identify with the ultimate reality.", "b": "13"}, {"n": 908, "t": "Brahman", "s": "The ultimate, unchanging reality underlying the world in Vedic and Vedantic thought.", "b": "13"}, {"n": 909, "t": "Maya", "s": "In Advaita Vedanta, the power by which the one reality appears as a world of multiplicity.", "b": "13"}, {"n": 910, "t": "Advaita Vedanta", "s": "Shankara's non-dualist school holding that Atman and Brahman are one and that the world of difference is appearance.", "b": "13"}, {"n": 911, "t": "Vishishtadvaita", "s": "Ramanuja's qualified non-dualism, in which souls and world are real but dependent parts of Brahman.", "b": "13"}, {"n": 912, "t": "Dvaita Vedanta", "s": "Madhva's dualism, which holds that God and individual souls are eternally distinct.", "b": "13"}, {"n": 913, "t": "Upanishads", "s": "The philosophical texts of the Vedic tradition that explore the self, Brahman and liberation.", "b": "13"}, {"n": 914, "t": "Rta", "s": "The Vedic idea of cosmic order that governs nature and ritual and anticipates dharma.", "b": "13"}]}, {"name": "Indian Schools", "children": [{"n": 915, "t": "Samkhya", "s": "The dualist school that explains the world through two ultimate principles, spirit and nature.", "b": "13"}, {"n": 916, "t": "Purusha and Prakriti", "s": "Samkhya's dual principles of conscious spirit and unconscious nature, whose entanglement causes suffering.", "b": "13"}, {"n": 917, "t": "Yoga Philosophy", "s": "Patanjali's system of disciplined practice leading to the cessation of mental fluctuation and the isolation of the self.", "b": "13"}, {"n": 918, "t": "Nyaya", "s": "The Indian school of logic and epistemology that analyses the means of valid knowledge and the structure of debate.", "b": "13"}, {"n": 919, "t": "Pramana", "s": "The accepted means of valid knowledge in Indian thought, such as perception, inference and testimony.", "b": "13"}, {"n": 920, "t": "Vaisheshika", "s": "The atomist school that classifies reality into categories such as substance, quality and action.", "b": "13"}, {"n": 921, "t": "Mimamsa", "s": "The school devoted to interpreting Vedic ritual, holding the Vedas to be eternal and authorless.", "b": "13"}]}, {"name": "Jain Thought", "children": [{"n": 922, "t": "Anekantavada", "s": "The Jain doctrine of many-sidedness, that reality is too complex to be captured by any single viewpoint.", "b": "13"}, {"n": 923, "t": "Syadvada", "s": "The Jain doctrine that every statement is true only in some respect, expressed with a qualifying \"in some way\".", "b": "13"}, {"n": 924, "t": "Ahimsa", "s": "Non-violence toward all living beings, a central virtue in Jainism, Buddhism and Hinduism, later used by Gandhi.", "b": "13"}]}, {"name": "Core Buddhism", "children": [{"n": 925, "t": "Four Noble Truths", "s": "The Buddha's teaching that life involves suffering, which has a cause, can cease, and has a path to its end.", "b": "13"}, {"n": 926, "t": "Noble Eightfold Path", "s": "The Buddhist path of right view, intention, speech, action, livelihood, effort, mindfulness and concentration.", "b": "13"}, {"n": 927, "t": "Dependent Origination", "s": "The Buddhist teaching that all phenomena arise in dependence on conditions and have no independent existence.", "b": "13"}, {"n": 928, "t": "Dukkha", "s": "The Buddhist term for suffering or unsatisfactoriness, the characteristic of conditioned existence.", "b": "13"}, {"n": 929, "t": "Impermanence", "s": "The Buddhist doctrine that all conditioned things are transient and in constant change.", "b": "13"}, {"n": 930, "t": "Nirvana", "s": "The Buddhist goal of the extinction of craving and suffering, and release from rebirth.", "b": "13"}, {"n": 931, "t": "Middle Way", "s": "The Buddha's path between self-indulgence and extreme asceticism, and between eternalism and annihilationism.", "b": "13"}, {"n": 938, "t": "Compassion", "s": "The Buddhist virtue of karuna, wishing to relieve the suffering of others, joined to wisdom.", "b": "13"}, {"n": 939, "t": "Mindfulness", "s": "The Buddhist practice of attentive awareness of the present moment as a path to insight.", "b": "13"}, {"n": 940, "t": "Abhidharma", "s": "The systematic Buddhist analysis of experience into basic constituents called dharmas.", "b": "13"}]}, {"name": "Mahayana Philosophy", "children": [{"n": 932, "t": "Emptiness", "s": "Nagarjuna's doctrine that all things lack inherent nature and exist only in dependence on other things.", "b": "13"}, {"n": 933, "t": "Madhyamaka", "s": "Nagarjuna's school that develops the doctrine of emptiness through a critique of all fixed views.", "b": "13"}, {"n": 934, "t": "Two Truths", "s": "The Buddhist distinction between conventional truth and ultimate truth, as interpreted by Madhyamaka.", "b": "13"}, {"n": 935, "t": "Yogacara", "s": "The Buddhist school that teaches that experience is structured by consciousness and that the world is mind-dependent.", "b": "13"}, {"n": 936, "t": "Buddha-Nature", "s": "The Mahayana teaching that all beings have the potential for awakening.", "b": "13"}, {"n": 937, "t": "Bodhisattva", "s": "One who vows to attain awakening for the sake of all beings and postpones final release to help them.", "b": "13"}, {"n": 941, "t": "Buddhist Logic", "s": "Dignaga's and Dharmakirti's theory of knowledge, which treats perception and inference as the only valid means.", "b": "13"}, {"n": 942, "t": "Catuskoti", "s": "The four-cornered logic of affirming, denying, both and neither, used in Buddhist argument.", "b": "13"}]}, {"name": "Zen and Kyoto School", "children": [{"n": 943, "t": "Zen", "s": "The Buddhist school, from Chan, that emphasises direct insight through meditation and beyond doctrinal study.", "b": "13"}, {"n": 944, "t": "Satori", "s": "In Zen, a sudden flash of awakening or insight into one's true nature.", "b": "13"}, {"n": 945, "t": "Koan", "s": "A paradoxical riddle used in Zen to break the grip of discursive thought.", "b": "13
